<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style><title>Phòng Lab R–SEM</title>
<meta name="author" content="Nguyễn Bình Phương Duy">
<meta name="description" content="20 bài tự học phân tích dữ liệu khảo sát bằng R: pilot test, làm sạch, thang đo, CB-SEM với lavaan và PLS-SEM với seminr, có kết quả R thật và R chạy ngay trên trình duyệt.">
<meta property="og:title" content="Phòng Lab R–SEM">
<meta property="og:description" content="Tự học R từ A đến Z, trọng tâm CB-SEM (lavaan) và PLS-SEM (seminr). Người phát triển: Nguyễn Bình Phương Duy.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,650&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Bố cục: thanh trên cố định + cột lộ trình bên trái + cột bài đọc ~70ch; khối mã như sổ ghi chép (mã ở trên, kết quả R ở dưới) */
:root {
  --paper: #f3f5f8; --card: #ffffff; --ink: #142235; --ink-2: #4f5f75; --ink-3: #7a879a;
  --line: #d8dfe8; --line-2: #e7ecf2;
  --accent: #1f5fae; --accent-soft: #e3edf9; --accent-ink: #ffffff;
  --latent: #b8711a; --latent-soft: #f8ecdb;
  --code-bg: #eef2f7; --out-bg: #fbfcfd;
  --ok: #2b7a4b; --ok-soft: #e2f2e8; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b3261e; --bad-soft: #fbe5e3;
  --tk-kw: #8a3ffc; --tk-str: #1d7a4f; --tk-com: #7a879a; --tk-num: #b8711a; --tk-fn: #1f5fae; --tk-op: #c03a6b;
  --f-display: "Literata", "Iowan Old Style", Georgia, serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(20, 34, 53, .06), 0 4px 18px rgba(20, 34, 53, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --card: #131e2c; --ink: #dfe7f1; --ink-2: #a3b2c5; --ink-3: #74859b;
    --line: #26364b; --line-2: #1c2a3b;
    --accent: #79aef7; --accent-soft: #1a2c45; --accent-ink: #0d1520;
    --latent: #e3a550; --latent-soft: #33261a;
    --code-bg: #0a111b; --out-bg: #0f1925;
    --ok: #63c48f; --ok-soft: #15301f; --warn: #e6aa55; --warn-soft: #33270f; --bad: #ff8a7e; --bad-soft: #3a1714;
    --tk-kw: #c3a3ff; --tk-str: #7fd3a5; --tk-com: #6f8197; --tk-num: #e8b26a; --tk-fn: #8cbcff; --tk-op: #ff8fb6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --card: #131e2c; --ink: #dfe7f1; --ink-2: #a3b2c5; --ink-3: #74859b;
  --line: #26364b; --line-2: #1c2a3b;
  --accent: #79aef7; --accent-soft: #1a2c45; --accent-ink: #0d1520;
  --latent: #e3a550; --latent-soft: #33261a;
  --code-bg: #0a111b; --out-bg: #0f1925;
  --ok: #63c48f; --ok-soft: #15301f; --warn: #e6aa55; --warn-soft: #33270f; --bad: #ff8a7e; --bad-soft: #3a1714;
  --tk-kw: #c3a3ff; --tk-str: #7fd3a5; --tk-com: #6f8197; --tk-num: #e8b26a; --tk-fn: #8cbcff; --tk-op: #ff8fb6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15.5px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.25; text-wrap: balance; letter-spacing: -.005em; }
code, pre, kbd { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- thanh trên ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 18px; max-width: 1320px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 600; white-space: nowrap; font-size: 15px; }
.brand b { font-family: var(--f-display); font-weight: 650; }
.brand-mark { width: 34px; height: 24px; fill: none; stroke: var(--accent); stroke-width: 2; }
.brand-mark ellipse:first-child { fill: var(--accent-soft); }
.brand-mark ellipse:nth-child(2) { stroke: var(--latent); fill: var(--latent-soft); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 6px 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: var(--line-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a.nav-live { color: var(--latent); }
.nav a.nav-live.on { background: var(--latent-soft); color: var(--latent); }
.nav-toggle { display: none; margin-left: auto; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
@media (max-width: 860px) {
  .nav-toggle { display: block; }
  .top-in { flex-wrap: wrap; }
  .nav { display: none; flex-basis: 100%; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; }
  .nav.open { display: flex; }
}

.main { max-width: 1320px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }

/* ---------- trang đầu ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; align-items: center; padding: 8px 0 34px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(30px, 4.2vw, 48px); margin: 0 0 14px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { font-size: 17px; color: var(--ink-2); max-width: 58ch; margin: 0 0 20px; }
.eyebrow { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--latent); font-weight: 600; margin: 0 0 10px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 15px; border-radius: 9px; font-size: 14.5px; font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: default; }
.model-fig { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; box-shadow: var(--shadow); min-width: 0; }
.model-fig svg { width: 100%; height: auto; display: block; }
.model-fig figcaption { font-size: 12.5px; color: var(--ink-3); padding: 6px 4px 4px; }
.pm-lv ellipse { fill: var(--card); stroke: var(--ink-2); stroke-width: 1.6; }
.pm-lv text { fill: var(--ink); font: 600 15px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.pm-lv .sub { font: 400 10.5px var(--f-body); fill: var(--ink-3); }
.pm-path { stroke: var(--ink-3); stroke-width: 1.6; fill: none; }
.pm-coef { font: 600 11.5px var(--f-mono); fill: var(--ink-2); text-anchor: middle; }
.pm-coef-bg { fill: var(--card); }
.pm-ah { fill: var(--ink-3); }
.pm-hi ellipse { stroke: var(--latent); stroke-width: 2.4; fill: var(--latent-soft); }
.pm-path.hi { stroke: var(--latent); stroke-width: 2.6; }
.pm-ah.hi { fill: var(--latent); }
.pm-coef.hi { fill: var(--latent); }
.pm-item rect { fill: var(--code-bg); stroke: var(--line); }
.pm-item text { font: 10px var(--f-mono); fill: var(--ink-3); text-anchor: middle; dominant-baseline: central; }
.pm-dim { opacity: .35; }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 38px 0 16px; }
.section-h h2 { margin: 0; font-size: 26px; }
.section-h p { margin: 0; color: var(--ink-2); }
.road { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 14px; }
@media (max-width: 1000px) { .road { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .road { grid-template-columns: minmax(0, 1fr); } }
.phase { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.phase-h { padding: 0 2px 6px; border-bottom: 2px solid var(--line); }
.phase-h .n { font: 600 12px var(--f-mono); color: var(--latent); letter-spacing: .06em; }
.phase.branch .phase-h { border-bottom-color: var(--accent); }
.phase.branch .phase-h .n { color: var(--accent); }
.phase-h h3 { margin: 2px 0 2px; font-size: 18px; }
.phase-h p { margin: 0; font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.lcard { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 12px; color: var(--ink); text-decoration: none; transition: border-color .15s; }
.lcard:hover { border-color: var(--accent); }
.lcard .no { font: 600 14px var(--f-mono); color: var(--ink-3); padding-top: 1px; }
.lcard .t { font-weight: 600; font-size: 14.5px; line-height: 1.38; }
.lcard .m { grid-column: 2; font-size: 12.5px; color: var(--ink-3); }
.lcard.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.lcard.done .no { color: var(--ok); }
.progress { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
.bar { width: 180px; max-width: 40vw; height: 8px; border-radius: 9px; background: var(--line-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 9px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .how { grid-template-columns: minmax(0, 1fr); } }
.how > div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.how h3 { margin: 0 0 6px; font-size: 17px; }
.how p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.env { font-size: 13px; color: var(--ink-3); margin-top: 26px; }
.env code { font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; color: var(--ink-2); }

/* ---------- trang bài ---------- */
.lesson-wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 1000px) { .lesson-wrap { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow-y: auto; font-size: 13.5px; padding-right: 4px; }
.rail h4 { font: 600 11.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }
.rail h4:first-child { margin-top: 0; }
.rail a { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; padding: 5px 8px; border-radius: 7px; color: var(--ink-2); text-decoration: none; line-height: 1.4; }
.rail a:hover { background: var(--line-2); color: var(--ink); }
.rail a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail a .no { font-family: var(--f-mono); font-size: 12px; padding-top: 1px; }
.rail a.done .no { color: var(--ok); }
.lesson { max-width: 820px; min-width: 0; }
.l-head .eyebrow { margin-bottom: 6px; }
.l-head h1 { font-size: clamp(26px, 3.4vw, 36px); margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); }
.chip.pk { font-family: var(--f-mono); font-size: 12px; }
.goals { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; margin: 0 0 22px; }
.goals h3 { margin: 0 0 6px; font: 600 13px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.goals ul { margin: 0; padding-left: 20px; }
.goals li { margin: 2px 0; }
.l-fig { margin: 0 0 24px; max-width: 540px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin: 0 0 24px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }
.toc a { color: var(--ink-2); text-decoration: none; border-bottom: 1px dotted var(--ink-3); }
.toc a:hover { color: var(--accent); }
.prose h2 { font-size: 23px; margin: 38px 0 12px; scroll-margin-top: 80px; }
.prose h3 { font-size: 18px; margin: 26px 0 8px; }
.prose p, .prose li { max-width: 72ch; }
.prose ul, .prose ol { padding-left: 22px; }
.prose code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.prose blockquote { margin: 16px 0; padding: 12px 18px; border-left: 3px solid var(--latent); background: var(--latent-soft); border-radius: 0 8px 8px 0; color: var(--ink); }
.prose blockquote p { margin: 0; }
.prose table { border-collapse: collapse; font-size: 14px; width: 100%; }
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.prose th, .prose td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.prose th { font-weight: 600; background: var(--line-2); font-size: 13px; }
.prose tr:last-child td { border-bottom: 0; }
.tip, .warn, .note { margin: 16px 0; padding: 12px 16px 12px 44px; border-radius: var(--r); position: relative; font-size: 14.5px; }
.tip p, .warn p, .note p { margin: 0; }
.tip::before, .warn::before, .note::before { position: absolute; left: 14px; top: 11px; font: 700 13px var(--f-mono); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.tip { background: var(--ok-soft); } .tip::before { content: "✓"; background: var(--ok); color: var(--card); }
.warn { background: var(--warn-soft); } .warn::before { content: "!"; background: var(--warn); color: var(--card); }
.note { background: var(--accent-soft); } .note::before { content: "i"; background: var(--accent); color: var(--card); }
.l-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); }
.l-foot .btn { max-width: 100%; }
.mark-done { margin-top: 26px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); }

/* ---------- khối mã ---------- */
.chunk { margin: 16px 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.chunk-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--line-2); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.chunk-bar .lang { font: 600 11.5px var(--f-mono); color: var(--accent); letter-spacing: .05em; }
.chunk-bar .sp { flex: 1; }
.chunk-bar .tag { font-size: 12px; }
.code { margin: 0; padding: 12px 14px; background: var(--code-bg); font-size: 13.2px; line-height: 1.6; overflow-x: auto; white-space: pre; tab-size: 2; color: var(--ink); }
.tk-c { color: var(--tk-com); font-style: italic; } .tk-s { color: var(--tk-str); } .tk-k { color: var(--tk-kw); font-weight: 600; }
.tk-n { color: var(--tk-num); } .tk-f { color: var(--tk-fn); } .tk-o { color: var(--tk-op); font-weight: 600; }
.out { border-top: 1px solid var(--line); background: var(--out-bg); }
.out-bar { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.out-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.out.live .out-bar .dot { background: var(--latent); }
.out.live .out-bar { color: var(--latent); }
.out pre { margin: 0; padding: 4px 14px 12px; font-size: 12.6px; line-height: 1.5; overflow: auto; max-height: 460px; white-space: pre; color: var(--ink-2); }
.out pre.err { color: var(--bad); }
.out img { display: block; max-width: 100%; height: auto; margin: 6px 14px 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.out.collapsed pre, .out.collapsed img { display: none; }
.spin { width: 12px; height: 12px; border: 2px solid var(--latent); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

/* ---------- câu hỏi ---------- */
.quiz { display: grid; gap: 14px; margin: 14px 0; }
.qz { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.qz p.q { margin: 0 0 10px; font-weight: 600; }
.qz p.q .n { font-family: var(--f-mono); color: var(--latent); margin-right: 6px; }
.qz .opts { display: grid; gap: 6px; }
.qz button.op { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14.5px; line-height: 1.45; }
.qz button.op:hover:not(:disabled) { border-color: var(--accent); }
.qz button.op.ok { border-color: var(--ok); background: var(--ok-soft); }
.qz button.op.no { border-color: var(--bad); background: var(--bad-soft); }
.qz button.op:disabled { cursor: default; }
.qz .why { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.qz-score { font-size: 14px; color: var(--ink-2); }

/* ---------- trang công cụ ---------- */
.page-h { margin: 0 0 22px; max-width: 860px; }
.page-h h1 { font-size: clamp(26px, 3.4vw, 36px); margin: 0 0 8px; }
.page-h p { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 75ch; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 19px; margin: 0 0 10px; }
.panel h3 { font-size: 15.5px; margin: 16px 0 8px; font-family: var(--f-body); font-weight: 600; }
.panel p.hint { font-size: 13.5px; color: var(--ink-3); margin: 0 0 10px; }
label.f { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }
input[type=text], input[type=search], input[type=number], select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; width: 100%; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 12.8px; line-height: 1.5; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.cons { display: grid; gap: 8px; }
.con { display: grid; grid-template-columns: 90px minmax(0, 1fr) 128px 30px; gap: 6px; align-items: center; }
.pathrow { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
@media (max-width: 520px) { .con { grid-template-columns: 70px minmax(0, 1fr) 30px; } .con select { grid-column: 1 / 3; } }
.x { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; }
.x:hover { color: var(--bad); background: var(--bad-soft); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.codeout { position: relative; }
.codeout > .btn { position: absolute; top: 8px; right: 8px; }
.codeout pre { border: 1px solid var(--line); border-radius: 8px; }
.verdict { display: grid; gap: 6px; }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 120px; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--paper); font-size: 14px; }
.vrow .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; text-align: center; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.na { background: var(--line-2); color: var(--ink-3); }
.report { background: var(--latent-soft); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; margin-top: 12px; }
.report p { margin: 0 0 8px; } .report p:last-child { margin: 0; }
.ntable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ntable th, .ntable td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
.ntable th { font-size: 12.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.ntable td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ntable input { width: 92px; font-family: var(--f-mono); }
.search { max-width: 520px; margin-bottom: 14px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.errs { display: grid; gap: 10px; }
.err { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.err .msg { font-family: var(--f-mono); font-size: 13px; color: var(--bad); background: var(--bad-soft); padding: 6px 9px; border-radius: 6px; overflow-wrap: anywhere; margin: 4px 0 8px; }
.err .grp { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.err p { margin: 4px 0; font-size: 14.5px; }
.err pre { margin: 8px 0 0; background: var(--code-bg); padding: 8px 10px; border-radius: 6px; font-size: 12.5px; overflow-x: auto; }
.pkgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.pkg { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pkg h3 { margin: 0; font-family: var(--f-mono); font-size: 17px; }
.pkg .role { font-size: 12px; color: var(--latent); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.pkg p { margin: 0; font-size: 14px; color: var(--ink-2); }
.pkg ul { margin: 2px 0 0; padding-left: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.pkg li code { font-size: 11.5px; background: var(--code-bg); padding: 2px 6px; border-radius: 4px; display: inline-block; }
.pkg .meta { font-size: 12.5px; color: var(--ink-3); margin-top: auto; padding-top: 6px; }
.data-table { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.data-table table { border-collapse: collapse; font-size: 12.5px; font-family: var(--f-mono); }
.data-table th, .data-table td { padding: 5px 9px; border-bottom: 1px solid var(--line-2); white-space: nowrap; text-align: right; }
.data-table th { background: var(--line-2); position: sticky; top: 0; }
.data-table td:nth-child(-n+6), .data-table th:nth-child(-n+6) { text-align: left; }
.big { font: 600 34px var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.kv > div { background: var(--paper); border-radius: 8px; padding: 10px 12px; }
.kv .k { font-size: 12.5px; color: var(--ink-3); }
.kv .v { font: 600 22px var(--f-mono); font-variant-numeric: tabular-nums; }
.live-state { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--latent-soft); margin-bottom: 14px; flex-wrap: wrap; }
.console textarea { min-height: 220px; background: var(--code-bg); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 9px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.refs { font-size: 13.5px; color: var(--ink-2); padding-left: 20px; }
.refs li { margin: 4px 0; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }

/* ---------- chân trang ---------- */
.foot { border-top: 1px solid var(--line); background: var(--card); }
.foot-in { max-width: 1320px; margin: 0 auto; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-size: 13.5px; color: var(--ink-2); }
.foot-in p { margin: 0; }
.foot-in b { color: var(--ink); font-weight: 600; }
.author { font-size: 14px; color: var(--ink-2); margin: 16px 0 0; }
.author b { color: var(--ink); }

/* ---------- tìm trong bài ---------- */
.tim { position: relative; max-width: 620px; margin: 0 0 18px; }
.tim input { padding: 9px 12px; font-size: 15px; }
.tim-kq { display: grid; gap: 6px; margin-top: 8px; }
.tim-kq a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--ink); text-decoration: none; }
.tim-kq a:hover { border-color: var(--accent); }
.tim-kq .t { font-weight: 600; font-size: 14px; }
.tim-kq .t span { color: var(--ink-3); font-weight: 500; }
.tim-kq .s { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.tim-kq mark { background: var(--latent-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.rail .tim { margin: 0 0 14px; }
.rail .tim input { font-size: 13.5px; padding: 6px 9px; }
.rail .tim-kq a { padding: 6px 9px; }
.rail .tim-kq .s { display: none; }

<script>window.LAB={"bai":[{"id":"b01","so":1,"tieu_de":"Cài R, RStudio và tạo dự án đầu tiên","gd":1,"tg":"45 phút","goi":"base R","muc_tieu":["Cài đúng R và RStudio","Tạo RStudio Project để không bao giờ lạc thư mục","Cài và nạp gói","Viết, chạy, lưu một script"],"html":"<h2>R và RStudio là hai thứ khác\nnhau<\/h2>\n<p><strong>R<\/strong> là ngôn ngữ và bộ máy tính toán.\n<strong>RStudio<\/strong> là phần mềm soạn thảo giúp viết R dễ hơn. Phải\ncài R trước, RStudio sau. Nếu chỉ cài RStudio, khi mở lên sẽ báo không\ntìm thấy R.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Bước<\/th>\n<th>Tải ở đâu<\/th>\n<th>Ghi chú<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Cài R<\/td>\n<td>cran.r-project.org → Download R for Windows/macOS<\/td>\n<td>Windows chọn <strong>base<\/strong>; macOS chọn đúng chip (Apple\nsilicon = arm64, Intel = x86_64)<\/td>\n<\/tr>\n<tr>\n<td>2. Cài RStudio Desktop<\/td>\n<td>posit.co/download/rstudio-desktop<\/td>\n<td>Bản miễn phí là đủ<\/td>\n<\/tr>\n<tr>\n<td>3. (Windows) Cài Rtools<\/td>\n<td>cran.r-project.org/bin/windows/Rtools<\/td>\n<td>Chỉ cần khi cài gói từ mã nguồn, ví dụ gói trên GitHub<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"tip\">\n<p>Đặt tên thư mục và tên tệp <strong>không dấu, không khoảng\ntrắng<\/strong> (ví dụ <code>luan_van_sem<\/code>). Đường dẫn có dấu tiếng\nViệt là nguyên nhân số một của lỗi <code>cannot open file<\/code> trên\nWindows.<\/p>\n<\/div>\n<h2>Bốn ô của RStudio<\/h2>\n<ul>\n<li><strong>Source<\/strong> (trên trái): nơi viết script\n<code>.R<\/code>. Luôn viết ở đây, không gõ thẳng vào Console, để lưu lại\nđược.<\/li>\n<li><strong>Console<\/strong> (dưới trái): nơi R chạy lệnh và in kết\nquả.<\/li>\n<li><strong>Environment<\/strong> (trên phải): các đối tượng đang có\ntrong bộ nhớ.<\/li>\n<li><strong>Files / Plots / Packages / Help<\/strong> (dưới phải).<\/li>\n<\/ul>\n<p>Phím tắt cần nhớ: <code>Ctrl + Enter<\/code> (macOS:\n<code>Cmd + Enter<\/code>) chạy dòng đang đứng hoặc đoạn đang chọn;\n<code>Ctrl + Shift + M<\/code> chèn dấu pipe <code>|&gt;<\/code>;\n<code>Alt + -<\/code> chèn dấu gán <code>&lt;-<\/code>.<\/p>\n<h2>Luôn làm việc trong một\nRStudio Project<\/h2>\n<p>File → New Project → New Directory → New Project, đặt tên\n<code>luan_van_sem<\/code>. RStudio tạo tệp\n<code>luan_van_sem.Rproj<\/code>. Từ nay chỉ mở dự án bằng cách bấm đúp\ntệp <code>.Rproj<\/code>; thư mục làm việc tự động là thư mục dự án, nên\n<code>read.csv(\"khao_sat_sach.csv\")<\/code> luôn tìm thấy tệp.<\/p>\n<p>Cấu trúc thư mục gợi ý:<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>Kiểm tra R đang đứng ở thư mục nào:<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<h2>Cài gói một lần, nạp gói mỗi\nlần<\/h2>\n<p>Gói (package) là bộ hàm do cộng đồng viết.\n<code>install.packages()<\/code> tải về máy (làm <strong>một\nlần<\/strong>); <code>library()<\/code> nạp vào phiên làm việc (làm\n<strong>mỗi lần mở R<\/strong>).<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<div class=\"warn\">\n<p><code>library(lavaan)<\/code> báo\n<code>there is no package called 'lavaan'<\/code> nghĩa là chưa cài. Còn\n<code>could not find function \"sem\"<\/code> nghĩa là đã cài nhưng\n<strong>chưa nạp<\/strong> trong phiên này.<\/p>\n<\/div>\n<h2>Script đầu tiên<\/h2>\n<p>Tạo tệp mới (File → New File → R Script), gõ, chạy từng dòng bằng\n<code>Ctrl + Enter<\/code>, rồi lưu thành\n<code>script/00_thu.R<\/code>.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>Ghi lại môi\ntrường để người khác chạy lại được<\/h2>\n<p>Khi nộp luận văn hoặc gửi bài cho tạp chí, ghi phiên bản R và gói ở\nphụ lục. Lệnh dưới đây in ra đủ thông tin:<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<div class=\"tip\">\n<p>Muốn báo cáo đẹp và tái lập được, học thêm <strong>Quarto<\/strong>\n(File → New File → Quarto Document): viết lời và mã R trong cùng một\ntệp, xuất ra Word. Mọi bảng số tự cập nhật khi dữ liệu đổi.<\/p>\n<\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"luan_van_sem/\n├── luan_van_sem.Rproj\n├── du_lieu/          # tệp thô, KHÔNG sửa tay\n├── script/           # 01_lam_sach.R, 02_mo_ta.R, 03_cfa.R, 04_sem.R ...\n├── ket_qua/          # bảng, hình xuất ra\n└── bao_cao/          # tệp Quarto/Word chương 4","run":false,"seg":[]},{"code":"getwd()          # thư mục làm việc hiện tại\nR.version.string # phiên bản R","run":true,"seg":[{"t":"o","v":"[1] \"/private/var/folders/kz/xjbw7g4x66xfxb56xppsvf940000gn/T/Rtmp9GKJNf/luan_van_sem_b01\"\n[1] \"R version 4.6.0 (2026-04-24)\"\n"}]},{"code":"# Cài toàn bộ gói dùng trong Phòng Lab (chạy một lần, cần mạng)\ninstall.packages(c(\"lavaan\", \"semTools\", \"seminr\", \"psych\", \"GPArotation\",\n                   \"semPlot\", \"cSEM\", \"dplyr\", \"ggplot2\", \"readxl\", \"haven\", \"car\"))","run":false,"seg":[]},{"code":"library(lavaan)       # nạp gói; các thông báo chào là bình thường\npackageVersion(\"lavaan\")","run":true,"seg":[{"t":"o","v":"This is lavaan 0.7-3\nlavaan is FREE software! Please report any bugs.\n[1] ‘0.7.3’\n"}]},{"code":"# Dấu # bắt đầu chú thích, R bỏ qua phần sau dấu này\nx <- c(4, 5, 3, 4, 5)   # một vectơ điểm Likert\nmean(x)                 # trung bình\nsd(x)                   # độ lệch chuẩn\nsummary(x)","run":true,"seg":[{"t":"o","v":"[1] 4.2\n[1] 0.8367\n   Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n    3.0     4.0     4.0     4.2     5.0     5.0 \n"}]},{"code":"sessionInfo()$R.version$version.string\nsapply(c(\"lavaan\", \"semTools\", \"seminr\", \"psych\"), function(p) as.character(packageVersion(p)))","run":true,"seg":[{"t":"o","v":"[1] \"R version 4.6.0 (2026-04-24)\"\n  lavaan semTools   seminr    psych \n \"0.7.3\"  \"0.5.9\"  \"2.4.2\"  \"2.6.3\" \n"}]}],"quiz":[[{"q":"Bạn vừa mở lại RStudio, chạy sem(mo_hinh, data = df) và nhận lỗi could not find function \"sem\". Cách sửa đúng là gì?","opts":["Chạy install.packages(\"lavaan\") lần nữa","Chạy library(lavaan) trước rồi chạy lại","Cài lại RStudio","Đổi tên hàm thành SEM()"],"ok":1,"why":"Gói đã cài nhưng mỗi phiên làm việc mới phải nạp lại bằng library()."},{"q":"Vì sao nên mở dự án bằng tệp .Rproj?","opts":["Thư mục làm việc tự đặt đúng chỗ, đường dẫn tương đối luôn chạy","Vì RStudio chạy nhanh hơn","Vì R chỉ đọc được dữ liệu trong tệp .Rproj","Vì như vậy không cần cài gói"],"ok":0,"why":"RStudio Project đặt working directory về thư mục dự án, nên mã đọc tệp chạy được trên mọi máy."},{"q":"Cách đặt tên thư mục nào an toàn nhất?","opts":["D:/Luận văn/Dữ liệu khảo sát","D:/Luan van/Du lieu","D:/luan_van/du_lieu","D:/LUẬN_VĂN"],"ok":2,"why":"Không dấu, không khoảng trắng tránh được lỗi mã hoá đường dẫn trên Windows."}]]},{"id":"b02","so":2,"tieu_de":"Ngôn ngữ R cốt lõi cho người làm khảo sát","gd":1,"tg":"60 phút","goi":"base R, dplyr","muc_tieu":["Phân biệt vectơ, factor, data frame, list","Lấy dòng, cột bằng [ ] và $","Hiểu NA và cách R xử lý","Dùng pipe","> và năm động từ dplyr"],"html":"<h2>Gán và kiểu dữ liệu<\/h2>\n<p>Trong R, mọi thứ là <strong>đối tượng<\/strong>. Dấu\n<code>&lt;-<\/code> gán giá trị cho tên. Tên phân biệt chữ hoa, chữ\nthường: <code>HI1<\/code> khác <code>hi1<\/code>.<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>R tính theo cả vectơ, không cần vòng lặp:<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<h2>Factor: biến định danh có\nthứ tự mức<\/h2>\n<p>Biến nhân khẩu học như thu nhập nên là <code>factor<\/code> với thứ tự\nmức đúng, để bảng và đồ thị xếp đúng thứ tự.<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<h2>Data frame: bảng dữ liệu<\/h2>\n<p>Mỗi cột là một biến, mỗi dòng là một người trả lời. Đây là dạng dữ\nliệu của mọi phân tích SEM.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>NA: giá trị thiếu<\/h2>\n<p><code>NA<\/code> là ô trống. Hầu hết hàm thống kê trả về\n<code>NA<\/code> nếu có ô thiếu, trừ khi bảo bỏ qua.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>List: túi đựng mọi thứ<\/h2>\n<p>Kết quả của <code>lavaan<\/code>, <code>seminr<\/code> đều là list\n(hoặc đối tượng giống list). Biết list giúp lấy đúng con số cần báo\ncáo.<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>Hàm tự viết<\/h2>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<h2>Pipe và dplyr<\/h2>\n<p>Dấu <code>|&gt;<\/code> đưa kết quả bên trái vào làm đối số đầu tiên\ncủa hàm bên phải. Đọc từ trái sang phải như một câu: “lấy df, rồi lọc,\nrồi tính”.<\/p>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Động từ<\/th>\n<th>Việc làm<\/th>\n<th>Ví dụ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>select()<\/code><\/td>\n<td>chọn cột<\/td>\n<td><code>select(df, HI1:HI4)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>filter()<\/code><\/td>\n<td>lọc dòng<\/td>\n<td><code>filter(df, thoi_gian &gt;= 120)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mutate()<\/code><\/td>\n<td>tạo, sửa cột<\/td>\n<td><code>mutate(df, DD4 = 6 - DD4)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>group_by()<\/code> + <code>summarise()<\/code><\/td>\n<td>tóm tắt theo nhóm<\/td>\n<td>trung bình theo giới tính<\/td>\n<\/tr>\n<tr>\n<td><code>arrange()<\/code><\/td>\n<td>sắp xếp<\/td>\n<td><code>arrange(df, desc(HI))<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\">\n<p>Dấu <code>=<\/code> trong <code>filter()<\/code> là sai; so sánh bằng\nphải dùng <code>==<\/code>. Lỗi thường gặp:\n<code>filter(df, gioi = \"Nữ\")<\/code> báo <em>We detected a named\ninput<\/em>.<\/p>\n<\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"diem <- c(5, 4, 4, 3, 5, 2)          # numeric\ngioi <- c(\"Nữ\", \"Nam\", \"Nữ\", \"Nữ\", \"Nam\", \"Nữ\")   # character\ndong_y <- diem >= 4                  # logical\nclass(diem); class(gioi); class(dong_y)\nlength(diem)","run":true,"seg":[{"t":"o","v":"[1] \"numeric\"\n[1] \"character\"\n[1] \"logical\"\n[1] 6\n"}]},{"code":"diem * 2\ndiem - mean(diem)      # trừ trung bình cho từng phần tử\nsum(dong_y)            # số người đồng ý (TRUE được đếm là 1)\nmean(dong_y)           # tỉ lệ đồng ý","run":true,"seg":[{"t":"o","v":"[1] 10  8  8  6 10  4\n[1]  1.1667  0.1667  0.1667 -0.8333  1.1667 -1.8333\n[1] 4\n[1] 0.6667\n"}]},{"code":"thu_nhap <- c(\"3–5 triệu\", \"Dưới 3 triệu\", \"Trên 10 triệu\", \"3–5 triệu\")\ntable(thu_nhap)                       # xếp theo bảng chữ cái, sai ý\nthu_nhap <- factor(thu_nhap, levels = c(\"Dưới 3 triệu\", \"3–5 triệu\", \"5–10 triệu\", \"Trên 10 triệu\"))\ntable(thu_nhap)                       # đúng thứ tự, giữ cả mức không có ai","run":true,"seg":[{"t":"o","v":"thu_nhap\n    3–5 triệu  Dưới 3 triệu Trên 10 triệu \n            2             1             1 \nthu_nhap\n Dưới 3 triệu     3–5 triệu    5–10 triệu Trên 10 triệu \n            1             2             0             1 \n"}]},{"code":"df <- data.frame(id = 1:4, gioi = c(\"Nữ\", \"Nam\", \"Nữ\", \"Nam\"),\n                 HI1 = c(5, 4, 3, 4), HI2 = c(4, 4, 2, 5))\ndf\ndf$HI1                 # một cột theo tên\ndf[2, ]                # dòng 2\ndf[, c(\"HI1\", \"HI2\")]  # hai cột\ndf[df$gioi == \"Nữ\", ]  # lọc dòng theo điều kiện\ndf$HI_tb <- rowMeans(df[, c(\"HI1\", \"HI2\")])   # tạo cột trung bình\ndf","run":true,"seg":[{"t":"o","v":"  id gioi HI1 HI2\n1  1   Nữ   5   4\n2  2  Nam   4   4\n3  3   Nữ   3   2\n4  4  Nam   4   5\n[1] 5 4 3 4\n  id gioi HI1 HI2\n2  2  Nam   4   4\n  HI1 HI2\n1   5   4\n2   4   4\n3   3   2\n4   4   5\n  id gioi HI1 HI2\n1  1   Nữ   5   4\n3  3   Nữ   3   2\n  id gioi HI1 HI2 HI_tb\n1  1   Nữ   5   4   4.5\n2  2  Nam   4   4   4.0\n3  3   Nữ   3   2   2.5\n4  4  Nam   4   5   4.5\n"}]},{"code":"x <- c(4, NA, 5, 3)\nmean(x)\nmean(x, na.rm = TRUE)\nis.na(x)\nsum(is.na(x))          # đếm số ô thiếu","run":true,"seg":[{"t":"o","v":"[1] NA\n[1] 4\n[1] FALSE  TRUE FALSE FALSE\n[1] 1\n"}]},{"code":"ket_qua <- list(n = 411, cfi = 0.979, he_so = c(H1 = 0.39, H2 = 0.25))\nnames(ket_qua)\nket_qua$cfi\nket_qua[[\"he_so\"]][\"H1\"]\nstr(ket_qua)","run":true,"seg":[{"t":"o","v":"[1] \"n\"     \"cfi\"   \"he_so\"\n[1] 0.979\n  H1 \n0.39 \nList of 3\n $ n    : num 411\n $ cfi  : num 0.979\n $ he_so: Named num [1:2] 0.39 0.25\n  ..- attr(*, \"names\")= chr [1:2] \"H1\" \"H2\"\n"}]},{"code":"cr <- function(lambda) {          # độ tin cậy tổng hợp từ hệ số tải chuẩn hoá\n  sum(lambda)^2 / (sum(lambda)^2 + sum(1 - lambda^2))\n}\ncr(c(0.82, 0.79, 0.84, 0.58))","run":true,"seg":[{"t":"o","v":"[1] 0.8468\n"}]},{"code":"library(dplyr)\ndf <- data.frame(gioi = c(\"Nữ\", \"Nam\", \"Nữ\", \"Nam\", \"Nữ\"),\n                 HI1 = c(5, 4, 3, 4, 5), HI2 = c(4, 4, 2, 5, 5))\ndf |>\n  mutate(HI = (HI1 + HI2) / 2) |>      # thêm cột\n  filter(HI >= 3) |>                   # lọc dòng\n  group_by(gioi) |>                    # nhóm\n  summarise(n = n(), HI_tb = mean(HI)) # tóm tắt","run":true,"seg":[{"t":"o","v":"\nAttaching package: ‘dplyr’\n\nThe following objects are masked from ‘package:stats’:\n\n    filter, lag\n\nThe following objects are masked from ‘package:base’:\n\n    intersect, setdiff, setequal, union\n\n# A tibble: 2 × 3\n  gioi      n HI_tb\n  <chr> <int> <dbl>\n1 Nam       2  4.25\n2 Nữ        2  4.75\n"}]}],"quiz":[[{"q":"mean(c(4, NA, 5)) trả về gì?","opts":["NA","4.5","3","Lỗi"],"ok":0,"why":"Có NA thì kết quả là NA; thêm na.rm = TRUE để được 4.5."},{"q":"Lệnh nào lấy các dòng có giới tính Nữ?","opts":["df[gioi == \"Nữ\"]","df[df$gioi == \"Nữ\", ]","df$gioi(\"Nữ\")","filter(df, gioi = \"Nữ\")"],"ok":1,"why":"Chỉ mục dòng đặt trước dấu phẩy, và phải dùng == để so sánh."},{"q":"Vì sao nên chuyển thu_nhap thành factor có levels?","opts":["Để R tính trung bình thu nhập","Để bảng tần số và đồ thị xếp mức theo đúng thứ tự logic","Vì lavaan bắt buộc mọi biến là factor","Để giảm dung lượng tệp"],"ok":1,"why":"Factor giữ thứ tự mức do bạn đặt, kể cả mức không có quan sát."}]]},{"id":"b03","so":3,"tieu_de":"Nhập dữ liệu và làm quen bộ khảo sát","gd":1,"tg":"45 phút","goi":"base R, readxl, haven","muc_tieu":["Đọc tệp CSV, Excel, SPSS đúng mã hoá tiếng Việt","Kiểm tra cấu trúc dữ liệu ngay sau khi đọc","Lập từ điển biến (codebook) cho bảng hỏi"],"html":"<h2>Bộ dữ liệu xuyên suốt Phòng\nLab<\/h2>\n<p>Mọi bài từ đây dùng chung một khảo sát mô phỏng: <strong>Ý định mua\nhàng qua livestream của sinh viên<\/strong>, mô hình TAM mở rộng thêm\nNiềm tin. Thang Likert 5 mức (1 = Hoàn toàn không đồng ý … 5 = Hoàn toàn\nđồng ý).<\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Mã<\/th>\n<th>Khái niệm<\/th>\n<th>Số câu<\/th>\n<th>Ví dụ câu hỏi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HI<\/td>\n<td>Hữu ích cảm nhận<\/td>\n<td>4<\/td>\n<td>HI1: Mua qua livestream giúp tôi tiết kiệm thời gian<\/td>\n<\/tr>\n<tr>\n<td>DD<\/td>\n<td>Dễ dàng sử dụng<\/td>\n<td>4<\/td>\n<td>DD1: Đặt hàng trong livestream rất đơn giản. <strong>DD4 là câu đảo\nchiều<\/strong>: “Mua qua livestream khiến tôi thấy rối”<\/td>\n<\/tr>\n<tr>\n<td>NT<\/td>\n<td>Niềm tin vào người bán<\/td>\n<td>4<\/td>\n<td>NT1: Người bán livestream giữ đúng cam kết<\/td>\n<\/tr>\n<tr>\n<td>TD<\/td>\n<td>Thái độ<\/td>\n<td>3<\/td>\n<td>TD1: Mua qua livestream là ý tưởng hay<\/td>\n<\/tr>\n<tr>\n<td>YD<\/td>\n<td>Ý định mua<\/td>\n<td>3<\/td>\n<td>YD1: Tôi sẽ tiếp tục mua qua livestream<\/td>\n<\/tr>\n<tr>\n<td>CL<\/td>\n<td>Chất lượng phiên livestream (<strong>cấu tạo<\/strong>, dùng ở Bài\n15)<\/td>\n<td>4 + 1<\/td>\n<td>CL2: Người bán trả lời câu hỏi trong phiên nhanh. CL_G là câu tổng\nquát<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Năm cột CL1–CL4, CL_G chỉ dùng cho nhánh PLS-SEM; các bài làm sạch và\nCB-SEM dùng 18 câu còn lại. Biến nhân khẩu học: <code>gioi_tinh<\/code>,\n<code>nam_hoc<\/code>, <code>thu_nhap<\/code>, <code>nen_tang<\/code>,\n<code>tan_suat<\/code> (tần suất xem livestream mua hàng),\n<code>thoi_gian<\/code> (số giây làm bảng hỏi).<\/p>\n<p>Có hai tệp: <code>khao_sat_tho.csv<\/code> (438 dòng, chưa làm sạch,\ndùng ở Bài 5) và <code>khao_sat_sach.csv<\/code> (411 dòng, dùng từ Bài\n6). Lấy tệp ở mục <strong>Dữ liệu<\/strong> của Phòng Lab rồi đặt vào thư\nmục dự án.<\/p>\n<div class=\"note\">\n<p>Dữ liệu này được <strong>mô phỏng<\/strong> bằng R với cấu trúc biết\ntrước, kèm vài lỗi cài sẵn để luyện làm sạch. Không dùng để báo cáo như\ndữ liệu thật.<\/p>\n<\/div>\n<h2>Đọc tệp CSV<\/h2>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<div class=\"warn\">\n<p>Trên Windows, quên <code>fileEncoding = \"UTF-8\"<\/code> sẽ làm “Nữ”\nhiện thành “Ná»¯”. Nếu tệp lưu từ Excel bằng “CSV (Comma delimited)”,\nhãy lưu lại bằng <strong>CSV UTF-8<\/strong>.<\/p>\n<\/div>\n<h2>Kiểm tra cấu trúc ngay sau\nkhi đọc<\/h2>\n<p>Ba lệnh luôn chạy sau khi nạp dữ liệu: <code>str()<\/code> xem kiểu\ntừng cột, <code>summary()<\/code> xem miền giá trị,\n<code>colSums(is.na())<\/code> đếm ô thiếu.<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<p>Nhìn <code>Max.<\/code> của HI1 hoặc các cột khác: thang 1–5 mà có giá\ntrị 33 hay 44 là lỗi nhập liệu. Bài 5 sẽ xử lý.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>Đọc tệp Excel và SPSS<\/h2>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>Xuất từ Google Forms<\/h2>\n<p>Google Forms → Responses → Link to Sheets → File → Download → CSV.\nTiêu đề cột là nguyên câu hỏi, rất dài. Đổi tên một lần ngay đầu\nscript:<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>Từ điển biến (codebook)<\/h2>\n<p>Codebook giúp người chấm và chính bạn hiểu dữ liệu. Tạo nhanh bằng\nR:<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"tho <- read.csv(\"khao_sat_tho.csv\", fileEncoding = \"UTF-8\")\ndim(tho)           # số dòng, số cột\nhead(tho, 3)","run":true,"seg":[{"t":"o","v":"[1] 438  30\n  ma_phieu gioi_tinh nam_hoc     thu_nhap    nen_tang     tan_suat thoi_gian HI1\n1     P308        Nữ       2 Dưới 3 triệu Shopee Live     Hiếm khi       291   5\n2     P131        Nữ       4   5–10 triệu TikTok Shop     Hiếm khi       454   4\n3     P147       Nam       2    3–5 triệu TikTok Shop Thỉnh thoảng       191   3\n  HI2 HI3 HI4 DD1 DD2 DD3 DD4 NT1 NT2 NT3 NT4 TD1 TD2 TD3 YD1 YD2 YD3 CL1 CL2 CL3\n1   4   4   3   5   4   4   2   2   3   3   3   5   5   5   3   4   4   5   2   3\n2   4   3   5   4   4   5   1   4   5   4   5   4   5   4   5   5   5   3   5   4\n3   4   3   3   4   5   4   3   4   3   3   3   5   5   4   4   4   4   4   4   4\n  CL4 CL_G\n1   5    5\n2   5    5\n3   4    4\n"}]},{"code":"str(tho[, 1:10])","run":true,"seg":[{"t":"o","v":"'data.frame':\t438 obs. of  10 variables:\n $ ma_phieu : chr  \"P308\" \"P131\" \"P147\" \"P409\" ...\n $ gioi_tinh: chr  \"Nữ\" \"Nữ\" \"Nam\" \"Nữ\" ...\n $ nam_hoc  : int  2 4 2 4 3 1 4 3 1 2 ...\n $ thu_nhap : chr  \"Dưới 3 triệu\" \"5–10 triệu\" \"3–5 triệu\" \"3–5 triệu\" ...\n $ nen_tang : chr  \"Shopee Live\" \"TikTok Shop\" \"TikTok Shop\" \"Shopee Live\" ...\n $ tan_suat : chr  \"Hiếm khi\" \"Hiếm khi\" \"Thỉnh thoảng\" \"Thường xuyên\" ...\n $ thoi_gian: int  291 454 191 451 281 528 562 451 441 91 ...\n $ HI1      : int  5 4 3 2 4 5 3 2 5 2 ...\n $ HI2      : int  4 4 4 3 3 4 3 1 5 2 ...\n $ HI3      : int  4 3 3 2 4 4 3 3 5 2 ...\n"}]},{"code":"summary(tho[, c(\"HI1\", \"HI2\", \"DD4\", \"thoi_gian\")])","run":true,"seg":[{"t":"o","v":"      HI1            HI2            DD4          thoi_gian   \n Min.   :1.00   Min.   :0.00   Min.   : 1.00   Min.   :  80  \n 1st Qu.:3.00   1st Qu.:3.00   1st Qu.: 2.00   1st Qu.: 325  \n Median :4.00   Median :4.00   Median : 2.00   Median : 424  \n Mean   :3.63   Mean   :3.67   Mean   : 2.48   Mean   : 444  \n 3rd Qu.:4.00   3rd Qu.:4.00   3rd Qu.: 3.00   3rd Qu.: 542  \n Max.   :5.00   Max.   :5.00   Max.   :44.00   Max.   :1078  \n NAs    :3      NAs    :2      NAs    :8                     \n"}]},{"code":"colSums(is.na(tho[, 8:25]))","run":true,"seg":[{"t":"o","v":"HI1 HI2 HI3 HI4 DD1 DD2 DD3 DD4 NT1 NT2 NT3 NT4 TD1 TD2 TD3 YD1 YD2 YD3 \n  3   2   5   4   7   4   5   8   7   9   7   8   3   6   8   9   7   7 \n"}]},{"code":"library(readxl)\ndf <- read_excel(\"du_lieu/khao_sat.xlsx\", sheet = \"Sheet1\")\n\nlibrary(haven)\ndf <- read_sav(\"du_lieu/khao_sat.sav\")   # tệp SPSS\ndf <- as_factor(df)                      # chuyển nhãn giá trị SPSS thành factor","run":false,"seg":[]},{"code":"gf <- read.csv(\"du_lieu/google_form.csv\", fileEncoding = \"UTF-8\", check.names = FALSE)\nnames(gf) <- c(\"thoi_diem\", \"gioi_tinh\", \"nam_hoc\", paste0(\"HI\", 1:4), paste0(\"DD\", 1:4))\n# Nếu ô Likert ghi chữ (\"Đồng ý\"), quy về số:\nmuc <- c(\"Hoàn toàn không đồng ý\" = 1, \"Không đồng ý\" = 2, \"Trung lập\" = 3,\n         \"Đồng ý\" = 4, \"Hoàn toàn đồng ý\" = 5)\ngf[paste0(\"HI\", 1:4)] <- lapply(gf[paste0(\"HI\", 1:4)], function(x) unname(muc[x]))","run":false,"seg":[]},{"code":"cau <- c(HI1 = \"Tiết kiệm thời gian\", HI2 = \"Mua nhanh hơn\", HI3 = \"Tìm được giá tốt\",\n         HI4 = \"Nhiều lựa chọn sản phẩm\", DD1 = \"Đặt hàng đơn giản\", DD2 = \"Dễ thao tác\",\n         DD3 = \"Dễ học cách mua\", DD4 = \"Thấy rối (đảo chiều)\")\ncodebook <- data.frame(ma = names(cau), noi_dung = unname(cau),\n                       thieu = colSums(is.na(tho[names(cau)])),\n                       min = sapply(tho[names(cau)], min, na.rm = TRUE),\n                       max = sapply(tho[names(cau)], max, na.rm = TRUE))\ncodebook","run":true,"seg":[{"t":"o","v":"     ma                noi_dung thieu min max\nHI1 HI1     Tiết kiệm thời gian     3   1   5\nHI2 HI2           Mua nhanh hơn     2   0   5\nHI3 HI3        Tìm được giá tốt     5   1   5\nHI4 HI4 Nhiều lựa chọn sản phẩm     4   1   5\nDD1 DD1       Đặt hàng đơn giản     7   1   5\nDD2 DD2             Dễ thao tác     4   1   5\nDD3 DD3         Dễ học cách mua     5   1   5\nDD4 DD4    Thấy rối (đảo chiều)     8   1  44\n"}]}],"quiz":[[{"q":"Sau khi đọc dữ liệu, lệnh nào cho biết kiểu dữ liệu của từng cột?","opts":["str()","head()","dim()","names()"],"ok":0,"why":"str() in kiểu (num, int, chr) và vài giá trị đầu của mỗi cột."},{"q":"Chữ \"Nữ\" hiện thành \"Ná»¯\". Nguyên nhân thường gặp nhất?","opts":["Tệp bị hỏng","Đọc tệp UTF-8 mà không khai báo fileEncoding = \"UTF-8\"","R không hỗ trợ tiếng Việt","Phải cài gói tiếng Việt"],"ok":1,"why":"Khai báo đúng mã hoá khi đọc, hoặc lưu lại tệp bằng CSV UTF-8."},{"q":"summary() cho thấy cột HI3 có Max = 33. Điều đó nói gì?","opts":["Có người rất đồng ý","Có lỗi nhập liệu ngoài miền thang đo 1–5","Thang đo là 1–33","Dữ liệu chuẩn"],"ok":1,"why":"Giá trị ngoài miền phải được kiểm tra và chuyển thành NA hoặc sửa theo phiếu gốc."}]]},{"id":"b04","so":4,"tieu_de":"Pilot test bảng hỏi trước khi khảo sát chính thức","gd":2,"tg":"90 phút","goi":"base R, psych","muc_tieu":["Phân biệt ba lớp kiểm tra bảng hỏi: chuyên gia, phỏng vấn nhận thức, khảo sát thử","Tính chỉ số giá trị nội dung I-CVI, S-CVI và kappa hiệu chỉnh","Phân tích dữ liệu khảo sát thử: thời gian, ô thiếu, hiệu ứng trần, tương quan, Cronbach's alpha","Ra quyết định giữ, sửa, bỏ cho từng câu và viết mục pilot trong chương phương pháp"],"html":"<h2>Pilot test để làm gì?<\/h2>\n<p>Pilot test (khảo sát thử) kiểm tra <strong>bảng hỏi<\/strong>, không\nkiểm định giả thuyết. Mục tiêu là phát hiện câu khó hiểu, câu hỏi hai ý,\ncâu ai cũng trả lời giống nhau, bảng hỏi quá dài, trước khi tốn công thu\nvài trăm phiếu. Lỗi bảng hỏi không sửa được sau khi đã thu dữ liệu chính\nthức.<\/p>\n<p>Ba lớp kiểm tra, làm theo thứ tự:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Lớp<\/th>\n<th>Ai tham gia<\/th>\n<th>Bao nhiêu<\/th>\n<th>Kết quả<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Chuyên gia đánh giá nội dung<\/td>\n<td>giảng viên, nhà nghiên cứu, người làm nghề<\/td>\n<td>3–10 người (thường 5–6)<\/td>\n<td>chỉ số CVI cho từng câu<\/td>\n<\/tr>\n<tr>\n<td>2. Phỏng vấn nhận thức (cognitive interview)<\/td>\n<td>người giống đối tượng khảo sát<\/td>\n<td>5–10 người<\/td>\n<td>câu được hiểu đúng ý không<\/td>\n<\/tr>\n<tr>\n<td>3. Khảo sát thử định lượng<\/td>\n<td>mẫu nhỏ cùng tổng thể<\/td>\n<td>30–50 người<\/td>\n<td>thời gian, ô thiếu, phân phối, độ tin cậy sơ bộ<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cỡ mẫu pilot 30–50 là khuyến nghị thường gặp: Johanson &amp; Brooks\n(2010) đề xuất tối thiểu 30 người từ tổng thể mục tiêu; Hertzog (2008)\ncho rằng 25–40 người đủ để ước lượng độ tin cậy sơ bộ.<\/p>\n<div class=\"warn\">\n<p>Không chạy EFA, CFA hay SEM trên 30–50 phiếu pilot: cỡ mẫu quá nhỏ,\nkết quả không ổn định. Pilot chỉ dùng thống kê mô tả và Cronbach’s\nalpha. Phiếu pilot cũng <strong>không gộp<\/strong> vào mẫu chính thức\nnếu bảng hỏi đã được sửa.<\/p>\n<\/div>\n<p>Nếu thang đo dịch từ tiếng Anh, làm <strong>dịch xuôi – dịch\nngược<\/strong> (Brislin, 1970) trước lớp 1: một người dịch sang tiếng\nViệt, một người khác không xem bản gốc dịch ngược lại tiếng Anh, rồi so\nhai bản tiếng Anh để sửa chỗ lệch nghĩa.<\/p>\n<h2>Dữ liệu pilot của Phòng Lab<\/h2>\n<p>Bảng hỏi nháp có 19 câu. Hai tệp ở mục <strong>Dữ liệu<\/strong>:<\/p>\n<ul>\n<li><code>pilot_chuyen_gia.csv<\/code>: 6 chuyên gia chấm mức liên quan\ncủa từng câu theo thang 1–4 (1 = không liên quan, 2 = cần sửa nhiều, 3 =\nliên quan nhưng cần sửa nhẹ, 4 = rất liên quan).<\/li>\n<li><code>pilot_khao_sat.csv<\/code>: 40 sinh viên làm bảng hỏi nháp, có\ncột thời gian và cột góp ý tự do.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Câu nháp<\/th>\n<th>Nội dung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HI5<\/td>\n<td>Mua qua livestream hữu ích cho cuộc sống của tôi<\/td>\n<\/tr>\n<tr>\n<td>NT2<\/td>\n<td>Người bán livestream trung thực và quan tâm đến người mua<\/td>\n<\/tr>\n<tr>\n<td>YD4<\/td>\n<td>Tôi biết mua hàng qua livestream là gì<\/td>\n<\/tr>\n<tr>\n<td>DD4<\/td>\n<td>Mua qua livestream khiến tôi thấy rối (đảo chiều)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Lớp 1: Giá trị nội dung (CVI)<\/h2>\n<p><strong>I-CVI<\/strong> của một câu = tỉ lệ chuyên gia chấm 3 hoặc 4.\n<strong>S-CVI/Ave<\/strong> = trung bình I-CVI của mọi câu. Ngưỡng: I-CVI\n≥ 0,78 khi có 6–10 chuyên gia; S-CVI/Ave ≥ 0,90 (Lynn, 1986; Polit &amp;\nBeck, 2006). Với 3–5 chuyên gia, I-CVI phải bằng 1.<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>S-CVI/UA (universal agreement) là tỉ lệ câu được mọi chuyên gia chấm\n3–4, khắt khe hơn S-CVI/Ave.<\/p>\n<p>I-CVI có thể cao do ngẫu nhiên khi ít chuyên gia. <strong>Kappa hiệu\nchỉnh<\/strong> k* (Polit, Beck &amp; Owen, 2007) loại phần đồng thuận\nngẫu nhiên: k* &gt; 0,74 là xuất sắc; 0,60–0,74 tốt; 0,40–0,59 trung\nbình.<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>HI5 (I-CVI 0,17) và NT2 (0,67) dưới ngưỡng 0,78. Đọc lại hai câu: HI5\nquá chung (“hữu ích cho cuộc sống”), NT2 hỏi <strong>hai ý<\/strong>\ntrong một câu (trung thực <em>và<\/em> quan tâm).<\/p>\n<h2>Lớp 2: Phỏng vấn nhận thức<\/h2>\n<p>Ngồi với 5–10 người giống đối tượng khảo sát. Mỗi người đọc to từng\ncâu rồi trả lời, sau đó hỏi:<\/p>\n<ul>\n<li>“Câu này hỏi bạn điều gì, theo cách nói của bạn?”<\/li>\n<li>“Bạn chọn mức này vì sao?”<\/li>\n<li>“Có từ nào bạn không chắc nghĩa không?” (ví dụ: <em>livestream<\/em>\ncó gồm Facebook Live không?)<\/li>\n<li>“Có câu nào bạn thấy giống câu khác không?”<\/li>\n<\/ul>\n<p>Ghi lại vào bảng: câu, vấn đề, ai nêu, cách sửa. Lớp này không cần R;\nkết quả là văn bản dùng ở bước ra quyết định.<\/p>\n<h2>Lớp 3: Khảo sát thử định\nlượng<\/h2>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<h3 id=\"thời-gian-hoàn-thành\">Thời gian hoàn thành<\/h3>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<p>Trung vị khoảng 8 phút là hợp lý. Ghi số này vào lời mời khảo sát\n(“mất khoảng 8 phút”) và dùng làm căn cứ đặt ngưỡng loại phiếu quá nhanh\nở Bài 5.<\/p>\n<h3 id=\"ô-thiếu-theo-từng-câu\">Ô thiếu theo từng câu<\/h3>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<p>Một câu bị bỏ trống nhiều hơn hẳn các câu khác (NT2: 7/40) là dấu\nhiệu người trả lời không biết chọn gì, thường vì câu khó hiểu hoặc hỏi\nhai ý.<\/p>\n<h3 id=\"đảo-chiều-câu-ngược-trước-khi-tính\">Đảo chiều câu ngược trước\nkhi tính<\/h3>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h3 id=\"phân-phối-và-hiệu-ứng-trần\">Phân phối và hiệu ứng trần<\/h3>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<p>YD4 có 75% người chọn mức 5 và độ lệch chuẩn rất nhỏ: câu không phân\nbiệt được người có ý định cao hay thấp (<strong>hiệu ứng trần<\/strong>).\nĐọc lại: “Tôi biết mua hàng qua livestream là gì” đo <strong>hiểu\nbiết<\/strong>, không đo ý định. Chuyên gia đã bỏ sót câu này (I-CVI =\n1), pilot bắt được.<\/p>\n<h3 id=\"độ-tin-cậy-sơ-bộ-và-tương-quan-biến-tổng\">Độ tin cậy sơ bộ và\ntương quan biến – tổng<\/h3>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<p>Đọc theo từng câu: r_drop &lt; 0,30 hoặc alpha_neu_bo cao hơn rõ rệt\nalpha hiện tại là cần xem lại.<\/p>\n<ul>\n<li><strong>YD4<\/strong>: r_drop ≈ 0; bỏ YD4 nâng alpha của YD từ 0,66\nlên 0,76.<\/li>\n<li><strong>HI5<\/strong>: r_drop 0,39 (vẫn trên 0,30) nhưng bỏ HI5 làm\nalpha của HI tăng từ 0,80 lên 0,81. Kết hợp với I-CVI 0,17, nên bỏ.<\/li>\n<li><strong>NT2<\/strong>: r_drop 0,47 nhưng nhiều ô thiếu và bị chuyên\ngia chấm thấp.<\/li>\n<\/ul>\n<p>Với n = 40, alpha có khoảng tin cậy rộng. Đừng loại câu chỉ vì\nalpha_neu_bo nhích lên 0,01.<\/p>\n<div class=\"chunk\" data-i=\"8\"><\/div>\n<h3 id=\"tương-quan-trung-bình-giữa-các-câu\">Tương quan trung bình giữa\ncác câu<\/h3>\n<p>Clark &amp; Watson (1995) đề xuất tương quan trung bình giữa các câu\ncủa một thang đo nằm trong khoảng 0,15–0,50: thấp hơn là các câu không\nđo cùng một thứ, cao hơn là các câu lặp ý.<\/p>\n<div class=\"chunk\" data-i=\"9\"><\/div>\n<p>YD thấp (0,26) vì có YD4 kéo xuống, khớp với chẩn đoán ở trên. TD cao\n(0,71): ba câu thái độ gần nghĩa nhau. Khoảng 0,15–0,50 dành cho khái\nniệm rộng; với khái niệm hẹp như thái độ, Clark &amp; Watson (1995) chấp\nnhận mức cao hơn, nhưng nên đọc lại để chắc không có hai câu chỉ là cách\nnói khác của nhau.<\/p>\n<h3 id=\"góp-ý-tự-do\">Góp ý tự do<\/h3>\n<div class=\"chunk\" data-i=\"10\"><\/div>\n<h2>Bảng quyết định cho từng câu<\/h2>\n<p>Gộp ba lớp bằng chứng. Không câu nào bị loại chỉ vì một con số.<\/p>\n<div class=\"chunk\" data-i=\"11\"><\/div>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Câu<\/th>\n<th>Vấn đề<\/th>\n<th>Quyết định<\/th>\n<th>Bản chính thức<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HI5<\/td>\n<td>quá chung; I-CVI 0,17<\/td>\n<td>Bỏ<\/td>\n<td>(không còn)<\/td>\n<\/tr>\n<tr>\n<td>NT2<\/td>\n<td>hỏi hai ý; 7 ô thiếu; I-CVI 0,67<\/td>\n<td>Tách làm hai câu<\/td>\n<td>NT2 “Người bán livestream trung thực”, NT3 “Người bán quan tâm đến\nngười mua”<\/td>\n<\/tr>\n<tr>\n<td>YD4<\/td>\n<td>đo hiểu biết, không đo ý định; 75% chọn 5<\/td>\n<td>Bỏ<\/td>\n<td>(không còn)<\/td>\n<\/tr>\n<tr>\n<td>DD4<\/td>\n<td>một người đọc nhầm<\/td>\n<td>Giữ, in đậm chữ “rối”<\/td>\n<td>DD4<\/td>\n<\/tr>\n<tr>\n<td>(chung)<\/td>\n<td>“livestream” có gồm Facebook không<\/td>\n<td>Thêm định nghĩa ở đầu bảng hỏi<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Bảng hỏi chính thức sau pilot có 18 câu, đúng bộ dữ liệu\n<code>khao_sat_sach.csv<\/code> dùng từ Bài 5.<\/p>\n<h2>Viết mục pilot trong\nchương phương pháp<\/h2>\n<blockquote>\n<p>Bảng hỏi được kiểm tra qua ba bước. Thứ nhất, sáu chuyên gia (ba\ngiảng viên marketing, hai nhà nghiên cứu thương mại điện tử, một quản lý\nbán hàng livestream) đánh giá mức liên quan của 19 câu; hai câu có I-CVI\ndưới 0,78 (HI5 = 0,17; NT2 = 0,67) được loại hoặc sửa, S-CVI/Ave của bản\nsửa đạt … (Polit &amp; Beck, 2006). Thứ hai, phỏng vấn nhận thức với tám\nsinh viên dẫn đến bổ sung định nghĩa “mua hàng qua livestream” và nhấn\nmạnh câu đảo chiều. Thứ ba, khảo sát thử với 40 sinh viên cho thấy thời\ngian hoàn thành trung vị khoảng 8 phút; câu YD4 có hiệu ứng trần (75%\nchọn mức cao nhất) và tương quan biến – tổng gần 0 nên bị loại.\nCronbach’s alpha sơ bộ của các thang đo sau điều chỉnh từ … đến …. Dữ\nliệu pilot không được gộp vào mẫu chính thức.<\/p>\n<\/blockquote>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"cg <- read.csv(\"pilot_chuyen_gia.csv\", fileEncoding = \"UTF-8\")\ndiem <- cg[, -1]                        # bỏ cột tên chuyên gia\nN <- nrow(diem)                         # số chuyên gia\nA <- colSums(diem >= 3)                 # số chuyên gia chấm 3–4\nI_CVI <- A / N\nround(I_CVI, 2)\nc(S_CVI_Ave = round(mean(I_CVI), 3), S_CVI_UA = round(mean(I_CVI == 1), 3))","run":true,"seg":[{"t":"o","v":" HI1  HI2  HI3  HI4  HI5  DD1  DD2  DD3  DD4  NT1  NT2  NT3  TD1  TD2  TD3  YD1 \n1.00 0.83 1.00 1.00 0.17 1.00 1.00 1.00 1.00 1.00 0.67 1.00 1.00 1.00 1.00 1.00 \n YD2  YD3  YD4 \n1.00 1.00 1.00 \nS_CVI_Ave  S_CVI_UA \n    0.930     0.842 \n"}]},{"code":"pc <- choose(N, A) * 0.5^N              # xác suất đồng thuận ngẫu nhiên\nkappa <- (I_CVI - pc) / (1 - pc)\ncvi <- data.frame(cau = names(I_CVI), dong_y = A, I_CVI = round(I_CVI, 2), kappa = round(kappa, 2),\n                  danh_gia = cut(kappa, c(-Inf, 0.40, 0.60, 0.74, Inf), right = FALSE,\n                                 labels = c(\"kém\", \"trung bình\", \"tốt\", \"xuất sắc\")))\ncvi[order(cvi$I_CVI), ][1:5, ]","run":true,"seg":[{"t":"o","v":"    cau dong_y I_CVI kappa   danh_gia\nHI5 HI5      1  0.17  0.08        kém\nNT2 NT2      4  0.67  0.56 trung bình\nHI2 HI2      5  0.83  0.82   xuất sắc\nHI1 HI1      6  1.00  1.00   xuất sắc\nHI3 HI3      6  1.00  1.00   xuất sắc\n"}]},{"code":"pl <- read.csv(\"pilot_khao_sat.csv\", fileEncoding = \"UTF-8\")\ncau <- names(pl)[3:21]\ndim(pl)","run":true,"seg":[{"t":"o","v":"[1] 40 22\n"}]},{"code":"summary(pl$thoi_gian / 60)               # phút","run":true,"seg":[{"t":"o","v":"   Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n   4.08    6.85    8.40    8.83   10.38   17.20 \n"}]},{"code":"thieu <- colSums(is.na(pl[cau]))\nthieu[thieu > 0]","run":true,"seg":[{"t":"o","v":"HI3 NT2 \n  1   7 \n"}]},{"code":"pl$DD4 <- 6 - pl$DD4","run":true,"seg":[]},{"code":"mo_ta <- data.frame(TB = colMeans(pl[cau], na.rm = TRUE), DLC = sapply(pl[cau], sd, na.rm = TRUE),\n                    ty_le_muc_5 = sapply(pl[cau], function(x) mean(x == 5, na.rm = TRUE)))\nround(mo_ta[order(-mo_ta$ty_le_muc_5), ][1:5, ], 2)","run":true,"seg":[{"t":"o","v":"      TB  DLC ty_le_muc_5\nYD4 4.75 0.44        0.75\nHI2 3.78 1.19        0.35\nNT2 3.85 1.06        0.33\nHI4 3.85 1.03        0.32\nHI3 3.74 1.12        0.31\n"}]},{"code":"library(psych)\nthang <- list(HI = paste0(\"HI\", 1:5), DD = paste0(\"DD\", 1:4), NT = paste0(\"NT\", 1:3),\n              TD = paste0(\"TD\", 1:3), YD = paste0(\"YD\", 1:4))\ntc <- do.call(rbind, lapply(names(thang), function(k) {\n  a <- suppressWarnings(psych::alpha(pl[thang[[k]]], check.keys = FALSE))\n  data.frame(thang_do = k, cau = thang[[k]], alpha = round(a$total$raw_alpha, 3),\n             r_drop = round(a$item.stats$r.drop, 2), alpha_neu_bo = round(a$alpha.drop$raw_alpha, 3))\n}))\ntc","run":true,"seg":[{"t":"o","v":"Some items ( YD4 ) were negatively correlated with the first principal component and \nprobably should be reversed.  \nTo do this, run the function again with the 'check.keys=TRUE' option   thang_do cau alpha r_drop alpha_neu_bo\n1        HI HI1 0.798   0.72        0.712\n2        HI HI2 0.798   0.65        0.736\n3        HI HI3 0.798   0.65        0.736\n4        HI HI4 0.798   0.50        0.784\n5        HI HI5 0.798   0.39        0.813\n6        DD DD1 0.855   0.73        0.804\n7        DD DD2 0.855   0.66        0.832\n8        DD DD3 0.855   0.75        0.795\n9        DD DD4 0.855   0.66        0.829\n10       NT NT1 0.751   0.77        0.428\n11       NT NT2 0.751   0.47        0.788\n12       NT NT3 0.751   0.52        0.736\n13       TD TD1 0.881   0.70        0.894\n14       TD TD2 0.881   0.84        0.768\n15       TD TD3 0.881   0.78        0.827\n16       YD YD1 0.655   0.55        0.499\n17       YD YD2 0.655   0.58        0.472\n18       YD YD3 0.655   0.62        0.455\n19       YD YD4 0.655  -0.02        0.764\n"}]},{"code":"a_YD <- psych::alpha(pl[thang$YD[1:3]])\nround(c(alpha = a_YD$total$raw_alpha, can_duoi = a_YD$feldt$lower.ci$raw_alpha, can_tren = a_YD$feldt$upper.ci$raw_alpha), 3)   # KTC 95% (Feldt)","run":true,"seg":[{"t":"o","v":"   alpha can_duoi can_tren \n   0.764    0.601    0.867 \n"}]},{"code":"round(sapply(thang, function(v) { r <- cor(pl[v], use = \"pairwise\"); mean(r[lower.tri(r)]) }), 2)","run":true,"seg":[{"t":"o","v":"  HI   DD   NT   TD   YD \n0.44 0.60 0.50 0.71 0.26 \n"}]},{"code":"gy <- pl$gop_y[pl$gop_y != \"\"]\ngy","run":true,"seg":[{"t":"o","v":"[1] \"Câu HI5 chung chung quá\"                                                               \n[2] \"Câu NT2 hỏi hai ý: tôi tin người bán trung thực nhưng không thấy họ quan tâm người mua\"\n[3] \"HI5 khó hiểu, hữu ích về cái gì?\"                                                      \n[4] \"Câu DD4 đọc lần đầu tưởng hỏi giống DD1\"                                               \n[5] \"Không rõ livestream có tính cả Facebook không\"                                         \n[6] \"Không biết trả lời NT2 thế nào vì câu có hai ý\"                                        \n[7] \"Câu YD4 thì ai cũng biết rồi\"                                                          \n[8] \"Bảng hỏi hơi dài ở phần cuối\"                                                          \n"}]},{"code":"quyet <- merge(cvi[, c(\"cau\", \"I_CVI\")], tc[, c(\"cau\", \"r_drop\", \"alpha_neu_bo\")], by = \"cau\")\nquyet$thieu <- thieu[quyet$cau]\nquyet$muc_5 <- round(mo_ta[quyet$cau, \"ty_le_muc_5\"], 2)\nquyet$quyet_dinh <- with(quyet, ifelse(I_CVI < 0.78 & r_drop < 0.45, \"Bỏ\",\n                                ifelse(I_CVI < 0.78 | thieu >= 4, \"Sửa\",\n                                ifelse(r_drop < 0.30 | muc_5 >= 0.7, \"Bỏ hoặc thay\", \"Giữ\"))))\nquyet[quyet$quyet_dinh != \"Giữ\", ]\ntable(quyet$quyet_dinh)","run":true,"seg":[{"t":"o","v":"   cau I_CVI r_drop alpha_neu_bo thieu muc_5   quyet_dinh\n9  HI5  0.17   0.39        0.813     0  0.25           Bỏ\n11 NT2  0.67   0.47        0.788     7  0.33          Sửa\n19 YD4  1.00  -0.02        0.764     0  0.75 Bỏ hoặc thay\n\n          Bỏ Bỏ hoặc thay          Giữ          Sửa \n           1            1           16            1 \n"}]}],"quiz":[[{"q":"Sáu chuyên gia chấm một câu; bốn người chấm 3 hoặc 4. I-CVI và kết luận?","opts":["0,67, đạt","0,67, chưa đạt ngưỡng 0,78","0,83, đạt","4, đạt"],"ok":1,"why":"I-CVI = 4/6 = 0,67; với 6–10 chuyên gia cần ≥ 0,78."},{"q":"Vì sao không chạy EFA trên 40 phiếu pilot?","opts":["Cỡ mẫu quá nhỏ, nghiệm nhân tố không ổn định","Vì EFA chỉ chạy được trên SPSS","Vì pilot không có Likert","Vì phải chạy CFA trước"],"ok":0,"why":"Pilot dùng mô tả và alpha sơ bộ; EFA cần mẫu lớn hơn nhiều."},{"q":"Câu \"Người bán trung thực và quan tâm đến người mua\" có vấn đề gì?","opts":["Câu đảo chiều","Câu hỏi hai ý (double-barreled)","Hiệu ứng trần","Không có vấn đề"],"ok":1,"why":"Người trả lời có thể đồng ý ý này nhưng không đồng ý ý kia; tách thành hai câu."},{"q":"75% người trả lời chọn mức 5 cho một câu. Đây là?","opts":["Câu rất tốt","Hiệu ứng trần: câu không phân biệt được người trả lời","Lỗi nhập liệu","Câu đảo chiều"],"ok":1,"why":"Câu gần như không có phương sai thì không đo được khác biệt."},{"q":"Sau khi sửa bảng hỏi theo pilot, có gộp 40 phiếu pilot vào mẫu chính thức không?","opts":["Có, để tăng cỡ mẫu","Không, vì bảng hỏi đã khác","Có, nếu alpha cao","Tuỳ giảng viên"],"ok":1,"why":"Phiếu pilot trả lời bảng hỏi nháp, không cùng công cụ đo."}]]},{"id":"b05","so":5,"tieu_de":"Làm sạch dữ liệu khảo sát","gd":2,"tg":"75 phút","goi":"base R, dplyr","muc_tieu":["Loại phiếu trùng, trả lời một màu, trả lời quá nhanh","Xử lý giá trị ngoài miền và ô thiếu","Đảo chiều câu hỏi ngược","Phát hiện ngoại lai đa biến bằng Mahalanobis","Ghi lại sơ đồ sàng lọc để báo cáo"],"html":"<h2>Thứ tự làm sạch<\/h2>\n<p>Làm theo thứ tự cố định và <strong>ghi số phiếu còn lại sau mỗi\nbước<\/strong>. Bảng này sẽ vào mục 3.x hoặc 4.1 của khoá luận.<\/p>\n<ol type=\"1\">\n<li>Phiếu trùng (nhập hai lần)<\/li>\n<li>Giá trị ngoài miền thang đo<\/li>\n<li>Trả lời một màu (straight-lining)<\/li>\n<li>Trả lời quá nhanh (speeder)<\/li>\n<li>Phiếu bỏ trống nhiều<\/li>\n<li>Đảo chiều câu ngược<\/li>\n<li>Xử lý ô thiếu còn lại<\/li>\n<li>Ngoại lai đa biến<\/li>\n<\/ol>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<h2>1. Phiếu trùng<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<h2>2. Giá trị ngoài miền 1–5<\/h2>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<div class=\"tip\">\n<p>Nếu còn phiếu giấy, tra lại phiếu gốc để sửa đúng giá trị (33 có thể\nlà 3 gõ thừa). Không có phiếu gốc thì để NA, đừng tự đoán.<\/p>\n<\/div>\n<h2>3. Trả lời một màu<\/h2>\n<p>Người trả lời chọn cùng một mức cho mọi câu thường không đọc câu hỏi.\nDấu hiệu: độ lệch chuẩn theo dòng bằng 0. Bảng hỏi có câu đảo chiều\n(DD4) giúp phát hiện dễ hơn: người đọc kỹ sẽ không chọn 5 cho cả DD1 lẫn\nDD4.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>4. Trả lời quá nhanh<\/h2>\n<p>Bảng hỏi 18 câu Likert cộng phần nhân khẩu học cần ít nhất khoảng 2\nphút đọc. Pilot ở Bài 4 cho thời gian trung vị khoảng 8 phút; ngưỡng 120\ngiây (dưới một phần tư trung vị) là quy ước của nghiên cứu này. Hãy nêu\nrõ ngưỡng và lý do trong báo cáo.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>5. Phiếu bỏ trống nhiều<\/h2>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>6. Đảo chiều câu ngược<\/h2>\n<p>Với thang 1–5, giá trị mới = 6 − giá trị cũ. Kiểm tra trước và sau\nbằng tương quan: câu ngược chưa đảo sẽ tương quan <strong>âm<\/strong>\nvới các câu cùng khái niệm.<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<div class=\"warn\">\n<p>Đảo chiều <strong>đúng một lần<\/strong>. Chạy lại dòng\n<code>df$DD4 &lt;- 6 - df$DD4<\/code> lần thứ hai sẽ đảo ngược trở lại.\nĐặt bước này trong script và luôn chạy script từ đầu.<\/p>\n<\/div>\n<h2>7. Ô thiếu còn lại<\/h2>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<p>Khi ô thiếu dưới 5% và rải rác, ba cách thường dùng:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Cách<\/th>\n<th>Khi nào<\/th>\n<th>Lệnh<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FIML trong lavaan<\/td>\n<td>CB-SEM, giữ toàn bộ mẫu<\/td>\n<td><code>sem(..., missing = \"fiml\")<\/code><\/td>\n<\/tr>\n<tr>\n<td>Thay bằng trung vị/trung bình<\/td>\n<td>PLS-SEM, ít ô thiếu<\/td>\n<td>xem bên dưới<\/td>\n<\/tr>\n<tr>\n<td>Loại theo dòng (listwise)<\/td>\n<td>ô thiếu rất ít<\/td>\n<td><code>na.omit(df)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"chunk\" data-i=\"8\"><\/div>\n<h2>8. Ngoại lai đa biến\n(Mahalanobis)<\/h2>\n<p>Khoảng cách Mahalanobis đo một phiếu khác “tâm” dữ liệu bao xa khi\nxét đồng thời 18 câu. So với phân phối χ² có 18 bậc tự do, ngưỡng p &lt;\n0,001.<\/p>\n<div class=\"chunk\" data-i=\"9\"><\/div>\n<div class=\"note\">\n<p>Ngoại lai đa biến <strong>không tự động bị xoá<\/strong>. Xem lại từng\nphiếu: nếu câu trả lời hợp lý (người thực sự có quan điểm khác biệt) thì\ngiữ. Nên chạy mô hình cả khi có và khi bỏ để kiểm tra độ vững, rồi báo\ncáo.<\/p>\n<\/div>\n<h2>Nhật ký sàng lọc và lưu tệp\nsạch<\/h2>\n<div class=\"chunk\" data-i=\"10\"><\/div>\n<p>Kết quả: 411 phiếu dùng được, khớp với tệp\n<code>khao_sat_sach.csv<\/code> của Phòng Lab.<\/p>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"tho <- read.csv(\"khao_sat_tho.csv\", fileEncoding = \"UTF-8\")\nitems <- c(paste0(\"HI\", 1:4), paste0(\"DD\", 1:4), paste0(\"NT\", 1:4),\n           paste0(\"TD\", 1:3), paste0(\"YD\", 1:3))\nnhat_ky <- data.frame(buoc = \"Dữ liệu thô\", con_lai = nrow(tho))","run":true,"seg":[]},{"code":"sum(duplicated(tho$ma_phieu))          # số phiếu nhập trùng\ndf <- tho[!duplicated(tho$ma_phieu), ]\nnhat_ky <- rbind(nhat_ky, data.frame(buoc = \"Bỏ phiếu trùng\", con_lai = nrow(df)))","run":true,"seg":[{"t":"o","v":"[1] 8\n"}]},{"code":"ngoai_mien <- sapply(df[items], function(x) sum(!is.na(x) & !(x %in% 1:5)))\nngoai_mien[ngoai_mien > 0]\nfor (v in items) df[[v]][!(df[[v]] %in% 1:5)] <- NA   # chuyển thành NA","run":true,"seg":[{"t":"o","v":"HI2 DD4 NT2 NT4 TD1 TD3 \n  1   1   1   1   1   1 \n"}]},{"code":"sd_dong <- apply(df[items], 1, sd, na.rm = TRUE)\ntable(mot_mau = sd_dong == 0, useNA = \"ifany\")\ndf[which(sd_dong == 0)[1:3], c(\"ma_phieu\", \"thoi_gian\", items[1:8])]\ndf <- df[!(sd_dong == 0 & !is.na(sd_dong)), ]\nnhat_ky <- rbind(nhat_ky, data.frame(buoc = \"Bỏ trả lời một màu\", con_lai = nrow(df)))","run":true,"seg":[{"t":"o","v":"mot_mau\nFALSE  TRUE \n  418    12 \n    ma_phieu thoi_gian HI1 HI2 HI3 HI4 DD1 DD2 DD3 DD4\n26      P128       336   4   4   4   4   4   4   4   4\n39      P156        89   4   4   4   4   4   4   4   4\n207     P120       491   5   5   5   5   5   5   5   5\n"}]},{"code":"summary(df$thoi_gian)\nsum(df$thoi_gian < 120)\ndf <- df[df$thoi_gian >= 120, ]\nnhat_ky <- rbind(nhat_ky, data.frame(buoc = \"Bỏ phiếu < 120 giây\", con_lai = nrow(df)))","run":true,"seg":[{"t":"o","v":"   Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n     80     329     431     451     549    1078 \n[1] 4\n"}]},{"code":"ty_le_thieu <- rowMeans(is.na(df[items]))\ntable(cut(ty_le_thieu, c(-0.01, 0, 0.1, 0.2, 1), labels = c(\"0%\", \"≤10%\", \"10–20%\", \">20%\")))\ndf <- df[ty_le_thieu <= 0.2, ]\nnhat_ky <- rbind(nhat_ky, data.frame(buoc = \"Bỏ phiếu thiếu > 20%\", con_lai = nrow(df)))","run":true,"seg":[{"t":"o","v":"\n    0%   ≤10% 10–20%   >20% \n   343     66      2      3 \n"}]},{"code":"round(cor(df[c(\"DD1\", \"DD2\", \"DD3\", \"DD4\")], use = \"pairwise\"), 2)[\"DD4\", ]\ndf$DD4 <- 6 - df$DD4\nround(cor(df[c(\"DD1\", \"DD2\", \"DD3\", \"DD4\")], use = \"pairwise\"), 2)[\"DD4\", ]","run":true,"seg":[{"t":"o","v":"  DD1   DD2   DD3   DD4 \n-0.58 -0.61 -0.55  1.00 \n DD1  DD2  DD3  DD4 \n0.58 0.61 0.55 1.00 \n"}]},{"code":"sum(is.na(df[items]))                    # tổng số ô thiếu\nround(100 * mean(is.na(df[items])), 2)   # phần trăm ô thiếu","run":true,"seg":[{"t":"o","v":"[1] 70\n[1] 0.95\n"}]},{"code":"for (v in items) df[[v]][is.na(df[[v]])] <- median(df[[v]], na.rm = TRUE)\nsum(is.na(df[items]))\nnhat_ky <- rbind(nhat_ky, data.frame(buoc = \"Thay ô thiếu bằng trung vị\", con_lai = nrow(df)))","run":true,"seg":[{"t":"o","v":"[1] 0\n"}]},{"code":"D2 <- mahalanobis(df[items], colMeans(df[items]), cov(df[items]))\nnguong <- qchisq(0.999, df = length(items))\nround(nguong, 2)\nsum(D2 > nguong)\nhead(sort(D2, decreasing = TRUE), 5)","run":true,"seg":[{"t":"o","v":"[1] 42.31\n[1] 1\n  125   428    49   161   301 \n43.69 40.99 37.43 37.35 37.08 \n"}]},{"code":"nhat_ky$bi_loai <- c(0, -diff(nhat_ky$con_lai))\nnhat_ky\nwrite.csv(df, \"khao_sat_sach_cua_toi.csv\", row.names = FALSE, fileEncoding = \"UTF-8\")","run":true,"seg":[{"t":"o","v":"                        buoc con_lai bi_loai\n1                Dữ liệu thô     438       0\n2             Bỏ phiếu trùng     430       8\n3         Bỏ trả lời một màu     418      12\n4        Bỏ phiếu < 120 giây     414       4\n5       Bỏ phiếu thiếu > 20%     411       3\n6 Thay ô thiếu bằng trung vị     411       0\n"}]}],"quiz":[[{"q":"Bạn đảo chiều DD4 xong, kiểm tra thấy tương quan của DD4 với DD1 chuyển từ dương sang âm. Chuyện gì đã xảy ra?","opts":["Dữ liệu bị lỗi từ đầu","Câu DD4 đã được đảo hai lần (hoặc dữ liệu gốc đã đảo sẵn)","Đó là kết quả đúng","Phải đảo bằng 5 − x"],"ok":1,"why":"Câu đã đảo đúng phải tương quan dương với các câu cùng khái niệm."},{"q":"Ngưỡng Mahalanobis thường dùng cho 18 biến quan sát là gì?","opts":["18","3,29","χ²(18) tại p = 0,001, khoảng 42,3
