><\/div>\n<h2>Ma trận tương quan<\/h2>\n<div class=\"chunk\" data-i=\"9\"><\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(dplyr)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nitems <- names(df)[8:25]\ndf$thu_nhap <- factor(df$thu_nhap, levels = c(\"Dưới 3 triệu\", \"3–5 triệu\", \"5–10 triệu\", \"Trên 10 triệu\"))\ndf$tan_suat <- factor(df$tan_suat, levels = c(\"Hiếm khi\", \"Thỉnh thoảng\", \"Thường xuyên\"))\nnrow(df)","run":true,"seg":[{"t":"o","v":"\nAttaching package: ‘dplyr’\n\nThe following objects are masked from ‘package:stats’:\n\n    filter, lag\n\nThe following objects are masked from ‘package:base’:\n\n    intersect, setdiff, setequal, union\n\n[1] 411\n"}]},{"code":"tan_so <- function(x) {\n  t <- table(x, useNA = \"ifany\")\n  data.frame(muc = names(t), n = as.vector(t), phan_tram = round(100 * as.vector(t) / sum(t), 1))\n}\ntan_so(df$gioi_tinh)\ntan_so(df$thu_nhap)\ntan_so(df$tan_suat)","run":true,"seg":[{"t":"o","v":"   muc   n phan_tram\n1        3       0.7\n2 Khác   7       1.7\n3  Nam 151      36.7\n4   Nữ 250      60.8\n            muc   n phan_tram\n1  Dưới 3 triệu 147      35.8\n2     3–5 triệu 144      35.0\n3    5–10 triệu  87      21.2\n4 Trên 10 triệu  33       8.0\n           muc   n phan_tram\n1     Hiếm khi 104      25.3\n2 Thỉnh thoảng 191      46.5\n3 Thường xuyên 116      28.2\n"}]},{"code":"library(psych)\nmo_ta <- describe(df[items])[, c(\"n\", \"mean\", \"sd\", \"median\", \"min\", \"max\", \"skew\", \"kurtosis\")]\nround(mo_ta, 2)","run":true,"seg":[{"t":"o","v":"      n mean   sd median min max  skew kurtosis\nHI1 411 3.63 1.05      4   1   5 -0.43    -0.42\nHI2 411 3.67 1.04      4   1   5 -0.51    -0.23\nHI3 411 3.66 1.02      4   1   5 -0.36    -0.55\nHI4 411 3.67 0.98      4   1   5 -0.38    -0.43\nDD1 411 3.69 1.06      4   1   5 -0.41    -0.67\nDD2 411 3.70 1.04      4   1   5 -0.46    -0.44\nDD3 411 3.68 1.07      4   1   5 -0.41    -0.65\nDD4 411 3.66 1.06      4   1   5 -0.46    -0.49\nNT1 411 3.68 1.01      4   1   5 -0.27    -0.75\nNT2 411 3.68 1.02      4   1   5 -0.31    -0.63\nNT3 411 3.64 0.99      4   1   5 -0.49    -0.18\nNT4 411 3.59 1.11      4   1   5 -0.53    -0.36\nTD1 411 3.62 1.05      4   1   5 -0.52    -0.30\nTD2 411 3.66 1.03      4   1   5 -0.43    -0.50\nTD3 411 3.67 1.04      4   1   5 -0.55    -0.26\nYD1 411 3.72 0.97      4   1   5 -0.46    -0.24\nYD2 411 3.69 0.99      4   1   5 -0.45    -0.38\nYD3 411 3.64 1.03      4   1   5 -0.37    -0.62\n"}]},{"code":"df <- df |>\n  mutate(HI = rowMeans(across(HI1:HI4)), DD = rowMeans(across(DD1:DD4)),\n         NT = rowMeans(across(NT1:NT4)), TD = rowMeans(across(TD1:TD3)),\n         YD = rowMeans(across(YD1:YD3)))\nround(sapply(df[c(\"HI\", \"DD\", \"NT\", \"TD\", \"YD\")], function(x) c(TB = mean(x), DLC = sd(x))), 2)","run":true,"seg":[{"t":"o","v":"      HI   DD   NT   TD   YD\nTB  3.66 3.68 3.65 3.65 3.68\nDLC 0.84 0.87 0.86 0.92 0.86\n"}]},{"code":"m <- mardia(df[items], plot = FALSE)\nround(c(skew = m$b1p, p_skew = m$p.skew, kurtosis = m$b2p, p_kurt = m$p.kurt), 4)","run":true,"seg":[{"t":"o","v":"    skew   p_skew kurtosis   p_kurt \n 19.4687   0.0001 362.8188   0.2869 \n"}]},{"code":"library(ggplot2)\nggplot(df, aes(x = YD)) +\n  geom_histogram(binwidth = 1/3, fill = \"#2f6f73\", colour = \"white\") +\n  labs(x = \"Ý định mua (trung bình 3 câu)\", y = \"Số người\", title = \"Phân phối Ý định mua\") +\n  theme_minimal(base_size = 13)","run":true,"seg":[{"t":"o","v":"\nAttaching package: ‘ggplot2’\n\nThe following objects are masked from ‘package:psych’:\n\n    %+%, alpha\n\n"},{"t":"p","v":"b06-06-1.png"}]},{"code":"ggplot(df, aes(x = tan_suat, y = YD, fill = tan_suat)) +\n  geom_boxplot(show.legend = FALSE, alpha = 0.8) +\n  labs(x = \"Tần suất xem livestream mua hàng\", y = \"Ý định mua\") +\n  theme_minimal(base_size = 13)","run":true,"seg":[{"t":"p","v":"b06-07-1.png"}]},{"code":"dai <- data.frame(cau = rep(items[1:8], each = nrow(df)),\n                  muc = factor(unlist(df[items[1:8]]), levels = 1:5))\nggplot(dai, aes(y = cau, fill = muc)) +\n  geom_bar(position = \"fill\") +\n  scale_fill_brewer(palette = \"BrBG\", name = \"Mức\") +\n  labs(x = \"Tỉ lệ\", y = NULL) + theme_minimal(base_size = 13)","run":true,"seg":[{"t":"p","v":"b06-08-1.png"}]},{"code":"ggsave(\"ket_qua/hinh_4_1_YD.png\", width = 16, height = 10, units = \"cm\", dpi = 300)","run":false,"seg":[]},{"code":"round(cor(df[c(\"HI\", \"DD\", \"NT\", \"TD\", \"YD\")]), 2)","run":true,"seg":[{"t":"o","v":"     HI   DD   NT   TD   YD\nHI 1.00 0.31 0.28 0.48 0.38\nDD 0.31 1.00 0.37 0.42 0.36\nNT 0.28 0.37 1.00 0.42 0.46\nTD 0.48 0.42 0.42 1.00 0.55\nYD 0.38 0.36 0.46 0.55 1.00\n"}]}],"quiz":[[{"q":"Kiểm định Mardia có p < 0,001. Lựa chọn ước lượng hợp lý trong lavaan là gì?","opts":["Bỏ dữ liệu","estimator = \"MLR\"","estimator = \"GLS\"","Chuẩn hoá dữ liệu bằng scale()"],"ok":1,"why":"MLR cho sai số chuẩn và thống kê χ² vững với dữ liệu không chuẩn."},{"q":"Một câu có skew = −1,2 và kurtosis = 1,8. Kết luận theo West và cộng sự (1995)?","opts":["Lệch ở mức chấp nhận được","Phải loại câu này","Dữ liệu chuẩn tuyệt đối","Không đủ thông tin"],"ok":0,"why":"Dưới ngưỡng |2| và |7|."},{"q":"Trong ggplot2, phần nào khai báo biến nào lên trục x?","opts":["geom_histogram()","aes()","labs()","theme_minimal()"],"ok":1,"why":"aes() ánh xạ biến vào thuộc tính thẩm mỹ như x, y, fill."}]]},{"id":"b07","so":7,"tieu_de":"Kiểm định khác biệt và hồi quy nền tảng","gd":2,"tg":"60 phút","goi":"base R, car","muc_tieu":["Chọn đúng kiểm định cho câu hỏi so sánh nhóm","Chạy t-test, ANOVA, chi-square","Chạy hồi quy tuyến tính bội và kiểm tra đa cộng tuyến","Hiểu vì sao cần SEM thay cho hồi quy điểm trung bình"],"html":"<h2>Chọn kiểm định<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Câu hỏi<\/th>\n<th>Biến<\/th>\n<th>Kiểm định<\/th>\n<th>Hàm R<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nam và nữ có khác nhau về Ý định?<\/td>\n<td>1 định danh 2 nhóm, 1 định lượng<\/td>\n<td>t-test độc lập<\/td>\n<td><code>t.test()<\/code><\/td>\n<\/tr>\n<tr>\n<td>3 nhóm tần suất có khác nhau?<\/td>\n<td>1 định danh ≥ 3 nhóm, 1 định lượng<\/td>\n<td>ANOVA một yếu tố<\/td>\n<td><code>aov()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Phân phối không chuẩn, mẫu nhỏ<\/td>\n<td>như trên<\/td>\n<td>Mann–Whitney, Kruskal–Wallis<\/td>\n<td><code>wilcox.test()<\/code>, <code>kruskal.test()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Giới tính có liên hệ với nền tảng?<\/td>\n<td>2 định danh<\/td>\n<td>Chi bình phương<\/td>\n<td><code>chisq.test()<\/code><\/td>\n<\/tr>\n<tr>\n<td>HI, NT ảnh hưởng YD?<\/td>\n<td>nhiều định lượng<\/td>\n<td>Hồi quy bội<\/td>\n<td><code>lm()<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<h2>t-test độc lập: Nam và Nữ<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>Mặc định R dùng t-test Welch, an toàn hơn khi phương sai hai nhóm\nkhác nhau. Báo cáo: <em>t<\/em>(df) = …, <em>p<\/em> = …, kèm trung bình\nhai nhóm.<\/p>\n<h2>ANOVA: ba nhóm tần suất<\/h2>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>Chi bình phương<\/h2>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>Hồi quy bội trên điểm trung\nbình<\/h2>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<p>Hệ số chuẩn hoá (beta) để so sánh mức tác động:<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<h2>Vì sao không dừng ở hồi quy?<\/h2>\n<p>Hồi quy trên điểm trung bình giả định mỗi câu hỏi đo <strong>không\nsai số<\/strong>. Thực tế câu hỏi luôn có sai số đo lường, làm hệ số hồi\nquy bị <strong>thu nhỏ<\/strong> (attenuation). Hồi quy cũng chỉ có một\nbiến phụ thuộc mỗi lần, trong khi mô hình nghiên cứu có chuỗi HI → TD →\nYD.<\/p>\n<p>SEM giải quyết cả hai: tách sai số đo lường khỏi biến tiềm ẩn và ước\nlượng mọi đường cùng lúc. Bài 10 trở đi sẽ làm việc này.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th><\/th>\n<th>Hồi quy điểm trung bình<\/th>\n<th>CB-SEM (lavaan)<\/th>\n<th>PLS-SEM (seminr)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sai số đo lường<\/td>\n<td>bỏ qua<\/td>\n<td>mô hình hoá<\/td>\n<td>xấp xỉ bằng tổ hợp<\/td>\n<\/tr>\n<tr>\n<td>Nhiều biến phụ thuộc<\/td>\n<td>không<\/td>\n<td>có<\/td>\n<td>có<\/td>\n<\/tr>\n<tr>\n<td>Đánh giá độ phù hợp toàn mô hình<\/td>\n<td>không<\/td>\n<td>có (CFI, RMSEA…)<\/td>\n<td>hạn chế (SRMR)<\/td>\n<\/tr>\n<tr>\n<td>Mục tiêu<\/td>\n<td>giải thích<\/td>\n<td>kiểm định lý thuyết<\/td>\n<td>dự báo, khám phá<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"df <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\ndf$HI <- rowMeans(df[paste0(\"HI\", 1:4)]); df$DD <- rowMeans(df[paste0(\"DD\", 1:4)])\ndf$NT <- rowMeans(df[paste0(\"NT\", 1:4)]); df$TD <- rowMeans(df[paste0(\"TD\", 1:3)])\ndf$YD <- rowMeans(df[paste0(\"YD\", 1:3)])","run":true,"seg":[]},{"code":"d2 <- subset(df, gioi_tinh %in% c(\"Nam\", \"Nữ\"))\nt.test(YD ~ gioi_tinh, data = d2)              # Welch, không giả định phương sai bằng nhau","run":true,"seg":[{"t":"o","v":"\n\tWelch Two Sample t-test\n\ndata:  YD by gioi_tinh\nt = -0.29, df = 307, p-value = 0.8\nalternative hypothesis: true difference in means between group Nam and group Nữ is not equal to 0\n95 percent confidence interval:\n -0.2049  0.1515\nsample estimates:\nmean in group Nam  mean in group Nữ \n            3.667             3.693 \n\n"}]},{"code":"df$tan_suat <- factor(df$tan_suat, levels = c(\"Hiếm khi\", \"Thỉnh thoảng\", \"Thường xuyên\"))\na <- aov(YD ~ tan_suat, data = df)\nsummary(a)\nTukeyHSD(a)                                     # so sánh từng cặp","run":true,"seg":[{"t":"o","v":"             Df Sum Sq Mean Sq F value Pr(>F)\ntan_suat      2    2.4   1.176    1.58   0.21\nResiduals   408  304.0   0.745               \n  Tukey multiple comparisons of means\n    95% family-wise confidence level\n\nFit: aov(formula = YD ~ tan_suat, data = df)\n\n$tan_suat\n                               diff      lwr    upr  p adj\nThỉnh thoảng-Hiếm khi      0.174721 -0.07272 0.4222 0.2216\nThường xuyên-Hiếm khi      0.172856 -0.10134 0.4471 0.3002\nThường xuyên-Thỉnh thoảng -0.001866 -0.24088 0.2371 0.9998\n\n"}]},{"code":"library(car)\nleveneTest(YD ~ tan_suat, data = df)            # kiểm định phương sai đồng nhất\noneway.test(YD ~ tan_suat, data = df)           # Welch ANOVA nếu Levene có p < 0,05","run":true,"seg":[{"t":"o","v":"Loading required package: carData\nLevene's Test for Homogeneity of Variance (center = median)\n       Df F value Pr(>F)\ngroup   2    1.75   0.17\n      408               \n\n\tOne-way analysis of means (not assuming equal variances)\n\ndata:  YD and tan_suat\nF = 1.6, num df = 2, denom df = 227, p-value = 0.2\n\n"}]},{"code":"tab <- table(df$gioi_tinh, df$nen_tang)\ntab\nchisq.test(tab[c(\"Nam\", \"Nữ\"), ])","run":true,"seg":[{"t":"o","v":"      \n       Facebook Live Shopee Live TikTok Shop\n                   1           1           1\n  Khác             2           2           3\n  Nam             23          47          81\n  Nữ              33          83         134\n\n\tPearson's Chi-squared test\n\ndata:  tab[c(\"Nam\", \"Nữ\"), ]\nX-squared = 0.4, df = 2, p-value = 0.8\n\n"}]},{"code":"hq <- lm(YD ~ HI + NT + TD + DD, data = df)\nsummary(hq)\nvif(hq)                                         # VIF < 3 là tốt, < 5 chấp nhận","run":true,"seg":[{"t":"o","v":"\nCall:\nlm(formula = YD ~ HI + NT + TD + DD, data = df)\n\nResiduals:\n    Min      1Q  Median      3Q     Max \n-2.0207 -0.4169  0.0607  0.4874  1.8041 \n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)    \n(Intercept)   0.8153     0.1986    4.11  4.9e-05 ***\nHI            0.1192     0.0460    2.59   0.0099 ** \nNT            0.2427     0.0446    5.45  8.9e-08 ***\nTD            0.3402     0.0457    7.45  5.8e-13 ***\nDD            0.0824     0.0442    1.86   0.0630 .  \n---\nSignif. codes:  0 ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\n\nResidual standard error: 0.682 on 406 degrees of freedom\nMultiple R-squared:  0.384,\tAdjusted R-squared:  0.378 \nF-statistic: 63.3 on 4 and 406 DF,  p-value: <2e-16\n\n   HI    NT    TD    DD \n1.325 1.293 1.552 1.309 \n"}]},{"code":"hq_z <- lm(scale(YD) ~ scale(HI) + scale(NT) + scale(TD) + scale(DD), data = df)\nround(coef(hq_z)[-1], 3)","run":true,"seg":[{"t":"o","v":"scale(HI) scale(NT) scale(TD) scale(DD) \n    0.116     0.241     0.361     0.083 \n"}]}],"quiz":[[{"q":"Muốn so sánh Ý định mua giữa 3 nền tảng livestream, dùng kiểm định nào?","opts":["t-test độc lập","ANOVA một yếu tố","Chi bình phương","Tương quan Pearson"],"ok":1,"why":"Một biến định danh 3 nhóm và một biến định lượng."},{"q":"Levene có p = 0,01. Nên dùng gì thay cho ANOVA thường?","opts":["Welch ANOVA: oneway.test()","Bỏ một nhóm","Chi bình phương","Không cần làm gì"],"ok":0,"why":"Phương sai không đồng nhất thì dùng Welch ANOVA, hậu kiểm Games-Howell."},{"q":"Vì sao hệ số hồi quy trên điểm trung bình thường nhỏ hơn hệ số SEM?","opts":["Vì SEM luôn phóng đại","Vì sai số đo lường làm giảm tương quan quan sát được","Vì hồi quy dùng ít quan sát hơn","Vì lavaan chuẩn hoá sai"],"ok":1,"why":"Sai số đo lường gây hiện tượng suy giảm (attenuation)."}]]},{"id":"b08","so":8,"tieu_de":"Độ tin cậy thang đo: Cronbach's alpha và omega","gd":3,"tg":"45 phút","goi":"psych","muc_tieu":["Tính Cronbach's alpha và đọc bảng item-total","Biết khi nào nên loại câu","Tính McDonald's omega và hiểu vì sao nhiều tạp chí ưa omega hơn alpha"],"html":"<h2>Cronbach’s alpha cho từng\nkhái niệm<\/h2>\n<div class=\"warn\">\n<p>Gói ggplot2 (Bài 6) cũng có hàm tên <code>alpha()<\/code> để chỉnh độ\ntrong suốt màu. Nạp ggplot2 sau psych thì <code>alpha(df[...])<\/code>\ngọi nhầm hàm của ggplot2 và báo lỗi <em>Unknown colour name<\/em>. Luôn\nviết rõ <code>psych::alpha()<\/code>.<\/p>\n<\/div>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>Đọc bảng:<\/p>\n<ul>\n<li><strong>raw_alpha<\/strong> ≥ 0,70 là đạt (Nunnally &amp; Bernstein,\n1994); 0,60–0,70 chấp nhận được cho nghiên cứu khám phá.<\/li>\n<li><strong>r.drop<\/strong> (Corrected Item-Total Correlation) ≥ 0,30 là\nđạt.<\/li>\n<li><strong>alpha nếu loại câu<\/strong> cao hơn alpha hiện tại một cách\nrõ rệt là gợi ý xem lại câu đó.<\/li>\n<\/ul>\n<p>Ở đây HI4 có r.drop thấp nhất và loại HI4 làm alpha\n<strong>tăng<\/strong>. Đừng loại ngay: xem thêm hệ số tải ở CFA (Bài 10)\nvà giá trị nội dung của câu.<\/p>\n<h2>Chạy cho cả năm khái niệm một\nlần<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<div class=\"warn\">\n<p>Alpha âm hoặc rất thấp kèm thông báo <em>Some items were negatively\ncorrelated with the total scale<\/em> nghĩa là có câu đảo chiều\n<strong>chưa được đảo<\/strong>. Quay lại Bài 5, bước 6.<\/p>\n<\/div>\n<h2>McDonald’s omega<\/h2>\n<p>Alpha giả định mọi câu có hệ số tải bằng nhau (tau-equivalence). Điều\nnày hiếm khi đúng, nên alpha thường ước lượng thấp độ tin cậy thật.\nOmega dựa trên hệ số tải nhân tố nên chính xác hơn.<\/p>\n<p><code>omega()<\/code> in vài cảnh báo “Omega_h for 1 factor is not\nmeaningful”: với một nhân tố chỉ cần omega tổng (omega_t), nên có thể bỏ\nqua cảnh báo này.<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>Viết vào báo cáo<\/h2>\n<blockquote>\n<p>Thang đo Hữu ích cảm nhận đạt độ tin cậy với Cronbach’s α = 0,84 và\nMcDonald’s ω = 0,85. Tương quan biến – tổng hiệu chỉnh của các biến quan\nsát nằm trong khoảng 0,49–0,77, đều lớn hơn 0,30. Câu HI4 có tương quan\nthấp nhất (0,49) nhưng vẫn được giữ lại để đánh giá tiếp trong CFA.<\/p>\n<\/blockquote>\n<p>Số trong đoạn mẫu phải lấy từ kết quả của bạn, không chép.<\/p>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(psych)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\na_HI <- psych::alpha(df[paste0(\"HI\", 1:4)])\na_HI$total[, c(\"raw_alpha\", \"std.alpha\", \"average_r\")]\nround(a_HI$item.stats[, c(\"r.drop\", \"mean\", \"sd\")], 3)     # tương quan biến – tổng hiệu chỉnh\nround(a_HI$alpha.drop[, \"raw_alpha\", drop = FALSE], 3)     # alpha nếu loại câu","run":true,"seg":[{"t":"o","v":" raw_alpha std.alpha average_r\n    0.8413    0.8396    0.5667\n    r.drop  mean    sd\nHI1  0.763 3.630 1.050\nHI2  0.771 3.674 1.039\nHI3  0.691 3.664 1.019\nHI4  0.489 3.667 0.984\n    raw_alpha\nHI1     0.759\nHI2     0.755\nHI3     0.792\nHI4     0.874\n"}]},{"code":"thang_do <- list(HI = paste0(\"HI\", 1:4), DD = paste0(\"DD\", 1:4), NT = paste0(\"NT\", 1:4),\n                 TD = paste0(\"TD\", 1:3), YD = paste0(\"YD\", 1:3))\nbang <- t(sapply(thang_do, function(v) {\n  a <- psych::alpha(df[v], warnings = FALSE)\n  c(so_cau = length(v), alpha = a$total$raw_alpha,\n    r_drop_min = min(a$item.stats$r.drop), cau_yeu_nhat = which.min(a$item.stats$r.drop))\n}))\nround(bang, 3)","run":true,"seg":[{"t":"o","v":"   so_cau alpha r_drop_min cau_yeu_nhat\nHI      4 0.841      0.489            4\nDD      4 0.843      0.650            3\nNT      4 0.850      0.684            4\nTD      3 0.859      0.719            3\nYD      3 0.833      0.683            2\n"}]},{"code":"o_HI <- suppressWarnings(omega(df[paste0(\"HI\", 1:4)], nfactors = 1, plot = FALSE))\nround(c(alpha = o_HI$alpha, omega_total = o_HI$omega.tot), 3)","run":true,"seg":[{"t":"o","v":"Loading required namespace: GPArotation\nOmega_h for 1 factor is not meaningful, just omega_t\n      alpha omega_total \n       0.84        0.85 \n"}]},{"code":"omega_1 <- function(v) suppressMessages(suppressWarnings(omega(df[v], nfactors = 1, plot = FALSE)))$omega.tot\nround(sapply(thang_do, omega_1), 3)","run":true,"seg":[{"t":"o","v":"   HI    DD    NT    TD    YD \n0.850 0.844 0.850 0.859 0.833 \n"}]}],"quiz":[[{"q":"Thang đo có α = 0,82; loại câu X làm α thành 0,83. Quyết định hợp lý nhất?","opts":["Loại câu X ngay","Giữ câu X, xem tiếp hệ số tải ở CFA và giá trị nội dung","Loại cả thang đo","Thêm câu mới"],"ok":1,"why":"Mức tăng 0,01 không đáng kể; loại câu phải cân nhắc cả lý thuyết."},{"q":"Vì sao omega thường được ưa hơn alpha?","opts":["Omega luôn lớn hơn 0,7","Omega không đòi hỏi các câu có hệ số tải bằng nhau","Omega không cần dữ liệu","Alpha chỉ dùng cho SPSS"],"ok":1,"why":"Alpha giả định tau-equivalence, điều hiếm khi thoả."},{"q":"Ngưỡng tương quan biến – tổng hiệu chỉnh thường dùng là?","opts":["0,10","0,30","0,50","0,70"],"ok":1,"why":"Nunnally & Bernstein (1994)."}]]},{"id":"b09","so":9,"tieu_de":"Phân tích nhân tố khám phá (EFA)","gd":3,"tg":"60 phút","goi":"psych, GPArotation","muc_tieu":["Kiểm tra KMO và Bartlett","Xác định số nhân tố bằng parallel analysis","Chạy EFA với phép xoay xiên và đọc ma trận mẫu","Nhận diện câu tải chéo"],"html":"<h2>Khi nào cần EFA?<\/h2>\n<ul>\n<li>Thang đo <strong>mới<\/strong> hoặc <strong>dịch<\/strong> sang tiếng\nViệt lần đầu: nên chạy EFA trước CFA.<\/li>\n<li>Thang đo đã kiểm định nhiều lần: có thể đi thẳng CFA. Nhiều luận văn\nViệt Nam vẫn chạy EFA theo thói quen SPSS; điều đó không sai nhưng không\nbắt buộc.<\/li>\n<li>Không chạy EFA và CFA trên <strong>cùng một mẫu<\/strong> rồi coi CFA\nlà “khẳng định”. Nếu mẫu đủ lớn, chia đôi ngẫu nhiên.<\/li>\n<\/ul>\n<h2>KMO và Bartlett<\/h2>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>KMO ≥ 0,80 là tốt, ≥ 0,60 chấp nhận được (Kaiser, 1974). Bartlett có\np &lt; 0,05 nghĩa là ma trận tương quan khác ma trận đơn vị, đủ điều\nkiện phân tích nhân tố.<\/p>\n<h2>Số nhân tố: parallel analysis<\/h2>\n<p>Tiêu chí eigenvalue &gt; 1 của SPSS thường giữ quá nhiều nhân tố.\nParallel analysis so eigenvalue thật với eigenvalue của dữ liệu ngẫu\nnhiên, đáng tin hơn (Horn, 1965).<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<h2>Chạy EFA<\/h2>\n<p>Dùng phương pháp trích <strong>ML<\/strong> (hoặc PAF:\n<code>fm = \"pa\"<\/code>) với phép xoay xiên <strong>promax<\/strong> hoặc\n<strong>oblimin<\/strong>, vì các khái niệm trong mô hình hành vi luôn\ntương quan với nhau. Varimax (xoay vuông góc) giả định các nhân tố không\ntương quan, ít phù hợp.<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>Đọc ma trận mẫu<\/h2>\n<ul>\n<li>Mỗi câu nên tải ≥ 0,50 lên <strong>đúng một<\/strong> nhân tố của\nnó.<\/li>\n<li><strong>Tải chéo<\/strong>: câu tải ≥ 0,30 lên hai nhân tố và chênh\nlệch &lt; 0,20.<\/li>\n<li>Communality &lt; 0,30 gợi ý câu đo kém.<\/li>\n<\/ul>\n<p>Ở dữ liệu này, 18 câu tách đúng 5 nhân tố. Hai câu cần để ý:\n<strong>HI4<\/strong> tải 0,48 và communality chỉ 0,27;\n<strong>NT4<\/strong> tải 0,70 lên Niềm tin nhưng có hệ số tải phụ 0,21,\ncao nhất trong các câu. Bảng dưới xếp các câu theo độ “phân biệt” từ kém\nđến tốt.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<div class=\"tip\">\n<p>Hệ số tải phụ 0,21 của NT4 chưa vượt ngưỡng 0,30 nên EFA chưa báo\nđộng. CFA ở Bài 10 sẽ cho thấy rõ hơn qua chỉ số điều chỉnh\n(modification index). Khi gặp tải chéo, đọc lại nội dung câu trước khi\nloại: NT4 (“Người bán cung cấp thông tin sản phẩm có ích”) có thể được\nhiểu như một lợi ích. Đó là vấn đề <strong>diễn đạt câu hỏi<\/strong>,\nghi lại để sửa bảng hỏi lần sau.<\/p>\n<\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(psych)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nitems <- names(df)[8:25]\nKMO(df[items])$MSA                       # KMO tổng\nround(KMO(df[items])$MSAi, 2)            # MSA từng câu\ncortest.bartlett(cor(df[items]), n = nrow(df))","run":true,"seg":[{"t":"o","v":"[1] 0.8947\n HI1  HI2  HI3  HI4  DD1  DD2  DD3  DD4  NT1  NT2  NT3  NT4  TD1  TD2  TD3  YD1 \n0.84 0.82 0.93 0.92 0.90 0.87 0.91 0.90 0.88 0.90 0.87 0.92 0.91 0.91 0.91 0.91 \n YD2  YD3 \n0.90 0.91 \n$chisq\n[1] 3747\n\n$p.value\n[1] 0\n\n$df\n[1] 153\n\n"}]},{"code":"set.seed(2026)\npa <- fa.parallel(df[items], fm = \"ml\", fa = \"fa\", n.iter = 50)","run":true,"seg":[{"t":"p","v":"b09-02-1.png"},{"t":"o","v":"Parallel analysis suggests that the number of factors =  5  and the number of components =  NA \n"}]},{"code":"efa <- fa(df[items], nfactors = 5, fm = \"ml\", rotate = \"promax\")\nprint(efa$loadings, cutoff = 0.30, sort = TRUE)","run":true,"seg":[{"t":"o","v":"Loading required namespace: GPArotation\n\nLoadings:\n    ML2    ML3    ML4    ML1    ML5   \nHI1  0.904                            \nHI2  0.947                            \nHI3  0.685                            \nDD1         0.746                     \nDD2         0.825                     \nDD3         0.703                     \nDD4         0.736                     \nNT1                0.820              \nNT2                0.733              \nNT3                0.793              \nNT4                0.702              \nTD1                       0.809       \nTD2                       0.825       \nTD3                       0.749       \nYD1                              0.768\nYD2                              0.765\nYD3                              0.797\nHI4  0.483                            \n\n                 ML2   ML3   ML4   ML1   ML5\nSS loadings    2.492 2.304 2.356 1.989 1.830\nProportion Var 0.138 0.128 0.131 0.111 0.102\nCumulative Var 0.138 0.266 0.397 0.508 0.610\n"}]},{"code":"round(efa$Phi, 2)                         # tương quan giữa các nhân tố\nround(sort(efa$communality), 2)           # hệ số chung (communality)","run":true,"seg":[{"t":"o","v":"     ML2  ML3  ML4  ML1  ML5\nML2 1.00 0.34 0.32 0.54 0.44\nML3 0.34 1.00 0.42 0.46 0.41\nML4 0.32 0.42 1.00 0.47 0.52\nML1 0.54 0.46 0.47 1.00 0.62\nML5 0.44 0.41 0.52 0.62 1.00\n HI4  DD3  DD4  DD1  HI3  NT3  NT2  NT1  YD2  YD3  NT4  TD3  YD1  DD2  TD1  TD2 \n0.27 0.54 0.56 0.57 0.57 0.58 0.60 0.61 0.62 0.63 0.64 0.64 0.66 0.67 0.68 0.70 \n HI1  HI2 \n0.78 0.81 \n"}]},{"code":"L <- unclass(efa$loadings)\ncheo <- apply(abs(L), 1, function(x) { s <- sort(x, decreasing = TRUE); unname(c(s[1], s[2], s[1] - s[2])) })\ncheo <- t(cheo); colnames(cheo) <- c(\"cao_nhat\", \"thu_hai\", \"chenh\")\nround(cheo[order(cheo[, \"chenh\"]), ][1:5, ], 2)          # 5 câu \"phân biệt\" kém nhất","run":true,"seg":[{"t":"o","v":"    cao_nhat thu_hai chenh\nHI4     0.48    0.08  0.40\nNT4     0.70    0.21  0.50\nHI3     0.69    0.11  0.57\nDD3     0.70    0.11  0.59\nYD2     0.77    0.13  0.64\n"}]}],"quiz":[[{"q":"Vì sao promax thường phù hợp hơn varimax trong nghiên cứu hành vi?","opts":["Vì các khái niệm như Thái độ và Ý định có tương quan với nhau","Vì promax luôn cho hệ số tải cao hơn","Vì varimax không có trong R","Vì promax không cần KMO"],"ok":0,"why":"Xoay xiên cho phép các nhân tố tương quan."},{"q":"KMO = 0,55. Kết luận?","opts":["Rất tốt","Tốt","Dưới mức chấp nhận, xem lại câu có MSA thấp","Không liên quan"],"ok":2,"why":"Kaiser (1974): dưới 0,60 là không đạt."},{"q":"Một câu tải 0,48 lên F1 và 0,41 lên F3. Đây là?","opts":["Câu tốt","Câu tải chéo","Heywood case","Nhân tố mới"],"ok":1,"why":"Hai hệ số tải ≥ 0,30 và chênh nhau dưới 0,20."}]]},{"id":"b10","so":10,"tieu_de":"CFA với lavaan: mô hình đo lường","gd":4,"tg":"120 phút","goi":"lavaan, semTools","muc_tieu":["Viết cú pháp mô hình đo lường bằng =~","Đọc độ phù hợp χ², CFI, TLI, RMSEA, SRMR","Đánh giá hệ số tải, CR, AVE","Kiểm định giá trị phân biệt bằng Fornell–Larcker và HTMT","Dùng modification index đúng cách","Kiểm tra sai lệch phương pháp chung"],"html":"<h2>Cú pháp lavaan trong một\nbảng<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Toán tử<\/th>\n<th>Nghĩa<\/th>\n<th>Ví dụ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>=~<\/code><\/td>\n<td>“được đo bởi” (biến tiềm ẩn ← biến quan sát)<\/td>\n<td><code>HI =~ HI1 + HI2 + HI3 + HI4<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>~<\/code><\/td>\n<td>hồi quy (“bị tác động bởi”)<\/td>\n<td><code>YD ~ TD + NT<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>~~<\/code><\/td>\n<td>hiệp phương sai / phương sai<\/td>\n<td><code>HI1 ~~ HI2<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>:=<\/code><\/td>\n<td>định nghĩa tham số mới (hiệu ứng gián tiếp)<\/td>\n<td><code>ind := a*b<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>a*<\/code><\/td>\n<td>gắn nhãn hoặc cố định tham số<\/td>\n<td><code>YD ~ b*TD<\/code>, <code>HI =~ 1*HI1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>~ 1<\/code><\/td>\n<td>hệ số chặn (intercept)<\/td>\n<td><code>HI1 ~ 1<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Mô hình là một <strong>chuỗi ký tự<\/strong> đặt trong dấu nháy. Mỗi\ndòng một phương trình.<\/p>\n<h2>Mô hình CFA năm nhân tố<\/h2>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>Mặc định, lavaan cố định hệ số tải của câu <strong>đầu tiên<\/strong>\nbằng 1 để xác định thang đo cho biến tiềm ẩn (marker variable), và cho\ncác biến tiềm ẩn tự do tương quan với nhau. Cột cần đọc là\n<strong>Std.all<\/strong> (hệ số tải chuẩn hoá hoàn toàn).<\/p>\n<p>Với <code>estimator = \"MLR\"<\/code>, đọc cột <strong>Robust<\/strong>\n(hoặc các chỉ số có hậu tố <code>.robust<\/code>) cho CFI, TLI,\nRMSEA.<\/p>\n<h2>Trích đúng các chỉ số cần báo\ncáo<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Chỉ số<\/th>\n<th>Ngưỡng tốt<\/th>\n<th>Nguồn<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>χ²/df<\/td>\n<td>&lt; 3 (chấp nhận &lt; 5)<\/td>\n<td>Kline (2016)<\/td>\n<\/tr>\n<tr>\n<td>CFI, TLI<\/td>\n<td>≥ 0,95 tốt; ≥ 0,90 chấp nhận<\/td>\n<td>Hu &amp; Bentler (1999)<\/td>\n<\/tr>\n<tr>\n<td>RMSEA<\/td>\n<td>≤ 0,06 tốt; ≤ 0,08 chấp nhận<\/td>\n<td>Hu &amp; Bentler (1999); Browne &amp; Cudeck (1993)<\/td>\n<\/tr>\n<tr>\n<td>SRMR<\/td>\n<td>≤ 0,08<\/td>\n<td>Hu &amp; Bentler (1999)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"note\">\n<p>χ² gần như luôn có p &lt; 0,05 khi mẫu trên 200, vì kiểm định rất\nnhạy với cỡ mẫu. Đừng kết luận mô hình “không phù hợp” chỉ vì χ²; đọc\ncùng các chỉ số khác.<\/p>\n<\/div>\n<h2>Hệ số tải chuẩn hoá<\/h2>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<p>Ngưỡng: hệ số tải ≥ 0,70 là lý tưởng; 0,50–0,70 có thể giữ nếu CR và\nAVE vẫn đạt (Hair và cộng sự, 2019). HI4 (≈ 0,51) là ứng viên cần cân\nnhắc.<\/p>\n<h2>Độ tin cậy tổng\nhợp (CR) và phương sai trích (AVE)<\/h2>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<p>Ngưỡng: CR ≥ 0,70; AVE ≥ 0,50 (Fornell &amp; Larcker, 1981; Hair và\ncộng sự, 2019).<\/p>\n<div class=\"warn\">\n<p>Chạy <code>compRelSEM()<\/code> và <code>AVE()<\/code> trên <strong>mô\nhình CFA<\/strong>, không chạy trên mô hình SEM có đường hồi quy. Với mô\nhình SEM, semTools tính độ tin cậy của biến nội sinh theo cách khác và\ncho số rất lạ (ví dụ CR = 0,13).<\/p>\n<\/div>\n<h2>Giá trị phân biệt<\/h2>\n<h3 id=\"fornelllarcker\">Fornell–Larcker<\/h3>\n<p>Căn bậc hai AVE của mỗi khái niệm phải lớn hơn tương quan của nó với\nmọi khái niệm khác.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h3 id=\"htmt\">HTMT<\/h3>\n<p>HTMT (Henseler, Ringle &amp; Sarstedt, 2015) nhạy hơn\nFornell–Larcker. Ngưỡng &lt; 0,85 (nghiêm) hoặc &lt; 0,90 (khái niệm gần\nnhau về lý thuyết).<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>Modification index: dùng có lý\ndo<\/h2>\n<p>Modification index (MI) cho biết χ² giảm bao nhiêu nếu giải phóng một\ntham số. MI chỉ là gợi ý thống kê; mọi chỉnh sửa phải có <strong>lý do\nlý thuyết hoặc nội dung câu hỏi<\/strong>.<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<p>Hai gợi ý lớn nhất:<\/p>\n<ol type=\"1\">\n<li><code>HI =~ NT4<\/code>: NT4 tải chéo sang Hữu ích. Không nên thêm\ntải chéo trong CFA khẳng định; cách xử lý thường là <strong>loại\nNT4<\/strong> nếu lý thuyết cho phép, hoặc giữ và báo cáo.<\/li>\n<li><code>HI1 ~~ HI2<\/code>: hai câu diễn đạt gần giống nhau (“tiết kiệm\nthời gian”, “mua nhanh hơn”). Cho sai số tương quan <strong>trong cùng\nmột khái niệm<\/strong> là chấp nhận được khi có lý do về cách diễn\nđạt.<\/li>\n<\/ol>\n<div class=\"warn\">\n<p>Không bao giờ nối sai số của hai câu <strong>thuộc hai khái niệm khác\nnhau<\/strong> chỉ để tăng CFI. Người phản biện sẽ hỏi lý do, và thường\nkhông có lý do.<\/p>\n<\/div>\n<h2>Mô hình hiệu chỉnh<\/h2>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<h2>Likert là biến thứ\nbậc: khi nào dùng WLSMV?<\/h2>\n<p>Câu Likert là biến <strong>thứ bậc<\/strong>, không phải liên tục. Coi\nLikert là liên tục và ước lượng bằng ML/MLR chấp nhận được khi thang có\n<strong>từ 5 mức trở lên<\/strong> và phân phối không lệch nặng\n(Rhemtulla, Brosseau-Liard &amp; Savalei, 2012). Khi thang có 2–4 mức,\nhoặc nhiều câu dồn về một đầu thang, dùng ước lượng\n<strong>WLSMV<\/strong> trên ma trận tương quan đa chuỗi (polychoric)\nbằng cách khai <code>ordered = TRUE<\/code>.<\/p>\n<div class=\"chunk\" data-i=\"8\"><\/div>\n<p>Hệ số tải WLSMV thường <strong>cao hơn<\/strong> MLR vì tương quan đa\nchuỗi không bị thang đo rời rạc kéo thấp. Hai cách cho cùng kết luận ở\ndữ liệu này. Với Likert 5 mức, MLR là lựa chọn phổ biến; ghi rõ lựa chọn\nvà lý do trong chương phương pháp. Lưu ý: với WLSMV, đọc các chỉ số có\nhậu tố <code>.scaled<\/code>, và AIC/BIC không có.<\/p>\n<h2>Sai lệch phương pháp chung\n(CMB)<\/h2>\n<p>Khi mọi biến được đo bằng cùng một bảng hỏi, cùng một người trả lời,\ncó thể xuất hiện sai lệch do phương pháp (Podsakoff và cộng sự,\n2003).<\/p>\n<p><strong>Harman một nhân tố<\/strong>: gộp mọi câu vào một nhân tố. Nếu\nnhân tố này giải thích dưới 50% phương sai và mô hình một nhân tố phù\nhợp rất kém, CMB không nghiêm trọng. Đây là kiểm tra yếu, nên kèm thêm\ncách thứ hai.<\/p>\n<div class=\"chunk\" data-i=\"9\"><\/div>\n<p><strong>Nhân tố phương pháp không đo lường (ULMC)<\/strong>: thêm một\nnhân tố “phương pháp” tải lên mọi câu, trực giao với các khái niệm\n(Podsakoff và cộng sự, 2003; Liang và cộng sự, 2007). So sánh phương sai\ntrung bình mà mỗi câu nhận từ khái niệm của nó (bình phương hệ số tải\nchính) với phương sai từ nhân tố phương pháp. Nếu phần phương pháp nhỏ\nhơn nhiều, CMB không đáng lo.<\/p>\n<div class=\"chunk\" data-i=\"10\"><\/div>\n<p>Ở đây phương sai do phương pháp chỉ khoảng 6%, nhỏ hơn hơn mười lần\nphần do khái niệm. Lưu ý: dữ liệu mô phỏng này có cài sẵn một nhân tố\nphương pháp nhỏ, và ULMC đã bắt được nó.<\/p>\n<h2>Vẽ sơ đồ CFA<\/h2>\n<div class=\"chunk\" data-i=\"11\"><\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(lavaan)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nmo_hinh_cfa <- '\n  HI =~ HI1 + HI2 + HI3 + HI4\n  DD =~ DD1 + DD2 + DD3 + DD4\n  NT =~ NT1 + NT2 + NT3 + NT4\n  TD =~ TD1 + TD2 + TD3\n  YD =~ YD1 + YD2 + YD3\n'\ncfa1 <- cfa(mo_hinh_cfa, data = df, estimator = \"MLR\")\nsummary(cfa1, fit.measures = TRUE, standardized = TRUE)","run":true,"seg":[{"t":"o","v":"This is lavaan 0.7-3\nlavaan is FREE software! Please report any bugs.\nlavaan 0.7-3 ended normally after 38 iterations\n\n  Estimator                                         ML\n  Optimization method                           NLMINB\n  Number of model parameters                        46\n\n  Number of observations                           411\n\nModel Test User Model:\n                                              Standard      Scaled\n  Test Statistic                               195.867     189.975\n  Degrees of freedom                               125         125\n  P-value (Chi-square)                           0.000       0.000\n  Scaling correction factor                                  1.031\n    Yuan-Bentler correction (Mplus variant)                       \n\nModel Test Baseline Model:\n\n  Test statistic                              3819.957    3670.426\n  Degrees of freedom                               153         153\n  P-value                                        0.000       0.000\n  Scaling correct dSolution(cfa_tb), op == \"=~\")$est.std, 3))\nhead(so_tai, 8)","run":true,"seg":[{"t":"o","v":"chisq.scaled    df.scaled   cfi.scaled   tli.scaled rmsea.scaled         srmr \n     120.368      108.000        0.998        0.998        0.017        0.030 \n  cau   MLR WLSMV\n1 HI1 0.790 0.829\n2 HI2 0.787 0.814\n3 HI3 0.822 0.870\n4 HI4 0.543 0.578\n5 DD1 0.749 0.781\n6 DD2 0.802 0.832\n7 DD3 0.727 0.770\n8 DD4 0.754 0.799\n"}]},{"code":"items <- c(paste0(\"HI\", 1:4), paste0(\"DD\", 1:4), paste0(\"NT\", 1:3), paste0(\"TD\", 1:3), paste0(\"YD\", 1:3))\npc1 <- prcomp(df[items], scale. = TRUE)\nround(100 * pc1$sdev[1]^2 / length(items), 1)        # % phương sai nhân tố đầu tiên\nmot_nt <- cfa(paste(\"F =~\", paste(items, collapse = \" + \")), data = df)\nround(fitMeasures(mot_nt, c(\"cfi\", \"rmsea\", \"srmr\")), 3)","run":true,"seg":[{"t":"o","v":"[1] 36.7\n  cfi rmsea  srmr \n0.573 0.171 0.122 \n"}]},{"code":"mo_hinh_clf <- paste0(mo_hinh_cfa2, \"\\n  PP =~ \", paste(items, collapse = \" + \"), \"\\n\",\n                      \"  PP ~~ 0*HI + 0*DD + 0*NT + 0*TD + 0*YD\\n\")\nclf <- cfa(mo_hinh_clf, data = df, estimator = \"MLR\", std.lv = TRUE)  # std.lv: phương sai nhân tố = 1\nss_clf <- standardizedSolution(clf)\ntai_pp <- subset(ss_clf, lhs == \"PP\" & op == \"=~\")$est.std\ntai_chinh <- subset(ss_clf, lhs != \"PP\" & op == \"=~\")$est.std\nround(c(phuong_sai_khai_niem = mean(tai_chinh^2), phuong_sai_phuong_phap = mean(tai_pp^2),\n        ti_so = mean(tai_chinh^2) / mean(tai_pp^2)), 3)","run":true,"seg":[{"t":"o","v":"  phuong_sai_khai_niem phuong_sai_phuong_phap                  ti_so \n                 0.549                  0.061                  8.966 \n"}]},{"code":"library(semPlot)\nsemPaths(cfa2, what = \"std\", layout = \"tree2\", edge.label.cex = 0.8, sizeMan = 5, sizeLat = 8,\n         residuals = FALSE, intercepts = FALSE, nCharNodes = 0, edge.color = \"#2f4858\")","run":true,"seg":[{"t":"p","v":"b10-12-1.png"}]}],"quiz":[[{"q":"Toán tử nào khai báo HI được đo bởi HI1–HI4?","opts":["HI =~ HI1 + HI2 + HI3 + HI4","HI ~ HI1 + HI2 + HI3 + HI4","HI ~~ HI1 + HI2 + HI3 + HI4","HI := HI1 + HI2 + HI3 + HI4"],"ok":0,"why":"=~ là \"được đo bởi\"; ~ là hồi quy."},{"q":"Mô hình có CFI = 0,96, RMSEA = 0,05, SRMR = 0,05, χ² có p < 0,001, n = 411. Kết luận?","opts":["Mô hình bị bác bỏ vì χ² có ý nghĩa","Mô hình phù hợp tốt; χ² nhạy với cỡ mẫu lớn","Cần thêm sai số tương quan đến khi χ² không có ý nghĩa","Không đủ thông tin"],"ok":1,"why":"Đọc đồng thời CFI, RMSEA, SRMR."},{"q":"Thang đo dùng 4 mức (không có điểm giữa) và nhiều câu lệch mạnh. Ước lượng nào hợp lý trong lavaan?","opts":["ML","WLSMV với ordered = TRUE","GLS","Bootstrap ML"],"ok":1,"why":"Rhemtulla và cộng sự (2012): dưới 5 mức thì xử lý như biến thứ bậc."},{"q":"MI gợi ý nối sai số HI3 với YD2 (hai khái niệm khác nhau). Làm gì?","opts":["Nối ngay để tăng CFI","Không nối nếu không có lý do lý thuyết; xem lại nội dung câu","Loại cả hai khái niệm","Đổi sang PLS-SEM"],"ok":1,"why":"Nối sai số chéo khái niệm thiếu căn cứ là thao túng mô hình."},{"q":"HTMT giữa TD và YD là 0,88. Đánh giá?","opts":["Vi phạm mọi ngưỡng","Vượt 0,85 nhưng dưới 0,90; chấp nhận nếu hai khái niệm gần nhau về lý thuyết","Rất tốt","Phải gộp hai khái niệm"],"ok":1,"why":"Henseler và cộng sự (2015) đề xuất 0,85 hoặc 0,90."}]]},{"id":"b11","so":11,"tieu_de":"SEM với lavaan: mô hình cấu trúc","gd":4,"tg":"90 phút","goi":"lavaan, semPlot","muc_tieu":["Thêm đường hồi quy ~ vào mô hình đo lường","Đọc hệ số đường, R², kiểm định giả thuyết","So sánh mô hình lồng nhau","Vẽ sơ đồ và lập bảng kết quả"],"html":"<h2>Mô hình nghiên cứu<\/h2>\n<p>Bảy giả thuyết của đề tài livestream:<\/p>\n<table>\n<thead>\n<tr>\n<th>Giả thuyết<\/th>\n<th>Đường<\/th>\n<th>Kỳ vọng<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>H1<\/td>\n<td>DD → HI<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H2<\/td>\n<td>DD → TD<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H3<\/td>\n<td>HI → TD<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H4<\/td>\n<td>NT → TD<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H5<\/td>\n<td>HI → YD<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H6<\/td>\n<td>NT → YD<\/td>\n<td>+<\/td>\n<\/tr>\n<tr>\n<td>H7<\/td>\n<td>TD → YD<\/td>\n<td>+<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Viết và ước lượng mô hình<\/h2>\n<p>Phần đo lường giữ nguyên mô hình CFA đã hiệu chỉnh ở Bài 10. Phần cấu\ntrúc thêm các dòng <code>~<\/code>. Gắn nhãn <code>h1*<\/code>,\n<code>h2*<\/code>… giúp lấy kết quả và định nghĩa hiệu ứng gián tiếp sau\nnày.<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<h2>Bảng kiểm định giả thuyết<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>R² của các biến nội sinh:<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<p>Diễn giải R² theo Cohen (1988) cho khoa học hành vi: 0,02 nhỏ; 0,13\ntrung bình; 0,26 lớn. Trong PLS-SEM, Hair và cộng sự dùng mốc 0,25 /\n0,50 / 0,75.<\/p>\n<h2>So sánh mô hình lồng nhau<\/h2>\n<p>Có nên thêm đường trực tiếp DD → YD? So sánh hai mô hình bằng kiểm\nđịnh chênh lệch χ² (với MLR, lavaan tự dùng hiệu chỉnh\nSatorra–Bentler).<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<div class=\"note\">\n<p>Ở đây Δχ² có p ≈ 0,45 và AIC, BIC của mô hình gốc thấp hơn: thêm DD →\nYD không cải thiện mô hình, nên giữ mô hình gốc gọn hơn. Nếu kết quả\nngược lại, đường mới vẫn <strong>không có trong giả thuyết ban\nđầu<\/strong>: báo cáo nó như một phát hiện thăm dò, không viết lại giả\nthuyết cho khớp dữ liệu (HARKing).<\/p>\n<\/div>\n<h2>Vẽ sơ đồ mô hình cấu trúc<\/h2>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<p><code>structural = TRUE<\/code> chỉ vẽ phần cấu trúc, gọn hơn cho báo\ncáo. Nhiều người vẽ lại sơ đồ bằng PowerPoint hoặc draw.io dựa trên số\nliệu R, cho đẹp hơn.<\/p>\n<h2>Xuất bảng ra Excel/Word<\/h2>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(lavaan)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nmo_hinh_sem <- '\n  # Mô hình đo lường\n  HI =~ HI1 + HI2 + HI3 + HI4\n  DD =~ DD1 + DD2 + DD3 + DD4\n  NT =~ NT1 + NT2 + NT3\n  TD =~ TD1 + TD2 + TD3\n  YD =~ YD1 + YD2 + YD3\n  HI1 ~~ HI2\n  # Mô hình cấu trúc\n  HI ~ h1*DD\n  TD ~ h2*DD + h3*HI + h4*NT\n  YD ~ h5*HI + h6*NT + h7*TD\n'\nsem1 <- sem(mo_hinh_sem, data = df, estimator = \"MLR\")\nsummary(sem1, fit.measures = TRUE, standardized = TRUE, rsquare = TRUE)","run":true,"seg":[{"t":"o","v":"This is lavaan 0.7-3\nlavaan is FREE software! Please report any bugs.\nlavaan 0.7-3 ended normally after 36 iterations\n\n  Estimator                                         ML\n  Optimization method                           NLMINB\n  Number of model parameters                        43\n\n  Number of observations                           411\n\nModel Test User Model:\n                                              Standard      Scaled\n  Test Statistic                               120.557     116.761\n  Degrees of freedom                               110         110\n  P-value (Chi-square)                           0.231       0.312\n  Scaling correction factor                                  1.033\n    Yuan-Bentler correction (Mplus variant)                       \n\nModel Test Baseline Model:\n\n  Test statistic                              3477.503    3332.411\n  Degrees of freedom                               136         136\n  P-value                                        0.000       0.000\n  Scaling correction factor                                  1.044\n\nUser Model versus Baseline Model:\n\n  Comparative Fit Index (CFI)                    0.997       0.998\n  Tucker-Lewis Index (TLI)                       0.996       0.997\n                                                                  \n  Robust Comparative Fit Index (CFI)                         0.998\n  Robust Tucker-Lewis Index (TLI)                            0.997\n\nLoglikelihood and Information Criteria:\n\n  Loglikelihood user model (H0)              -8411.201   -8411.201\n  Scaling correction factor    edge.color = \"#2f4858\", fade = FALSE)","run":true,"seg":[{"t":"p","v":"b11-05-1.png"}]},{"code":"write.csv(gt, \"ket_qua/bang_4_8_gia_thuyet.csv\", row.names = FALSE, fileEncoding = \"UTF-8\")\n# Mở bằng Excel → định dạng → dán vào Word. Hoặc dùng gói flextable để xuất thẳng .docx.","run":false,"seg":[]}],"quiz":[[{"q":"Dòng nào khai báo YD bị tác động bởi TD và NT?","opts":["YD ~ TD + NT","YD =~ TD + NT","TD + NT ~ YD","YD ~~ TD + NT"],"ok":0,"why":"Biến phụ thuộc đặt bên trái dấu ~."},{"q":"Cột nào trong summary() cho hệ số đường chuẩn hoá để so sánh mức tác động?","opts":["Estimate","Std.lv","Std.all","P(>|z|)"],"ok":2,"why":"Std.all chuẩn hoá cả biến tiềm ẩn và biến quan sát."},{"q":"Thêm một đường làm AIC giảm và kiểm định LRT có p < 0,01, nhưng đường đó không có trong lý thuyết. Báo cáo thế nào?","opts":["Thêm vào thành giả thuyết H8","Báo cáo là phát hiện thăm dò, giữ nguyên hệ giả thuyết ban đầu","Giấu đi","Bỏ mô hình gốc"],"ok":1,"why":"Tránh HARKing (đặt giả thuyết sau khi biết kết quả)."}]]},{"id":"b12","so":12,"tieu_de":"Phân tích trung gian bằng bootstrap","gd":4,"tg":"75 phút","goi":"lavaan, semTools","muc_tieu":["Định nghĩa hiệu ứng gián tiếp, trực tiếp, tổng bằng :=","Ước lượng khoảng tin cậy bootstrap","Phân loại trung gian theo Zhao, Lynch & Chen (2010)","Kiểm tra trung gian chuỗi"],"html":"<h2>Ý tưởng<\/h2>\n<p>Thái độ (TD) có phải là <strong>cầu nối<\/strong> giữa Hữu ích (HI) và\nÝ định (YD) không? Hiệu ứng gián tiếp = a × b, trong đó a là HI → TD và\nb là TD → YD.<\/p>\n<p>Tích a × b không phân phối chuẩn, nên kiểm định Sobel (giả định\nchuẩn) đã lỗi thời. Cách chuẩn hiện nay là <strong>bootstrap<\/strong>:\nlấy mẫu lặp có hoàn lại hàng nghìn lần, ước lượng a × b mỗi lần, rồi lấy\nkhoảng phân vị 2,5% – 97,5%. Khoảng không chứa 0 thì hiệu ứng gián tiếp\ncó ý nghĩa (Preacher &amp; Hayes, 2008).<\/p>\n<h2>Khai báo hiệu ứng bằng :=<\/h2>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<h2>Bootstrap<\/h2>\n<p>Khi viết bài thật dùng <code>bootstrap = 5000<\/code>. Ở đây dùng 1000\ncho nhanh (khoảng 20–60 giây).<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>So với hiệu ứng trực tiếp:<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<h2>Phân loại trung gian<\/h2>\n<p>Theo Zhao, Lynch &amp; Chen (2010), bỏ cách tiếp cận Baron &amp;\nKenny (1986) đòi hỏi tác động tổng phải có ý nghĩa trước:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Gián tiếp a×b<\/th>\n<th>Trực tiếp c’<\/th>\n<th>Loại<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>có ý nghĩa<\/td>\n<td>không ý nghĩa<\/td>\n<td>Trung gian toàn phần (indirect-only)<\/td>\n<\/tr>\n<tr>\n<td>có ý nghĩa<\/td>\n<td>có ý nghĩa, cùng dấu a×b×c’ &gt; 0<\/td>\n<td>Trung gian bổ sung (complementary, từng phần)<\/td>\n<\/tr>\n<tr>\n<td>có ý nghĩa<\/td>\n<td>có ý nghĩa, ngược dấu<\/td>\n<td>Trung gian cạnh tranh (competitive)<\/td>\n<\/tr>\n<tr>\n<td>không ý nghĩa<\/td>\n<td>có ý nghĩa<\/td>\n<td>Chỉ có tác động trực tiếp<\/td>\n<\/tr>\n<tr>\n<td>không ý nghĩa<\/td>\n<td>không ý nghĩa<\/td>\n<td>Không có tác động<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Áp vào kết quả: HI → TD → YD có khoảng tin cậy không chứa 0 và HI →\nYD trực tiếp cũng dương, có ý nghĩa: <strong>trung gian bổ\nsung<\/strong>.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<h2>Cách nhanh hơn: Monte Carlo\nCI<\/h2>\n<p>Khi bootstrap quá chậm (mô hình lớn, máy yếu), semTools có khoảng tin\ncậy Monte Carlo, cho kết quả gần như bootstrap trong vài giây:<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>Viết vào báo cáo<\/h2>\n<blockquote>\n<p>Kết quả bootstrap 5.000 mẫu cho thấy Thái độ làm trung gian mối quan\nhệ giữa Hữu ích cảm nhận và Ý định mua (β gián tiếp = …, KTC 95% [… ;\n…]). Do tác động trực tiếp HI → YD vẫn có ý nghĩa (β = …), đây là trung\ngian bổ sung theo phân loại của Zhao và cộng sự (2010).<\/p>\n<\/blockquote>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(lavaan)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nmo_hinh_tg <- '\n  HI =~ HI1 + HI2 + HI3 + HI4\n  DD =~ DD1 + DD2 + DD3 + DD4\n  NT =~ NT1 + NT2 + NT3\n  TD =~ TD1 + TD2 + TD3\n  YD =~ YD1 + YD2 + YD3\n  HI1 ~~ HI2\n  HI ~ a1*DD\n  TD ~ c2*DD + a2*HI + a3*NT\n  YD ~ c1*HI + c3*NT + b*TD\n  # Hiệu ứng gián tiếp\n  HI_TD_YD  := a2 * b              # HI → TD → YD\n  NT_TD_YD  := a3 * b              # NT → TD → YD\n  DD_HI_TD_YD := a1 * a2 * b       # trung gian chuỗi DD → HI → TD → YD\n  # Hiệu ứng tổng của HI lên YD\n  tong_HI   := c1 + a2 * b\n  ty_le_TG_HI := (a2 * b) / (c1 + a2 * b)   # tỉ lệ trung gian (VAF)\n'","run":true,"seg":[{"t":"o","v":"This is lavaan 0.7-3\nlavaan is FREE software! Please report any bugs.\n"}]},{"code":"set.seed(2026)\ntg <- sem(mo_hinh_tg, data = df, se = \"bootstrap\", bootstrap = 1000)\npe <- parameterEstimates(tg, boot.ci.type = \"perc\", standardized = TRUE)\nkq <- subset(pe, op == \":=\", select = c(lhs, est, se, ci.lower, ci.upper, std.all))\nkq[, -1] <- round(kq[, -1], 3)\nkq","run":true,"seg":[{"t":"o","v":"           lhs   est    se ci.lower ci.upper std.all\n49    HI_TD_YD 0.183 0.037    0.117    0.261   0.191\n50    NT_TD_YD 0.122 0.034    0.066    0.193   0.118\n51 DD_HI_TD_YD 0.076 0.019    0.043    0.119   0.076\n52     tong_HI 0.324 0.055    0.212    0.437   0.339\n53 ty_le_TG_HI 0.565 0.147    0.339    0.932   0.565\n"}]},{"code":"truc_tiep <- subset(pe, label %in% c(\"c1\", \"c3\", \"c2\"), select = c(label, lhs, rhs, est, ci.lower, ci.upper, std.all))\ntruc_tiep[, 4:7] <- round(truc_tiep[, 4:7], 3)\ntruc_tiep","run":true,"seg":[{"t":"o","v":"   label lhs rhs   est ci.lower ci.upper std.all\n20    c2  TD  DD 0.242    0.114    0.378   0.224\n23    c1  YD  HI 0.141    0.016    0.266   0.147\n24    c3  YD  NT 0.290    0.175    0.406   0.279\n"}]},{"code":"phan_loai <- function(ind_lo, ind_hi, dir_lo, dir_hi, ind, dir) {\n  co_ind <- ind_lo > 0 | ind_hi < 0; co_dir <- dir_lo > 0 | dir_hi < 0\n  if (co_ind && !co_dir) \"Trung gian toàn phần\"\n  else if (co_ind && co_dir && ind * dir > 0) \"Trung gian bổ sung (từng phần)\"\n  else if (co_ind && co_dir) \"Trung gian cạnh tranh\"\n  else if (co_dir) \"Chỉ tác động trực tiếp\" else \"Không có tác động\"\n}\ng <- subset(pe, lhs == \"HI_TD_YD\"); t <- subset(pe, label == \"c1\")\nphan_loai(g$ci.lower, g$ci.upper, t$ci.lower, t$ci.upper, g$est, t$est)\ng <- subset(pe, lhs == \"NT_TD_YD\"); t <- subset(pe, label == \"c3\")\nphan_loai(g$ci.lower, g$ci.upper, t$ci.lower, t$ci.upper, g$est, t$est)","run":true,"seg":[{"t":"o","v":"[1] \"Trung gian bổ sung (từng phần)\"\n[1] \"Trung gian bổ sung (từng phần)\"\n"}]},{"code":"library(semTools)\ntg_ml <- sem(mo_hinh_tg, data = df)\nset.seed(2026)\nmonteCarloCI(tg_ml, nRep = 20000)","run":true,"seg":[{"t":"o","v":" \n###############################################################################\nThis is semTools 0.5-9\nAll users of R (or SEM) are invited to submit functions or ideas for functions.\n###############################################################################\n              est ci.lower ci.upper\nHI_TD_YD    0.183    0.114    0.260\nNT_TD_YD    0.122    0.064    0.189\nDD_HI_TD_YD 0.076    0.044    0.117\ntong_HI     0.324    0.216    0.430\nty_le_TG_HI 0.565    0.340    0.899\n"}]}],"quiz":[[{"q":"Hiệu ứng gián tiếp có KTC 95% bootstrap [0,08; 0,21], tác động trực tiếp có KTC [−0,05; 0,12]. Loại trung gian?","opts":["Trung gian toàn phần (indirect-only)","Trung gian bổ sung","Trung gian cạnh tranh","Không có trung gian"],"ok":0,"why":"Gián tiếp có ý nghĩa (KTC không chứa 0), trực tiếp không."},{"q":"Vì sao kiểm định Sobel không còn được khuyến nghị?","opts":["Vì quá chậm","Vì giả định tích a×b phân phối chuẩn, điều thường không đúng","Vì chỉ dùng cho PLS","Vì không có trong R"],"ok":1,"why":"Bootstrap không cần giả định phân phối của a×b."},{"q":"Trong lavaan, toán tử nào định nghĩa hiệu ứng gián tiếp?","opts":["~","=~",":=","~~"],"ok":2,"why":":= định nghĩa tham số mới từ các nhãn đã gắn."}]]},{"id":"b13","so":13,"tieu_de":"Đa nhóm, bất biến đo lường và điều tiết","gd":4,"tg":"90 phút","goi":"lavaan, semTools","muc_tieu":["Kiểm định bất biến đo lường cấu hình, metric, scalar","So sánh hệ số đường giữa hai nhóm","Ước lượng tương tác biến tiềm ẩn bằng tích chỉ báo","Phân tích độ dốc đơn giản"],"html":"<h2>Câu hỏi nghiên cứu<\/h2>\n<p>Tác động của Thái độ lên Ý định có <strong>khác nhau<\/strong> giữa\nngười thường xuyên xem livestream và người ít xem không? Trước khi so\nsánh hệ số đường, phải chứng minh thang đo <strong>hiểu như\nnhau<\/strong> ở hai nhóm (bất biến đo lường). Nếu không, khác biệt có\nthể đến từ cách hiểu câu hỏi chứ không phải từ hành vi.<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<h2>Ba bậc bất biến đo lường<\/h2>\n<table>\n<thead>\n<tr>\n<th>Bậc<\/th>\n<th>Ràng buộc bằng nhau giữa nhóm<\/th>\n<th>Cho phép so sánh<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cấu hình (configural)<\/td>\n<td>cùng cấu trúc<\/td>\n<td>không gì cả<\/td>\n<\/tr>\n<tr>\n<td>Metric (weak)<\/td>\n<td>+ hệ số tải<\/td>\n<td>hệ số đường, tương quan<\/td>\n<\/tr>\n<tr>\n<td>Scalar (strong)<\/td>\n<td>+ hệ số chặn<\/td>\n<td>trung bình biến tiềm ẩn<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>Δχ² nhạy với cỡ mẫu, nên đọc thêm ΔCFI: giảm không quá 0,01 là bất\nbiến được chấp nhận (Cheung &amp; Rensvold, 2002); ΔRMSEA không tăng quá\n0,015 (Chen, 2007).<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<p>Đọc kết quả: từ cấu hình sang metric, Δχ² có p ≈ 0,03 (có ý nghĩa ở\nmức 5%) nhưng ΔCFI chỉ −0,003 và ΔRMSEA +0,004, đều trong ngưỡng. Với n\n= 411 chia hai nhóm, các nhà nghiên cứu thường dựa vào ΔCFI và kết luận\n<strong>đạt bất biến metric và scalar<\/strong>. Báo cáo cả hai loại bằng\nchứng để người đọc tự đánh giá.<\/p>\n<div class=\"warn\">\n<p>Tài liệu cũ hướng dẫn <code>semTools::measurementInvariance()<\/code>.\nHàm này <strong>đã bị gỡ<\/strong> khỏi semTools 0.5-9 nên sẽ báo\n<code>could not find function<\/code>. Dùng <code>group.equal<\/code> như\ntrên, hoặc <code>semTools::measEq.syntax()<\/code> cho dữ liệu thứ\nbậc.<\/p>\n<\/div>\n<h2>So sánh hệ số đường giữa hai\nnhóm<\/h2>\n<p>Khi đã có bất biến metric, ước lượng mô hình cấu trúc đa nhóm. Gắn\nnhãn khác nhau cho mỗi nhóm bằng <code>c(nhan1, nhan2)*<\/code>, rồi định\nnghĩa chênh lệch.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<p>Hệ số TD → YD ở nhóm ít xem là 0,54 và nhóm thường xuyên là 0,37\n(chưa chuẩn hoá), nhưng chênh lệch không có ý nghĩa thống kê (p ≈ 0,21).\nKết luận: chưa có bằng chứng tần suất xem livestream điều tiết tác động\ncủa Thái độ lên Ý định.<\/p>\n<p>Cách khác: ràng buộc đường bằng nhau rồi so mô hình.<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<h2>Điều tiết bằng tương tác\nbiến tiềm ẩn<\/h2>\n<p>Niềm tin (NT) có làm mạnh thêm tác động của Thái độ (TD) lên Ý định\n(YD)? Cách phổ biến trong lavaan: tạo <strong>tích chỉ báo<\/strong>\n(product indicators) đã trung tâm hoá kép (double-mean-centering), rồi\ntạo biến tiềm ẩn tương tác (Marsh, Wen &amp; Hau, 2004).<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<p>Hệ số tương tác TDxNT nhỏ (β ≈ 0,03) và không có ý nghĩa (p ≈ 0,49):\nNiềm tin không điều tiết tác động TD → YD trong dữ liệu này. Khi tương\ntác không có ý nghĩa, phân tích độ dốc đơn giản chỉ để minh hoạ; khi có\ný nghĩa, đây là bước bắt buộc để diễn giải.<\/p>\n<h2>Độ dốc đơn giản (simple\nslopes)<\/h2>\n<p>Tác động TD → YD khi Niềm tin thấp (−1 SD), trung bình và cao (+1\nSD):<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<div class=\"tip\">\n<p>Với PLS-SEM, điều tiết làm gọn hơn bằng\n<code>interaction_term()<\/code> của seminr (Bài 17). CB-SEM với tương\ntác tiềm ẩn chính xác hơn có thể dùng phương pháp LMS\n(<code>modsem<\/code> trong R hoặc Mplus).<\/p>\n<\/div>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(lavaan)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\ndf$nhom <- ifelse(df$tan_suat == \"Thường xuyên\", \"Thường xuyên\", \"Ít hoặc thỉnh thoảng\")\ntable(df$nhom)\ndo_luong <- '\n  HI =~ HI1 + HI2 + HI3 + HI4\n  DD =~ DD1 + DD2 + DD3 + DD4\n  NT =~ NT1 + NT2 + NT3\n  TD =~ TD1 + TD2 + TD3\n  YD =~ YD1 + YD2 + YD3\n  HI1 ~~ HI2\n'","run":true,"seg":[{"t":"o","v":"This is lavaan 0.7-3\nlavaan is FREE software! Please report any bugs.\n\nÍt hoặc thỉnh thoảng         Thường xuyên \n                 295                  116 \n"}]},{"code":"cau_hinh <- cfa(do_luong, data = df, group = \"nhom\", estimator = \"MLR\")\nmetric   <- cfa(do_luong, data = df, group = \"nhom\", estimator = \"MLR\", group.equal = \"loadings\")\nscalar   <- cfa(do_luong, data = df, group = \"nhom\", estimator = \"MLR\",\n                group.equal = c(\"loadings\", \"intercepts\"))\nlavTestLRT(cau_hinh, metric, scalar)","run":true,"seg":[{"t":"o","v":"\nScaled Chi-Squared Difference Test (method = “satorra.bentler.2001”)\n\nlavaan->lavTestLRT():  \n   lavaan NOTE: The “Chisq” column contains standard test statistics, not the \n   robust test that should be reported per model. A robust difference test is a \n   function of two standard (not robust) statistics.\n\n          Df   AIC   BIC Chisq Chisq diff  RMSEA Df diff Pr(>Chisq)  \ncau_hinh 216 16988 17487   242                                       \nmetric   228 16985 17435   263      22.35 0.0622      12      0.034 *\nscalar   240 16970 17372   272       9.46 0.0000      12      0.663  \n---\nSignif. codes:  0 ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\n"}]},{"code":"ch <- sapply(list(cau_hinh = cau_hinh, metric = metric, scalar = scalar),\n             fitMeasures, c(\"cfi.robust\", \"rmsea.robust\", \"srmr\"))\nround(ch, 3)\nround(diff(t(ch)), 3)       # ΔCFI, ΔRMSEA, ΔSRMR giữa các bậc liên tiếp","run":true,"seg":[{"t":"o","v":"             cau_hinh metric scalar\ncfi.robust      0.993  0.990  0.991\nrmsea.robust    0.023  0.026  0.025\nsrmr            0.038  0.046  0.046\n       cfi.robust rmsea.robust  srmr\nmetric     -0.003        0.004 0.008\nscalar      0.001       -0.002 0.001\n"}]},{"code":"mo_hinh_mg <- paste(do_luong, '\n  HI ~ DD\n  TD ~ DD + HI + NT\n  YD ~ HI + NT + c(b_it, b_tx)*TD\n  chenh_TD_YD := b_tx - b_it\n')\nmg <- sem(mo_hinh_mg, data = df, group = \"nhom\", estimator = \"MLR\", group.equal = \"loadings\")\npe <- parameterEstimates(mg, standardized = TRUE)\nround_df <- function(d) { d[sapply(d, is.numeric)] <- lapply(d[sapply(d, is.numeric)], round, 3); d }\nround_df(subset(pe, label %in% c(\"b_it\", \"b_tx\", \"chenh_TD_YD\"),\n                select = c(label, group, est, se, pvalue, std.all)))","run":true,"seg":[{"t":"o","v":"          label group    est    se pvalue std.all\n25         b_it     1  0.541 0.124  0.000   0.505\n95         b_tx     2  0.365 0.074  0.000   0.415\n141 chenh_TD_YD     0 -0.176 0.140  0.208  -0.090\n"}]},{"code":"mg_rb <- sem(mo_hinh_mg, data = df, group = \"nhom\", estimator = \"MLR\",\n             group.equal = \"loadings\",\n             constraints = \"b_tx == b_it\")\nlavTestLRT(mg, mg_rb)","run":true,"seg":[{"t":"o","v":"\nScaled Chi-Squared Difference Test (method = “satorra.bentler.2001”)\n\nlavaan->lavTestLRT():  \n   lavaan NOTE: The “Chisq” column contains standard test statistics, not the \n   robust test that should be reported per model. A robust difference test is a \n   function of two standard (not robust) statistics.\n\n       Df   AIC   BIC Chisq Chisq diff  RMSEA Df diff Pr(>Chisq)\nmg    232 16983 17417   269                                     \nmg_rb 233 16983 17413   270       1.61 0.0502       1        0.2\n"}]},{"code":"library(semTools)\ndf_i <- indProd(df, var1 = c(\"TD1\", \"TD2\", \"TD3\"), var2 = c(\"NT1\", \"NT2\", \"NT3\"),\n                match = TRUE, meanC = TRUE, residualC = FALSE, doubleMC = TRUE)\nnames(df_i)[(ncol(df_i) - 2):ncol(df_i)]\nmo_hinh_dt <- '\n  TD =~ TD1 + TD2 + TD3\n  NT =~ NT1 + NT2 + NT3\n  YD =~ YD1 + YD2 + YD3\n  TDxNT =~ TD1.NT1 + TD2.NT2 + TD3.NT3\n  YD ~ b1*TD + b2*NT + b3*TDxNT\n'\ndt <- sem(mo_hinh_dt, data = df_i, estimator = \"MLR\")\nround_df(subset(standardizedSolution(dt), op == \"~\", select = c(lhs, rhs, est.std, se, pvalue)))","run":true,"seg":[{"t":"o","v":" \n###############################################################################\nThis is semTools 0.5-9\nAll users of R (or SEM) are invited to submit functions or ideas for functions.\n###############################################################################\n[1] \"TD1.NT1\" \"TD2.NT2\" \"TD3.NT3\"\n   lhs   rhs est.std    se pvalue\n13  YD    TD   0.537 0.052  0.000\n14  YD    NT   0.275 0.054  0.000\n15  YD TDxNT   0.034 0.049  0.492\n"}]},{"code":"probe2WayMC(dt, nameX = c(\"TD\", \"NT\", \"TDxNT\"), nameY = \"YD\", modVar = \"NT\",\n            valProbe = c(-1, 0, 1))","run":true,"seg":[{"t":"o","v":"$SimpleIntcept\n  NT    est   se      z pvalue\n1 -1 -0.288 0.06 -4.781      0\n2  0  0.000 0.00    NaN    NaN\n3  1  0.288 0.06  4.781      0\n\n$SimpleSlope\n  NT   est    se     z pvalue\n1 -1 0.458 0.081 5.676      0\n2  0 0.501 0.059 8.550      0\n3  1 0.544 0.090 6.044      0\n\n"}]}],"quiz":[[{"q":"Muốn so sánh hệ số đường TD → YD giữa hai nhóm, tối thiểu cần bậc bất biến nào?","opts":["Cấu hình","Metric (hệ số tải bằng nhau)","Scalar","Không cần"],"ok":1,"why":"Hệ số đường chỉ so sánh được khi thang đo có cùng đơn vị đo (hệ số tải bằng nhau)."},{"q":"Từ cấu hình sang metric, CFI giảm 0,004. Kết luận theo Cheung & Rensvold (2002)?","opts":["Bất biến metric được chấp nhận","Bất biến bị vi phạm","Phải dùng PLS","Không thể kết luận"],"ok":0,"why":"ΔCFI ≤ 0,01."},{"q":"Hàm nào tạo tích chỉ báo để ước lượng tương tác biến tiềm ẩn?","opts":["measurementInvariance()","indProd()","htmt()","AVE()"],"ok":1,"why":"semTools::indProd() tạo tích các cặp chỉ báo, có tuỳ chọn trung tâm hoá kép."}]]},{"id":"b14","so":14,"tieu_de":"PLS-SEM với seminr: khai báo và đo lường kết quả","gd":5,"tg":"120 phút","goi":"seminr","muc_tieu":["Biết khi nào chọn PLS-SEM và quy trình bốn bước của Hair và cộng sự (2022)","Khai báo mô hình bằng constructs() và relationships()","Đánh giá mô hình đo lường kết quả (reflective): hệ số tải, alpha, rhoA, rhoC, AVE","Kiểm định giá trị phân biệt bằng HTMT và khoảng tin cậy bootstrap","Quyết định giữ hay loại câu có hệ số tải 0,40–0,708 bằng số liệu"],"html":"<h2>Khi nào chọn PLS-SEM?<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Tình huống<\/th>\n<th>Nên chọn<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kiểm định lý thuyết đã vững, cần độ phù hợp toàn mô hình<\/td>\n<td>CB-SEM (lavaan, Bài 10–13)<\/td>\n<\/tr>\n<tr>\n<td>Mục tiêu giải thích <strong>và dự báo<\/strong>, lý thuyết đang phát\ntriển<\/td>\n<td>PLS-SEM<\/td>\n<\/tr>\n<tr>\n<td>Có khái niệm cấu tạo (formative)<\/td>\n<td>PLS-SEM<\/td>\n<\/tr>\n<tr>\n<td>Mô hình nhiều khái niệm, nhiều đường, mẫu vừa phải<\/td>\n<td>PLS-SEM<\/td>\n<\/tr>\n<tr>\n<td>Cần điểm số khái niệm để dùng tiếp (IPMA, phân nhóm)<\/td>\n<td>PLS-SEM<\/td>\n<\/tr>\n<tr>\n<td>Cần ràng buộc tham số, bất biến đo lường đầy đủ<\/td>\n<td>CB-SEM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Đừng chọn PLS-SEM chỉ vì “mẫu nhỏ” hay “dữ liệu không chuẩn”: cả hai\nlý do đều bị phản biện bác bỏ (Hair và cộng sự, 2019). Lý do tốt nhất là\nmục tiêu dự báo và có khái niệm cấu tạo.<\/p>\n<p>seminr là gói PLS-SEM mã nguồn mở được dùng trong sách <em>Partial\nLeast Squares Structural Equation Modeling (PLS-SEM) Using R<\/em> của\nHair, Hult, Ringle, Sarstedt, Danks &amp; Ray (2021), truy cập mở. Kết\nquả khớp SmartPLS.<\/p>\n<h2>Quy trình bốn bước<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Bước<\/th>\n<th>Việc<\/th>\n<th>Bài<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Khai báo mô hình đo lường và cấu trúc<\/td>\n<td>Bài 14<\/td>\n<\/tr>\n<tr>\n<td>2a<\/td>\n<td>Đánh giá đo lường <strong>kết quả<\/strong> (reflective)<\/td>\n<td>Bài 14<\/td>\n<\/tr>\n<tr>\n<td>2b<\/td>\n<td>Đánh giá đo lường <strong>cấu tạo<\/strong> (formative)<\/td>\n<td>Bài 15<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Đánh giá mô hình cấu trúc: VIF, hệ số đường, R², f², PLSpredict<\/td>\n<td>Bài 16<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Phân tích bổ sung: trung gian, điều tiết, bậc cao, đa nhóm,\nIPMA<\/td>\n<td>Bài 17–19<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Quy tắc vàng: <strong>chỉ đánh giá mô hình cấu trúc khi mô hình đo\nlường đã đạt<\/strong>.<\/p>\n<h2>Bước 1: Khai báo mô hình<\/h2>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<ul>\n<li><code>multi_items(\"HI\", 1:4)<\/code> tạo tên <code>HI1<\/code>,\n<code>HI2<\/code>, <code>HI3<\/code>, <code>HI4<\/code>. Tên câu khác quy\nluật thì liệt kê: <code>c(\"q5\", \"q7\", \"q9\")<\/code>.<\/li>\n<li><code>composite()<\/code> mặc định <strong>mode A<\/strong>, tương ứng\nđo lường kết quả trong SmartPLS. Bài 15 dùng\n<code>weights = mode_B<\/code> cho đo lường cấu tạo.<\/li>\n<li><code>paths(from, to)<\/code> đọc là “from tác động đến to”. Một dòng\ncó thể khai nhiều đích.<\/li>\n<\/ul>\n<h2>Ước lượng<\/h2>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<p>Mặc định seminr dùng lược đồ trọng số đường dẫn (path weighting),\ndừng khi thay đổi trọng số nhỏ hơn 10⁻⁷, giống SmartPLS. Dữ liệu có ô\nthiếu được thay bằng trung bình; báo cáo số ô thiếu nếu có\n(<code>tom_tat$missing_data<\/code>).<\/p>\n<h2>Bước 2a: Đánh giá đo lường\nkết quả<\/h2>\n<h3 id=\"độ-tin-cậy-chỉ-báo-hệ-số-tải-ngoài\">Độ tin cậy chỉ báo: hệ số\ntải ngoài<\/h3>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<p>Ngưỡng ≥ 0,708, vì 0,708² ≈ 0,50: khái niệm giải thích ít nhất một\nnửa phương sai của câu.<\/p>\n<h3 id=\"độ-tin-cậy-nhất-quán-nội-tại-và-giá-trị-hội-tụ\">Độ tin cậy nhất\nquán nội tại và giá trị hội tụ<\/h3>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<table>\n<thead>\n<tr>\n<th>Chỉ số<\/th>\n<th>Ngưỡng<\/th>\n<th>Ghi chú<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cronbach’s alpha<\/td>\n<td>0,70–0,95<\/td>\n<td>cận dưới của độ tin cậy<\/td>\n<\/tr>\n<tr>\n<td>rhoC (CR)<\/td>\n<td>0,70–0,95<\/td>\n<td>cận trên<\/td>\n<\/tr>\n<tr>\n<td>rhoA<\/td>\n<td>0,70–0,95<\/td>\n<td>nằm giữa alpha và rhoC, Hair khuyên ưu tiên<\/td>\n<\/tr>\n<tr>\n<td>AVE<\/td>\n<td>≥ 0,50<\/td>\n<td>giá trị hội tụ<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Trên 0,95 là dấu hiệu các câu lặp lại cùng một ý, cũng là vấn đề.<\/p>\n<h3 id=\"quyết-định-giữ-hay-loại-hi4\">Quyết định giữ hay loại HI4<\/h3>\n<p>HI4 có hệ số tải 0,64, nằm trong vùng 0,40–0,708. Hair và cộng sự\n(2022) đề xuất: chỉ loại khi việc loại <strong>làm CR hoặc AVE từ dưới\nngưỡng lên trên ngưỡng<\/strong>, và không làm hỏng giá trị nội dung.\nKiểm tra bằng cách ước lượng lại không có HI4:<\/p>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<p>Với HI4, CR và AVE của HI đã đạt (rhoC 0,89, AVE 0,68), nên\n<strong>giữ HI4<\/strong>. Bỏ câu làm tăng chỉ số nhưng không cần thiết\nvà làm hẹp nội dung khái niệm “hữu ích”.<\/p>\n<h3 id=\"giá-trị-phân-biệt-htmt\">Giá trị phân biệt: HTMT<\/h3>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<p>HTMT &lt; 0,85 với khái niệm khác nhau rõ về lý thuyết; &lt; 0,90 với\nkhái niệm gần nhau (như Thái độ và Ý định). Hair và cộng sự (2022)\nkhuyên dùng HTMT thay cho Fornell–Larcker, vì Fornell–Larcker kém nhạy\nkhi hệ số tải chênh nhau ít.<\/p>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<h3 id=\"htmt-có-khoảng-tin-cậy\">HTMT có khoảng tin cậy<\/h3>\n<p>HTMT tính trên mẫu, nên cần kiểm định: cận trên của khoảng tin cậy\nphải dưới ngưỡng. Dùng <code>alpha = 0.10<\/code> để có khoảng hai phía\n90%, tức cận trên là kiểm định <strong>một phía ở mức 5%<\/strong> (Hair\nvà cộng sự, 2021, chương 4). Dùng 5.000 mẫu khi viết bài.<\/p>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<p>Cận trên lớn nhất là của TD → YD, vẫn dưới 0,85: đạt giá trị phân\nbiệt.<\/p>\n<h3 id=\"hệ-số-tải-chéo\">Hệ số tải chéo<\/h3>\n<p>Mỗi câu phải tải lên khái niệm của nó cao hơn lên mọi khái niệm\nkhác.<\/p>\n<div class=\"chunk\" data-i=\"8\"><\/div>\n<p>NT4 tải 0,85 lên NT nhưng 0,41 lên HI: lệch nhưng vẫn rõ ràng. Hệ số\ntải chéo là tiêu chí yếu; bằng chứng chính vẫn là HTMT.<\/p>\n<h2>Bảng đo lường cho báo cáo<\/h2>\n<div class=\"chunk\" data-i=\"9\"><\/div>\n<p>Bảng này có đúng dạng “Bảng 4.x: Kết quả đánh giá mô hình đo lường”\ncủa các luận văn dùng SmartPLS.<\/p>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(seminr)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\ndo_luong <- constructs(\n  composite(\"HI\", multi_items(\"HI\", 1:4)),\n  composite(\"DD\", multi_items(\"DD\", 1:4)),\n  composite(\"NT\", multi_items(\"NT\", 1:4)),\n  composite(\"TD\", multi_items(\"TD\", 1:3)),\n  composite(\"YD\", multi_items(\"YD\", 1:3))\n)\ncau_truc <- relationships(\n  paths(from = \"DD\", to = c(\"HI\", \"TD\")),\n  paths(from = \"HI\", to = c(\"TD\", \"YD\")),\n  paths(from = \"NT\", to = c(\"TD\", \"YD\")),\n  paths(from = \"TD\", to = \"YD\")\n)","run":true,"seg":[]},{"code":"pls <- estimate_pls(data = df, measurement_model = do_luong, structural_model = cau_truc)\ntom_tat <- summary(pls)\ntom_tat$iterations       # số vòng lặp; phải nhỏ hơn mức tối đa 300","run":true,"seg":[{"t":"o","v":"Generating the seminr model\nAll 411 observations are valid.\n[1] 5\n"}]},{"code":"round(tom_tat$loadings, 3)","run":true,"seg":[{"t":"o","v":"       DD    HI    NT    TD    YD\nHI1 0.000 0.891 0.000 0.000 0.000\nHI2 0.000 0.891 0.000 0.000 0.000\nHI3 0.000 0.850 0.000 0.000 0.000\nHI4 0.000 0.644 0.000 0.000 0.000\nDD1 0.813 0.000 0.000 0.000 0.000\nDD2 0.859 0.000 0.000 0.000 0.000\nDD3 0.804 0.000 0.000 0.000 0.000\nDD4 0.823 0.000 0.000 0.000 0.000\nNT1 0.000 0.000 0.814 0.000 0.000\nNT2 0.000 0.000 0.841 0.000 0.000\nNT3 0.000 0.000 0.815 0.000 0.000\nNT4 0.000 0.000 0.849 0.000 0.000\nTD1 0.000 0.000 0.000 0.883 0.000\nTD2 0.000 0.000 0.000 0.888 0.000\nTD3 0.000 0.000 0.000 0.878 0.000\nYD1 0.000 0.000 0.000 0.000 0.881\nYD2 0.000 0.000 0.000 0.000 0.861\nYD3 0.000 0.000 0.000 0.000 0.856\n"}]},{"code":"round(tom_tat$reliability, 3)","run":true,"seg":[{"t":"o","v":"   alpha  rhoA  rhoC   AVE\nDD 0.844 0.848 0.895 0.681\nHI 0.840 0.867 0.894 0.681\nNT 0.850 0.862 0.898 0.689\nTD 0.859 0.859 0.914 0.780\nYD 0.833 0.836 0.900 0.750\n\nAlpha, rhoA, and rhoC should exceed 0.7 while AVE should exceed 0.5\n"}]},{"code":"do_luong_bo <- constructs(\n  composite(\"HI\", multi_items(\"HI\", 1:3)), composite(\"DD\", multi_items(\"DD\", 1:4)),\n  composite(\"NT\", multi_items(\"NT\", 1:4)), composite(\"TD\", multi_items(\"TD\", 1:3)),\n  composite(\"YD\", multi_items(\"YD\", 1:3)))\npls_bo <- estimate_pls(df, do_luong_bo, cau_truc)\nso_sanh <- rbind(co_HI4 = tom_tat$reliability[\"HI\", ], bo_HI4 = summary(pls_bo)$reliability[\"HI\", ])\nround(so_sanh, 3)","run":true,"seg":[{"t":"o","v":"Generating the seminr model\nAll 411 observations are valid.\n       alpha  rhoA  rhoC   AVE\nco_HI4 0.840 0.867 0.894 0.681\nbo_HI4 0.873 0.874 0.922 0.798\n"}]},{"code":"round(tom_tat$validity$htmt, 3)","run":true,"seg":[{"t":"o","v":"      DD    HI    NT    TD YD\nDD     .     .     .     .  .\nHI 0.368     .     .     .  .\nNT 0.439 0.331     .     .  .\nTD 0.496 0.560 0.486     .  .\nYD 0.431 0.457 0.540 0.654  .\n"}]},{"code":"round(tom_tat$validity$fl_criteria, 3)    # vẫn báo cáo nếu hội đồng yêu cầu","run":true,"seg":[{"t":"o","v":"      DD    HI    NT    TD    YD\nDD 0.825     .     .     .     .\nHI 0.319 0.825     .     .     .\nNT 0.376 0.294 0.830     .     .\nTD 0.423 0.479 0.423 0.883     .\nYD 0.359 0.386 0.460 0.555 0.866\n\nFL Criteria table reports square root of AVE on the diagonal and construct correlations on the lower triangle.\n"}]},{"code":"boot <- bootstrap_model(seminr_model = pls, nboot = 1000, cores = 1, seed = 2026)\ntb90 <- summary(boot, alpha = 0.10)\nround(tb90$bootstrapped_HTMT[, c(\"Original Est.\", \"5% CI\", \"95% CI\")], 3)","run":true,"seg":[{"t":"o","v":"Bootstrapping model using seminr...\nSEMinR Model successfully bootstrapped\n           Original Est. 5% CI 95% CI\nDD  ->  HI         0.368 0.278  0.455\nDD  ->  NT         0.439 0.350  0.521\nDD  ->  TD         0.496 0.410  0.578\nDD  ->  YD         0.431 0.339  0.515\nHI  ->  NT         0.331 0.242  0.417\nHI  ->  TD         0.560 0.484  0.628\nHI  ->  YD         0.457 0.370  0.541\nNT  ->  TD         0.486 0.409  0.562\nNT  ->  YD         0.540 0.465  0.614\nTD  ->  YD         0.654 0.586  0.710\n"}]},{"code":"cl <- tom_tat$validity$cross_loadings\nround(cl[c(\"HI4\", \"NT4\"), ], 2)\nkhai_niem <- sub(\"\\\\d+$\", \"\", rownames(cl))\nall(sapply(seq_len(nrow(cl)), function(i) which.max(cl[i, ]) == match(khai_niem[i], colnames(cl))))","run":true,"seg":[{"t":"o","v":"      DD   HI   NT   TD   YD\nHI4 0.15 0.64 0.19 0.30 0.23\nNT4 0.35 0.41 0.85 0.42 0.44\n[1] TRUE\n"}]},{"code":"L <- tom_tat$loadings; R <- tom_tat$reliability\nkn <- sub(\"\\\\d+$\", \"\", rownames(L))\nbang <- data.frame(khai_niem = kn, cau = rownames(L), he_so_tai = round(apply(L, 1, max), 3))\nbang[c(\"alpha\", \"rhoA\", \"rhoC\", \"AVE\")] <- round(unclass(R)[kn, c(\"alpha\", \"rhoA\", \"rhoC\", \"AVE\")], 3)\nbang[] <- lapply(bang, function(x) if (is.numeric(x)) sprintf(\"%.3f\", x) else x)\nbang[duplicated(kn), c(\"alpha\", \"rhoA\", \"rhoC\", \"AVE\")] <- \"\"      # chỉ ghi chỉ số ở dòng đầu mỗi khái niệm\nprint(bang, row.names = FALSE)","run":true,"seg":[{"t":"o","v":" khai_niem cau he_so_tai alpha  rhoA  rhoC   AVE\n        HI HI1     0.891 0.840 0.867 0.894 0.681\n        HI HI2     0.891                        \n        HI HI3     0.850                        \n        HI HI4     0.644                        \n        DD DD1     0.813 0.844 0.848 0.895 0.681\n        DD DD2     0.859                        \n        DD DD3     0.804                        \n        DD DD4     0.823                        \n        NT NT1     0.814 0.850 0.862 0.898 0.689\n        NT NT2     0.841                        \n        NT NT3     0.815                        \n        NT NT4     0.849                        \n        TD TD1     0.883 0.859 0.859 0.914 0.780\n        TD TD2     0.888                        \n        TD TD3     0.878                        \n        YD YD1     0.881 0.833 0.836 0.900 0.750\n        YD YD2     0.861                        \n        YD YD3     0.856                        \n"}]}],"quiz":[[{"q":"Theo Hair và cộng sự (2019), lý do nào KHÔNG nên dùng để biện minh cho việc chọn PLS-SEM?","opts":["Mục tiêu dự báo","Có khái niệm cấu tạo","Chỉ vì dữ liệu không phân phối chuẩn","Mô hình phức tạp nhiều khái niệm"],"ok":2,"why":"Ước lượng MLR của CB-SEM cũng xử lý được dữ liệu không chuẩn."},{"q":"Một câu có hệ số tải 0,62, CR và AVE của khái niệm đều đạt. Quyết định?","opts":["Giữ câu","Loại câu ngay","Đổi sang mode B","Loại cả khái niệm"],"ok":0,"why":"Chỉ loại câu 0,40–0,708 khi loại làm CR hoặc AVE vượt lên ngưỡng."},{"q":"Vì sao dùng alpha = 0.10 khi đọc HTMT bootstrap?","opts":["Để khoảng tin cậy hẹp hơn cho đẹp","Cận trên của khoảng 90% hai phía là kiểm định một phía ở mức 5%","Vì seminr bắt buộc","Vì HTMT luôn dưới 0,9"],"ok":1,"why":"Câu hỏi là \"HTMT có nhỏ hơn ngưỡng không\": kiểm định một phía."},{"q":"rhoC = 0,97. Đánh giá?","opts":["Rất tốt","Quá cao: các câu có thể lặp ý","Chấp nhận được","Cần thêm câu"],"ok":1,"why":"Ngưỡng trên 0,95."}]]},{"id":"b15","so":15,"tieu_de":"PLS-SEM: đo lường cấu tạo (formative)","gd":5,"tg":"90 phút","goi":"seminr","muc_tieu":["Phân biệt đo lường kết quả và đo lường cấu tạo","Kiểm định giá trị hội tụ bằng phân tích dư thừa","Kiểm tra đa cộng tuyến giữa các chỉ báo","Đánh giá ý nghĩa và mức liên quan của trọng số ngoài","Quyết định giữ hay loại chỉ báo cấu tạo theo cây quyết định của Hair"],"html":"<h2>Kết quả hay cấu tạo?<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th><\/th>\n<th>Kết quả (reflective, mode A)<\/th>\n<th>Cấu tạo (formative, mode B)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chiều nhân quả<\/td>\n<td>khái niệm → câu hỏi<\/td>\n<td>câu hỏi → khái niệm<\/td>\n<\/tr>\n<tr>\n<td>Các câu<\/td>\n<td>thay thế nhau được, tương quan cao<\/td>\n<td>mỗi câu một khía cạnh, không cần tương quan<\/td>\n<\/tr>\n<tr>\n<td>Bỏ một câu<\/td>\n<td>ít ảnh hưởng nội dung<\/td>\n<td>làm <strong>mất<\/strong> một phần nội dung khái niệm<\/td>\n<\/tr>\n<tr>\n<td>Đánh giá<\/td>\n<td>hệ số tải, alpha, CR, AVE, HTMT<\/td>\n<td>dư thừa, VIF, trọng số<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Ví dụ: “Chất lượng phiên livestream” được <strong>tạo nên<\/strong>\nbởi hình ảnh và âm thanh, mức phản hồi của người bán, ưu đãi trong\nphiên, và cách trình diễn sản phẩm. Một phiên có âm thanh tốt không vì\nthế mà có ưu đãi tốt: các khía cạnh không cần tương quan. Đây là khái\nniệm cấu tạo.<\/p>\n<div class=\"warn\">\n<p>Không áp alpha, CR, AVE, HTMT cho khái niệm cấu tạo. Các chỉ số này\ngiả định câu hỏi tương quan cao, điều mà đo lường cấu tạo không đòi\nhỏi.<\/p>\n<\/div>\n<h2>Dữ liệu<\/h2>\n<p>Tệp <code>khao_sat_sach.csv<\/code> có thêm năm cột cho bài này:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>Mã<\/th>\n<th>Nội dung (Likert 1–5)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CL1<\/td>\n<td>Hình ảnh, âm thanh của phiên live rõ ràng<\/td>\n<\/tr>\n<tr>\n<td>CL2<\/td>\n<td>Người bán trả lời câu hỏi trong phiên nhanh<\/td>\n<\/tr>\n<tr>\n<td>CL3<\/td>\n<td>Phiên live có ưu đãi riêng<\/td>\n<\/tr>\n<tr>\n<td>CL4<\/td>\n<td>Người bán trình diễn sản phẩm chi tiết<\/td>\n<\/tr>\n<tr>\n<td>CL_G<\/td>\n<td><strong>Câu tổng quát<\/strong>: Nhìn chung, chất lượng các phiên\nlivestream tôi xem là tốt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Câu tổng quát phải được đưa vào bảng hỏi <strong>ngay từ khi thiết\nkế<\/strong>, để làm phân tích dư thừa. Thiếu câu này thì không kiểm được\ngiá trị hội tụ của khái niệm cấu tạo.<\/p>\n<div class=\"chunk\" data-i=\"0\"><\/div>\n<p>Các chỉ báo tương quan thấp với nhau (0,0–0,3): bình thường với đo\nlường cấu tạo.<\/p>\n<h2>Bước 1: Giá trị hội tụ\n(phân tích dư thừa)<\/h2>\n<p>Ước lượng một mô hình nhỏ: khái niệm cấu tạo CL → câu tổng quát CL_G.\nHệ số đường ≥ 0,70 (R² ≥ 0,50) là đạt (Cheah và cộng sự, 2018).<\/p>\n<div class=\"chunk\" data-i=\"1\"><\/div>\n<h2>Mô hình mở rộng<\/h2>\n<p>Đưa CL vào mô hình chính: chất lượng phiên live làm tăng Niềm tin và\nThái độ.<\/p>\n<div class=\"chunk\" data-i=\"2\"><\/div>\n<h2>Bước 2: Đa cộng tuyến\ngiữa các chỉ báo<\/h2>\n<p>Trọng số là hệ số hồi quy bội của khái niệm lên các chỉ báo, nên đa\ncộng tuyến làm trọng số sai lệch và đổi dấu.<\/p>\n<div class=\"chunk\" data-i=\"3\"><\/div>\n<p>VIF &lt; 3 là lý tưởng; 3–5 cần xem lại; ≥ 5 là nghiêm trọng (Hair và\ncộng sự, 2022).<\/p>\n<h2>Bước 3: Ý nghĩa và\nmức liên quan của trọng số<\/h2>\n<div class=\"chunk\" data-i=\"4\"><\/div>\n<p>Trọng số có KTC 95% không chứa 0 là có ý nghĩa: chỉ báo đóng góp\n<strong>tương đối<\/strong> vào khái niệm. Trọng số không có ý nghĩa thì\nxem tiếp hệ số tải (đóng góp <strong>tuyệt đối<\/strong>):<\/p>\n<div class=\"chunk\" data-i=\"5\"><\/div>\n<h2>Cây quyết định giữ hay loại\nchỉ báo<\/h2>\n<div class=\"chunk\" data-i=\"6\"><\/div>\n<p>CL3 (ưu đãi riêng) có trọng số không có ý nghĩa và hệ số tải gần 0.\nTheo Hair và cộng sự (2022), có thể loại CL3 <strong>nếu<\/strong> việc\nloại không làm mất nội dung khái niệm. Ở đây ưu đãi là một khía cạnh\nđáng kể của “chất lượng phiên live” theo lý thuyết, nên một quyết định\nbảo vệ được là <strong>giữ<\/strong> CL3 và bàn luận: sinh viên đánh giá\nchất lượng phiên live chủ yếu qua tương tác và trình diễn, không qua ưu\nđãi. Dù chọn bên nào, phải ghi lý do.<\/p>\n<div class=\"tip\">\n<p>Với đo lường cấu tạo, không loại chỉ báo chỉ vì số liệu. Mỗi chỉ báo\nlà một phần của định nghĩa khái niệm; loại nó là đổi định nghĩa.<\/p>\n<\/div>\n<h2>Kết quả cấu trúc của mô\nhình mở rộng<\/h2>\n<div class=\"chunk\" data-i=\"7\"><\/div>\n<p>CL tác động mạnh lên Niềm tin (β ≈ 0,58). So với mô hình chính (Bài\n16), NT → TD giảm từ 0,24 xuống 0,18 khi có CL: một phần ảnh hưởng của\nniềm tin lên thái độ thực ra đến từ chất lượng phiên live.<\/p>\n<h2>Câu hỏi kiểm tra<\/h2>\n<div class=\"quiz\" data-q=\"0\"><\/div>\n","chunks":[{"code":"library(seminr)\ndf <- read.csv(\"khao_sat_sach.csv\", fileEncoding = \"UTF-8\")\nround(cor(df[c(\"CL1\", \"CL2\", \"CL3\", \"CL4\", \"CL_G\")]), 2)","run":true,"seg":[{"t":"o","v":"      CL1   CL2   CL3  CL4 CL_G\nCL1  1.00  0.28  0.01 0.16 0.45\nCL2  0.28  1.00 -0.03 0.19 0.52\nCL3  0.01 -0.03  1.00 0.00 0.07\nCL4  0.16  0.19  0.00 1.00 0.50\nCL_G 0.45  0.52  0.07 0.50 1.00\n"}]},{"code":"dl_du_thua <- constructs(\n  composite(\"CL\", multi_items(\"CL\", 1:4), weights = mode_B),\n  composite(\"CL_tong\", single_item(\"CL_G\")))\nct_du_thua <- relationships(paths(from = \"CL\", to = \"CL_tong\"))\ndu_thua <- estimate_pls(df, dl_du_thua, ct_du_thua)\nround(du_thua$path_coef[\"CL\", \"CL_tong\"], 3)","run":true,"seg":[{"t":"o","v":"Generating the seminr model\nAll 411 observations are valid.\n[1] 0.721\n"}]},{"code":"do_luong <- constructs(\n  composite(\"CL\", multi_items(\"CL\", 1:4), weights = mode_B),\n  composite(\"HI\", multi_items(\"HI\", 1:4)), composite(\"DD\", multi_items(\"DD\", 1:4)),\n  composite(\"NT\", multi_items(\"NT\", 1:4)), composite(\"TD\", multi_items(\"TD\", 1:3)),\n  composite(\"YD\", multi_items(\"YD\", 1:3)))\ncau_truc <- relationships(\n  paths(from = \"CL\", to = c(\"NT\", \"TD\")),\n  paths(from = \"DD\", to = c(\"HI\", \"TD\")), paths(from = \"HI\", to = c(\"TD\", \"YD\")),\n  paths(from = \"NT\", to = c(\"TD\", \"YD\")), paths(from = \"TD\", to = \"YD\"))\npls_mr <- estimate_pls(df, do_luong, cau_truc)\ntt <- summary(pls_mr)","run":true,"seg":[{"t":"o","v":"Generating the seminr model\nAll 411 observations are valid.\n"}]},{"code":"round(tt$validity
