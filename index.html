  /* ---------- đọc kết quả seminr ---------- */
  function parseSeminr(txt) {
    const lines = txt.replace(/\r/g, '').split('\n');
    const R = { load: {}, rel: [], htmt: [], htmtCI: [], paths: [], ind: [], r2: {}, f2: [], vif: [], vifItem: [] };
    const NUM = /^-?\d+(?:\.\d+)?(?:e-?\d+)?$/;
    const isItem = (a, b) => /\d$/.test(a) && a.replace(/\d+$/, '') === b;
    // 1) bảng hàng "A  ->  B" (bootstrap): cột theo tiêu đề
    let cols = null; const rows = {};
    lines.forEach(l => {
      const hdr = l.match(/Original Est\.|Bootstrap Mean|Bootstrap SD|T Stat\.|\d+(?:\.\d+)?% CI|Bootstrap P Val/g);
      if (hdr && !/->/.test(l)) { cols = hdr; return; }
      const m = l.match(/^\s*(\S+)\s+->\s+(\S+)\s+(.*)$/);
      if (m && cols) {
        const ns = m[3].trim().split(/\s+/).filter(t => NUM.test(t)).map(Number);
        if (ns.length !== cols.length) return;
        const k = m[1] + '>' + m[2] + '|' + (cols.includes('T Stat.') || rows[m[1] + '>' + m[2] + '|t'] ? 't' : 'h');
        const key = cols.includes('Bootstrap P Val') && cols.length === 1 ? m[1] + '>' + m[2] + '|t' : k;
        const r = rows[key] = rows[key] || { from: m[1], to: m[2], kind: key.endsWith('|t') ? 't' : 'h' };
        cols.forEach((c, i) => r[c] = ns[i]);
      }
    });
    Object.values(rows).forEach(r => {
      const lo = r['2.5% CI'] ?? r['5% CI'], hi = r['97.5% CI'] ?? r['95% CI'];
      const o = { from: r.from, to: r.to, est: r['Original Est.'], t: r['T Stat.'], p: r['Bootstrap P Val'], lo, hi, lvl: r['2.5% CI'] != null ? 95 : 90 };
      if (r.kind === 'h') R.htmtCI.push(o); else if (isItem(r.from, r.to)) R.ind.push(o); else R.paths.push(o);
    });
    // 2) khối VIF "X :" + hàng tên + hàng số
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^\s*([A-Za-z][\w.*]*)\s+:\s*$/); if (!m) continue;
      let j = i + 1;
      while (j + 1 < lines.length && lines[j].trim() && !/:\s*$/.test(lines[j])) {
        const ns = lines[j].trim().split(/\s+/), vs = lines[j + 1].trim().split(/\s+/);
        if (ns.length === vs.length && vs.every(v => NUM.test(v))) ns.forEach((n, q) => (isItem(n, m[1]) ? R.vifItem : R.vif).push({ dv: m[1], iv: n, v: +vs[q] }));
        j += 2;
      }
    }
    // 3) ma trận: hàng tiêu đề chỉ gồm tên, các hàng sau là tên + số hoặc "."
    for (let i = 0; i < lines.length; i++) {
      const h = lines[i];
      if (!/^\s+[A-Za-z][\w.^*]*(\s+[A-Za-z][\w.^*]*)*\s*$/.test(h) || /:\s*$/.test(h)) continue;
      const head = h.trim().split(/\s+/); const body = [];
      let j = i + 1;
      for (; j < lines.length; j++) {
        const t = lines[j].trim().split(/\s+/);
        if (t.length !== head.length + 1 || !t.slice(1).every(v => NUM.test(v) || v === '.')) break;
        body.push(t);
      }
      if (!body.length) continue;
      i = j - 1;
      if (head.includes('alpha') && head.includes('AVE')) { body.forEach(t => R.rel.push(Object.fromEntries([['c', t[0]]].concat(head.map((k, q) => [k, +t[q + 1]]))))); continue; }
      const names = body.map(t => t[0]);
      if (names.includes('R^2')) { const r = body.find(t => t[0] === 'R^2'); head.forEach((k, q) => { if (NUM.test(r[q + 1])) R.r2[k] = +r[q + 1]; }); continue; }
      const inHead = names.every(n => head.includes(n));
      if (!inHead) { body.forEach(t => { const v = t.slice(1).map(Number), mx = Math.max(...v.map(Math.abs)); if (mx > 0) R.load[t[0]] = { c: head[v.map(Math.abs).indexOf(mx)], v: v[v.map(Math.abs).indexOf(mx)] }; }); continue; }
      const diag = body.map(t => t[head.indexOf(t[0]) + 1]);
      if (diag.every(d => d === '.')) body.forEach(t => head.forEach((k, q) => { if (NUM.test(t[q + 1]) && k !== t[0]) R.htmt.push({ a: t[0], b: k, v: +t[q + 1] }); }));
      else if (diag.every(d => +d === 0)) body.forEach(t => head.forEach((k, q) => { const v = +t[q + 1]; if (v > 0) R.f2.push({ iv: t[0], dv: k, v }); }));
    }
    return R;
  }

/* R trực tiếp bằng webR: chạy khối mã của bài và trang "R trực tiếp".
   Trong khung artifact, trình duyệt chặn tải R từ máy chủ ngoài → hiện thông báo, kết quả mẫu vẫn giữ nguyên.
   Bản offline (mở tệp HTML bằng Chrome/Edge, có mạng) tải R từ webr.r-wasm.org. */
(function () {
  const { $, esc, toast, renderSegs } = window.APP, L = window.LAB;
  const BASE = 'https://webr.r-wasm.org/v0.6.0/';
  const KNOWN = ['lavaan', 'semTools', 'seminr', 'psych', 'GPArotation', 'cSEM', 'semPlot', 'dplyr', 'ggplot2', 'car', 'readxl', 'haven', 'MVN', 'modsem'];
  let webR = null, shelter = null, ready = null, state = 'idle', rver = '', failMsg = '';
  const installed = new Set();
  let ran = { id: null, upto: -1, notes: new Set() };
  const listeners = new Set();
  const setState = (s, msg) => { state = s; listeners.forEach(f => f(s, msg)); };

  function start(onMsg) {
    if (ready) return ready;
    ready = (async () => {
      setState('loading', 'Đang tải R cho trình duyệt (khoảng 30 MB, lần đầu 10–60 giây)…'); onMsg && onMsg('Đang tải R cho trình duyệt (lần đầu 10–60 giây)…');
      let mod;
      try { mod = await import(BASE + 'webr.mjs'); }
      catch (e) { throw new Error('blocked'); }
      webR = new mod.WebR({ baseUrl: BASE });
      await webR.init();
      shelter = await new webR.Shelter();
      const enc = new TextEncoder();
      await webR.FS.writeFile('/home/web_user/khao_sat_sach.csv', enc.encode(L.csv_sach));
      await webR.FS.writeFile('/home/web_user/khao_sat_tho.csv', enc.encode(L.csv_tho));
      await webR.FS.writeFile('/home/web_user/pilot_khao_sat.csv', enc.encode(L.csv_pilot));
      await webR.FS.writeFile('/home/web_user/pilot_chuyen_gia.csv', enc.encode(L.csv_cg));
      await webR.evalRVoid('options(width = 82, digits = 4, warn = 1); setwd("/home/web_user")');
      // webR không tạo được cụm xử lý song song: thay các hàm parallel bằng bản chạy tuần tự (seminr::bootstrap_model cần)
      await webR.evalRVoid(`local({
        ns <- asNamespace("parallel")
        thay <- list(
          makeCluster = function(...) structure(list(), class = "webr_cl"),
          makePSOCKcluster = function(...) structure(list(), class = "webr_cl"),
          clusterExport = function(...) invisible(NULL),
          clusterEvalQ = function(cl = NULL, expr) invisible(NULL),
          clusterSetRNGStream = function(...) invisible(NULL),
          stopCluster = function(...) invisible(NULL),
          detectCores = function(...) 1L,
          parSapply = function(cl = NULL, X, FUN, ..., simplify = TRUE, USE.NAMES = TRUE, chunk.size = NULL)
            sapply(X, FUN, ..., simplify = simplify, USE.NAMES = USE.NAMES),
          parLapply = function(cl = NULL, X, fun, ..., chunk.size = NULL) lapply(X, fun, ...))
        for (f in names(thay)) { if (bindingIsLocked(f, ns)) unlockBinding(f, ns); assign(f, thay[[f]], envir = ns) }
      })`);
      rver = await (await webR.evalR('paste(R.version$major, R.version$minor, sep = ".")')).toString();
      setState('ready', 'R ' + rver + ' đã sẵn sàng trong trình duyệt');
      return true;
    })().catch(e => {
      ready = null;
      failMsg = e.message === 'blocked'
        ? 'Trang này đang mở trong khung artifact, nơi trình duyệt chặn tải R từ máy chủ ngoài. Kết quả mẫu bên dưới là kết quả thật đã chạy sẵn. Muốn chạy R ngay trên trang, mở bản web https://phuongduycs.github.io/phong-lab-r-sem/ (hoặc bản offline) bằng Chrome hoặc Edge, hoặc chép mã sang RStudio.'
        : 'Không khởi động được R trong trình duyệt: ' + e.message + '. Kiểm tra mạng rồi thử lại, hoặc chép mã sang RStudio.';
      setState('failed', failMsg);
      throw e;
    });
    return ready;
  }

  function pkgsIn(code) {
    const s = new Set(); let m;
    const re = /(?:library|require|requireNamespace)\(\s*["']?([A-Za-z][A-Za-z0-9.]*)["']?|([A-Za-z][A-Za-z0-9.]*)::/g;
    while ((m = re.exec(code))) { const p = m[1] || m[2]; if (KNOWN.includes(p)) s.add(p); }
    return [...s].filter(p => !installed.has(p));
  }
  async function ensurePkgs(code, onMsg) {
    const need = pkgsIn(code); if (!need.length) return;
    onMsg && onMsg('Đang cài gói cho webR: ' + need.join(', ') + ' (chỉ lần đầu, có thể mất 1 phút)…');
    await webR.installPackages(need, { quiet: true });
    need.forEach(p => installed.add(p));
  }
  async function exec(code, graphics) {
    const r = await shelter.captureR(code, {
      withAutoprint: true, captureStreams: true, captureConditions: false,
      captureGraphics: graphics ? { width: 760, height: 500 } : false
    });
    const segs = []; let buf = '';
    r.output.forEach(o => { buf += (o.data || '') + '\n'; });
    if (buf.trim()) segs.push({ t: 'o', v: buf });
    (r.images || []).forEach(img => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0);
      segs.push({ t: 'img', v: c.toDataURL('image/png') });
    });
    shelter.purge();
    return segs;
  }
  /* Bootstrap trong webR chậm hơn R trên máy khoảng 20–30 lần: giảm số lần lặp cho khối mã của bài */
  function lighten(code) {
    const notes = [];
    const rules = [[/\b(nboot\s*=\s*)(\d+)/g, 200], [/\b(bootstrap\s*=\s*)(\d+)/g, 200], [/(\.R\s*=\s*)(\d+)/g, 99],
      [/\b(nRep\s*=\s*)(\d+)/g, 2000], [/\b(n\.iter\s*=\s*)(\d+)/g, 20], [/\b(reps\s*=\s*)(\d+)/g, 3]];
    // csem(.resample_method = "bootstrap") lỗi đệ quy trong webR: bỏ lấy mẫu lại, sai số chuẩn sẽ là NA
    if (/\.resample_method\s*=\s*"(bootstrap|jackknife)"/.test(code)) {
      code = code.replace(/\.resample_method\s*=\s*"(bootstrap|jackknife)"/g, '.resample_method = "none"');
      notes.push('bỏ bootstrap của cSEM vì webR chưa chạy được (sai số chuẩn, t, p hiện NA)');
    }
    rules.forEach(([re, cap]) => { code = code.replace(re, (m, a, n) => { if (+n > cap) { notes.push('giảm ' + a.replace(/\s*=\s*$/, '') + ' ' + n + ' → ' + cap); return a + cap; } return m; }); });
    return { code, notes: [...new Set(notes)] };
  }
  const render = segs => segs.map(s => s.t === 'img' ? `<img src="${s.v}" alt="Hình do webR vẽ">` : renderSegs([s])).join('');

  async function runChunk(b, k, el) {
    let out = el.querySelector('.out');
    const btn = el.querySelector('[data-a="run"]');
    if (out.hidden) out.hidden = false;
    out.classList.remove('collapsed');
    const lbl = out.querySelector('.lbl'), body = out.querySelector('.out-body');
    const keep = body.innerHTML, keepLbl = lbl.textContent;
    const say = m => { lbl.innerHTML = `<span class="spin" aria-hidden="true"></span> ${esc(m)}`; };
    btn.disabled = true;
    try {
      await start(say);
      if (ran.id !== b.id) { await webR.evalRVoid('rm(list = ls(globalenv()), envir = globalenv()); set.seed(2026)'); ran = { id: b.id, upto: -1, notes: new Set() }; }
      for (let j = ran.upto + 1; j < k; j++) {
        if (!b.chunks[j].run) continue;
        say(`Đang chạy khối ${j + 1} phía trên trước (để có đủ biến)…`);
        await ensurePkgs(b.chunks[j].code, say);
        const lj = lighten(b.chunks[j].code); lj.notes.forEach(n => ran.notes.add(n));
        try { await exec(lj.code, false); } catch (e) {}
        ran.upto = j;
      }
      await ensurePkgs(b.chunks[k].code, say);
      const t0 = performance.now(), lt = lighten(b.chunks[k].code);
      lt.notes = [...new Set([...(ran.notes || []), ...lt.notes])]; lt.notes.forEach(n => ran.notes && ran.notes.add(n));
      const tick = () => say(`Đang chạy… ${Math.round((performance.now() - t0) / 1000)} giây${lt.notes.length ? ' (bootstrap đã giảm cho webR)' : ''}`);
      tick(); const timer = setInterval(tick, 1000);
      let segs;
      try { segs = await exec(lt.code, true); }
      catch (e) { segs = [{ t: 'e', v: 'Error: ' + (e.message || e) }]; }
      finally { clearInterval(timer); }
      ran.upto = Math.max(ran.upto, k);
      out.classList.add('live');
      lbl.textContent = `Kết quả chạy trực tiếp (webR, R ${rver}) · ${((performance.now() - t0) / 1000).toFixed(1).replace('.', ',')} giây` +
        (lt.notes.length ? ` · webR: ${lt.notes.join(', ')}; số liệu có thể lệch nhẹ so với kết quả mẫu` : '');
      body.innerHTML = segs.length ? render(segs) : '<pre>(không có gì được in ra)</pre>';
    } catch (e) {
      lbl.textContent = keepLbl || 'Không chạy được';
      body.innerHTML = `<div class="note" style="margin:6px 12px 12px"><p>${esc(failMsg || String(e.message || e))}</p></div>` + keep;
    } finally { btn.disabled = false; }
  }

  /* Trang R trực tiếp */
  const MAU = `# Mã R chạy ngay trong trình duyệt. Ctrl+Enter để chạy.
library(lavaan)
df <- read.csv("khao_sat_sach.csv")
m <- '
  TD =~ TD1 + TD2 + TD3
  YD =~ YD1 + YD2 + YD3
  NT =~ NT1 + NT2 + NT3
  YD ~ TD + NT
'
fit <- sem(m, data = df, estimator = "MLR")
fitMeasures(fit, c("cfi.robust", "rmsea.robust", "srmr"))
subset(standardizedSolution(fit), op == "~")`;
  window.TOOLS['r-truc-tiep'] = function (main) {
    let code; try { code = localStorage.getItem('rsem-console') || MAU; } catch (e) { code = MAU; }
    main.innerHTML = `<header class="page-h"><p class="eyebrow">Sân chơi</p><h1>R trực tiếp trên trình duyệt</h1><p>webR là R thật biên dịch sang WebAssembly. Bốn tệp <code>khao_sat_sach.csv</code>, <code>khao_sat_tho.csv</code>, <code>pilot_khao_sat.csv</code>, <code>pilot_chuyen_gia.csv</code> đã có sẵn trong thư mục làm việc. Gói lavaan, semTools, seminr, psych, cSEM, ggplot2, dplyr tự cài khi bạn gọi <code>library()</code>.</p></header>
      <div class="live-state" id="ls"><span id="lsT">R chưa khởi động. Bấm Chạy để tải R (khoảng 30 MB, chỉ lần đầu).</span></div>
      <div class="grid2 console"><div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Mã R</h2><span class="row"><button class="btn sm" id="rs">Mẫu</button><button class="btn pri sm" id="go">▶ Chạy (Ctrl+Enter)</button></span></div>
        <label class="sr" for="ed">Mã R</label><textarea id="ed" rows="18" spellcheck="false" wrap="off"></textarea></div>
        <div class="panel"><h2>Kết quả</h2><div class="out" id="co" style="border:0;background:none"><div class="out-body"><p class="hint">Kết quả hiện ở đây.</p></div></div></div></div>
      <p class="hint" style="margin-top:14px">Giới hạn: webR chạy một luồng nên bootstrap 5.000 mẫu sẽ chậm; khi luyện dùng 200–500 mẫu. Hàm cần song song (<code>cores &gt; 1</code>) không chạy được, đặt <code>cores = 1</code>.</p>`;
    const ed = $('#ed', main), ls = $('#lsT', main); ed.value = code;
    const show = (s, m) => { if (!document.body.contains(ls)) return listeners.delete(show); ls.innerHTML = (s === 'loading' ? '<span class="spin" aria-hidden="true"></span> ' : '') + esc(m || ''); };
    listeners.add(show); if (state !== 'idle') show(state, state === 'failed' ? failMsg : state === 'ready' ? 'R ' + rver + ' đã sẵn sàng trong trình duyệt' : 'Đang tải R…');
    const go = async () => {
      try { localStorage.setItem('rsem-console', ed.value); } catch (e) {}
      const body = $('#co .out-body', main);
      body.innerHTML = '<p class="hint"><span class="spin"></span> Đang chạy…</p>';
      try {
        await start(m => show('loading', m)); await ensurePkgs(ed.value, m => show('loading', m)); show('ready', 'R ' + rver + ' đã sẵn sàng trong trình duyệt');
        ran = { id: null, upto: -1, notes: new Set() };
        let segs; try { segs = await exec(ed.value, true); } catch (e) { segs = [{ t: 'e', v: 'Error: ' + (e.message || e) }]; }
        body.innerHTML = segs.length ? render(segs) : '<p class="hint">(không có gì được in ra)</p>';
      } catch (e) { body.innerHTML = `<div class="note"><p>${esc(failMsg)}</p></div>`; }
    };
    $('#go', main).onclick = go;
    $('#rs', main).onclick = () => { ed.value = MAU; };
    ed.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); go(); }
      if (e.key === 'Tab') { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText('  ', s, ed.selectionEnd, 'end'); }
    });
  };

  window.WR = { runChunk, start, get state() { return state; } };
})();
</script></body></html>
